postgres:
  image: "registry.redhat.io/rhel9/postgresql-16:latest"
  storage: 1Gi
  database: keycloak
  username: keycloak
  password: keycloak-db-pass

keycloak:
  name: openshell-keycloak
  instances: 1

  hostname: ""

  realm: openshell
  registrationAllowed: true

  clients:
    cli:
      clientId: openshell-cli
      public: true
      # Access token lifetime in seconds. Set high for long-running sandboxes.
      # 86400 = 24 hours. Sandboxes run for days, so short-lived tokens cause
      # ssh-proxy and dashboard failures.
      accessTokenLifespan: 86400
    dashboard:
      clientId: openshell-dashboard
      public: true
      # Each sandbox VM gets its own oauth2-proxy instance behind a unique
      # per-VM Route hostname (<sandbox>-webui-<ns>.apps.<clusterDomain>).
      # Keycloak's redirect URI matching only supports a *trailing* wildcard —
      # confirmed live that "https://*/oauth2/callback" is rejected outright
      # ("Invalid parameter: redirect_uri") — so a single static entry can't
      # cover every sandbox. Each sandbox's setup Job registers its own exact
      # redirect URI onto this client via the Keycloak Admin API instead (see
      # charts/openshell-saw/templates/configmap-scripts.yaml, run-setup.sh).
      # These are just the initial (empty) values before any sandbox exists.
      redirectUris: []
      webOrigins: []

  testUsers:
    - username: developer
      firstName: Developer
      lastName: User
      password: developer
      roles:
        - openshell-user
    - username: admin
      firstName: Admin
      lastName: User
      password: admin
      roles:
        - openshell-user
        - openshell-admin
    - username: alice
      firstName: Alice
      lastName: User
      password: alice
      roles:
        - openshell-user
        - openshell-admin
    - username: bob
      firstName: Bob
      lastName: User
      password: bob
      roles:
        - openshell-user
        - openshell-admin

  roles:
    - openshell-user
    - openshell-admin
