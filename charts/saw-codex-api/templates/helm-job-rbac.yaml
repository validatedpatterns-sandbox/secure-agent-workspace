apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.controller.serviceAccount }}
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
---
# Namespace-scoped Role for resources managed by helm within the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "saw-codex-api.fullname" . }}-controller
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts",
                "pods", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop"]
    verbs: ["update"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/portforward"]
    verbs: ["get"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "saw-codex-api.fullname" . }}-controller
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "saw-codex-api.fullname" . }}-controller
---
# Cluster-scoped ClusterRole — only for resources that must be cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "saw-codex-api.fullname" . }}-controller
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
rules:
  # CodexSession CRs
  - apiGroups: ["saw.redhat.com"]
    resources: ["codexsessions", "codexsessions/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # kopf needs CRD discovery
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  # kopf events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
  # SAW chart creates ClusterRoles and ClusterRoleBindings per sandbox
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  # SCC for setup Jobs
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["anyuid"]
    verbs: ["use"]
  # ConsoleCLIDownloads (for virtctl)
  - apiGroups: ["console.openshift.io"]
    resources: ["consoleclidownloads"]
    verbs: ["get"]
  # SAW chart's registry-reader ClusterRole needs this permission
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    resourceNames: ["default-route"]
    verbs: ["get"]
  # K8s backend: manage session namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list"]
  # K8s backend: manage secrets/configmaps in session namespaces
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "delete", "get", "list"]
  # K8s backend: read Agent Sandbox CRs
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list"]
  # K8s backend: manage StatefulSets in session namespaces
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  # K8s backend: manage routes in session namespaces
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  # K8s backend: SCC for privileged sandbox SA
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["anyuid", "privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "saw-codex-api.fullname" . }}-controller
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.controller.serviceAccount }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "saw-codex-api.fullname" . }}-controller
