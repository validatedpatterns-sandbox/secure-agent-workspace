{{- if .Values.goldenImage.enabled }}
{{- $imageName := include "openshell-gateway-image.imageName" . -}}
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {{ $imageName }}-golden
  labels:
    {{- include "openshell-gateway-image.labels" . | nindent 4 }}
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    registry:
      url: "docker://image-registry.openshift-image-registry.svc:5000/{{ .Release.Namespace }}/{{ $imageName }}:latest"
      pullMethod: node
  storage:
    accessModes:
      - ReadWriteOnce
    {{- if .Values.goldenImage.storageClassName }}
    storageClassName: {{ .Values.goldenImage.storageClassName | quote }}
    {{- end }}
    resources:
      requests:
        storage: {{ .Values.goldenImage.diskSize }}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataSource
metadata:
  name: {{ $imageName }}
  labels:
    {{- include "openshell-gateway-image.labels" . | nindent 4 }}
    instancetype.kubevirt.io/default-instancetype: u1.medium
    instancetype.kubevirt.io/default-preference: fedora
spec:
  source:
    pvc:
      name: {{ $imageName }}-golden
      namespace: {{ .Release.Namespace }}
{{- end }}
