{{- if .Values.ownerResolver.enabled }}
{{- $r := .Values.ownerResolver }}
{{- $kc := .Values.keycloak.existing | default .Values.keycloak.name }}
{{- $url := $r.keycloakUrl | default "" }}
{{- if and $url (not (hasPrefix "https://" $url)) }}
{{- fail "ownerResolver.keycloakUrl must use HTTPS" }}
{{- end }}
{{- $name := $r.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  # Read only: the CA that signs the ingress certificate.
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    resourceNames: ["cluster"]
    verbs: ["get"]
---
# Read only: the operator's HTTPS Route, so the admin credential is never
# sent over the plaintext Service.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
  namespace: openshift-config-managed
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["default-ingress-cert"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
  namespace: openshift-config-managed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  ca-bundle.crt: |
{{ $r.caBundle | default "" | indent 4 }}
  saw_tls.py: |
{{ .Files.Get "files/saw_tls.py" | indent 4 }}
  owner-resolver.py: |
{{ .Files.Get "files/owner-resolver.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/script: {{ print (.Files.Get "files/owner-resolver.py") (.Files.Get "files/saw_tls.py") ($r.caBundle | default "") | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: {{ $r.image | quote }}
          command: ["python3", "/scripts/owner-resolver.py", "bootstrap"]
          env:
            - name: KC_URL
              value: {{ $url | quote }}
            - name: KEYCLOAK_NAME
              value: {{ $kc | quote }}
            - name: KEYCLOAK_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- if $r.caBundle }}
            - name: CA_FILE
              value: /scripts/ca-bundle.crt
            {{- end }}
            - name: REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: CLIENT_ID
              value: {{ $r.clientId | quote }}
            - name: ADMIN_DIR
              value: /admin
            - name: OUT
              value: /run/resolver/client-secret
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: admin
              mountPath: /admin
              readOnly: true
            - name: run
              mountPath: /run/resolver
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: resolver
          image: {{ $r.image | quote }}
          command: ["python3", "/scripts/owner-resolver.py", "run"]
          env:
            - name: KC_URL
              value: {{ $url | quote }}
            - name: KEYCLOAK_NAME
              value: {{ $kc | quote }}
            - name: KEYCLOAK_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- if $r.caBundle }}
            - name: CA_FILE
              value: /scripts/ca-bundle.crt
            {{- end }}
            - name: REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: CLIENT_ID
              value: {{ $r.clientId | quote }}
            - name: SECRET_FILE
              value: /run/resolver/client-secret
            - name: INTERVAL
              value: {{ $r.intervalSeconds | quote }}
            - name: NAMESPACE_SELECTOR
              value: {{ $r.namespaceSelector | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: run
              mountPath: /run/resolver
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        - name: admin
          secret:
            secretName: {{ $r.adminSecret | default (printf "%s-initial-admin" $kc) }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
