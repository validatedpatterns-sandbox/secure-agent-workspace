apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-scripts
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  run-setup.sh: |
    #!/usr/bin/env bash
    # Job entrypoint: wait for DataVolume provisioning, start VM, SCP scripts, run sandbox setup.
    set -euo pipefail

    VM_NAME="{{ include "openshell-sandbox.fullname" . }}"
    NS="{{ .Release.Namespace }}"
    SSH_USER="{{ .Values.sshUser }}"
    SSH_SECRET="{{ .Values.sshSecret }}"

    SCRIPTS_DIR="/scripts"
    SECRETS_DIR="/secrets"
    WORK_DIR="/tmp/setup-work"
    mkdir -p "${WORK_DIR}"

    # --- Install dependencies (in the Job Pod, not the VM) ---
    echo "Installing openssh-clients..."
    dnf install -y --setopt=install_weak_deps=False openssh-clients {{ if .Values.dashboard.enabled }}jq{{ end }}

    echo "Installing kubectl..."
    K8S_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
    curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${K8S_VERSION}/bin/linux/amd64/kubectl"
    chmod +x /usr/local/bin/kubectl

    echo "Downloading virtctl from cluster..."
    VIRTCTL_URL="$(kubectl get ConsoleCLIDownload virtctl-clidownloads-kubevirt-hyperconverged \
      -o jsonpath='{.spec.links[?(@.text=="Download virtctl for Linux for x86_64")].href}' 2>/dev/null || true)"
    if [[ -n "${VIRTCTL_URL}" ]]; then
      echo "  using cluster URL: ${VIRTCTL_URL}"
      curl -fsSL "${VIRTCTL_URL}" | tar xz -C /usr/local/bin virtctl
    else
      VIRTCTL_VERSION="{{ .Values.virtctlVersion }}"
      echo "  ConsoleCLIDownload not found, falling back to GitHub ${VIRTCTL_VERSION}"
      curl -fsSL -o /usr/local/bin/virtctl \
        "https://github.com/kubevirt/kubevirt/releases/download/${VIRTCTL_VERSION}/virtctl-${VIRTCTL_VERSION}-linux-amd64"
    fi
    chmod +x /usr/local/bin/virtctl

    # --- Extract SSH identity from Secret ---
    echo "Extracting SSH identity..."
    SSH_KEY="${WORK_DIR}/id_ssh"
    cp /ssh-key/key "${SSH_KEY}"
    chmod 600 "${SSH_KEY}"

    # --- Bootstrap golden image DataSource if missing ---
    GOLDEN_DS="{{ .Values.source.dataSource }}"
    GOLDEN_NS="{{ .Values.source.dataSourceNamespace | default .Release.Namespace }}"
    GOLDEN_DISK_SIZE="{{ .Values.vm.diskSize }}"
    GOLDEN_IMAGE_URL="{{ .Values.source.goldenImageURL }}"
    if [[ -z "${GOLDEN_IMAGE_URL}" ]]; then
      GOLDEN_IMAGE_URL="docker://image-registry.openshift-image-registry.svc:5000/${GOLDEN_NS}/${GOLDEN_DS}:latest"
    fi

    if [[ -n "${GOLDEN_DS}" ]]; then
      DS_EXISTS="$(kubectl get datasource "${GOLDEN_DS}" -n "${GOLDEN_NS}" -o name 2>/dev/null || true)"
      DV_PHASE="$(kubectl get dv "${GOLDEN_DS}-golden" -n "${GOLDEN_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"

      # Case 1: No DataVolume — create both DV + DS and wait
      if [[ -z "${DV_PHASE}" ]]; then
        echo "Golden image not found. Creating DataVolume + DataSource from registry..."
        kubectl apply -f - <<DVEOF
    apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      name: ${GOLDEN_DS}-golden
      namespace: ${GOLDEN_NS}
      annotations:
        cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    spec:
      source:
        registry:
          url: "${GOLDEN_IMAGE_URL}"
          pullMethod: {{ .Values.source.pullMethod | default "node" }}
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: ${GOLDEN_DISK_SIZE}
    DVEOF
        DV_PHASE="pending"
      fi

      # Case 2: DataVolume exists but not Succeeded — wait for import
      if [[ "${DV_PHASE}" != "Succeeded" ]]; then
        echo "Waiting for golden image import..."
        golden_deadline=$((SECONDS + 900))
        while true; do
          DV_PHASE="$(kubectl get dv "${GOLDEN_DS}-golden" -n "${GOLDEN_NS}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          gprog="$(kubectl get dv "${GOLDEN_DS}-golden" -n "${GOLDEN_NS}" -o jsonpath='{.status.progress}' 2>/dev/null || true)"
          echo "  golden image: phase=${DV_PHASE:-pending} progress=${gprog:-N/A}"
          if [[ "${DV_PHASE}" == "Succeeded" ]]; then break; fi
          if (( SECONDS > golden_deadline )); then
            echo "Timed out waiting for golden image import" >&2
            exit 1
          fi
          sleep 15
        done
      fi

      # Case 3: DataVolume Succeeded but DataSource missing — create DS only
      if [[ -z "${DS_EXISTS}" ]]; then
        echo "Creating DataSource '${GOLDEN_DS}'..."
        kubectl apply -f - <<DSEOF
    apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataSource
    metadata:
      name: ${GOLDEN_DS}
      namespace: ${GOLDEN_NS}
    spec:
      source:
        pvc:
          name: ${GOLDEN_DS}-golden
          namespace: ${GOLDEN_NS}
    DSEOF
      fi

      echo "Golden image ready (DataVolume: Succeeded, DataSource: ${GOLDEN_DS})."

      # If the VM was created before the DataSource existed, its DataVolume
      # was never created by KubeVirt. Create it directly so the VM can boot.
      # Race-safe: kubectl apply is idempotent. If KubeVirt or another Job
      # created it concurrently, apply succeeds or no-ops.
      DV_NAME="${VM_NAME}-root"
      if ! kubectl get dv "${DV_NAME}" -n "${NS}" >/dev/null 2>&1; then
        echo "VM DataVolume '${DV_NAME}' missing — creating clone from DataSource..."
        kubectl apply -f - <<CLONEDV || echo "DataVolume already exists or conflict — continuing"
    apiVersion: cdi.kubevirt.io/v1beta1
    kind: DataVolume
    metadata:
      name: ${DV_NAME}
      namespace: ${NS}
      annotations:
        cdi.kubevirt.io/storage.bind.immediate.requested: "true"
    spec:
      sourceRef:
        kind: DataSource
        name: ${GOLDEN_DS}
        namespace: ${GOLDEN_NS}
      storage:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.vm.diskSize }}
    CLONEDV
      fi
    fi

    # --- Wait for DataVolume provisioning ---
    DV_NAME="${VM_NAME}-root"
    echo "Waiting for DataVolume ${DV_NAME} to be provisioned..."
    deadline=$((SECONDS + 900))
    while true; do
      dv_phase="$(kubectl -n "${NS}" get datavolume "${DV_NAME}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
      echo "  datavolume phase=${dv_phase:-unknown}"
      if [[ "${dv_phase}" == "Succeeded" ]]; then
        break
      fi
      if (( SECONDS > deadline )); then
        echo "Timed out waiting for DataVolume provisioning" >&2
        exit 1
      fi
      sleep 10
    done

    # --- Create cloud-init Secret from template ConfigMap ---
    CLOUDINIT_SECRET="${VM_NAME}-cloudinit"
    CLOUDINIT_TEMPLATE="${VM_NAME}-cloudinit-template"
    echo "Ensuring cloud-init secret from template..."
    USERDATA="$(kubectl get configmap "${CLOUDINIT_TEMPLATE}" -n "${NS}" -o jsonpath='{.data.userData}')"
    PUB_KEY=""
    if [[ -f /ssh-key/public_key ]]; then
      PUB_KEY="$(cat /ssh-key/public_key)"
    fi
    if [[ -z "${PUB_KEY}" ]]; then
      PUB_KEY="$(kubectl get secret {{ .Values.sshSecret }} -n "${NS}" -o jsonpath='{.data.public_key}' 2>/dev/null | base64 -d || true)"
    fi
    if [[ -n "${PUB_KEY}" ]]; then
      USERDATA="$(echo "${USERDATA}" | sed "s|__SSH_PUBLIC_KEY__|${PUB_KEY}|g")"
      echo "SSH public key injected into cloud-init"
    else
      echo "WARNING: No SSH public key found, VM may not be accessible via SSH"
    fi
    kubectl create secret generic "${CLOUDINIT_SECRET}" -n "${NS}" \
      --from-literal=userData="${USERDATA}" \
      --dry-run=client -o yaml | kubectl apply -f -
    echo "Cloud-init secret '${CLOUDINIT_SECRET}' ready"

    # --- Label VM ---
    echo "Labeling vm/${VM_NAME}..."
    kubectl -n "${NS}" label vm "${VM_NAME}" \
      "app.kubernetes.io/name=${VM_NAME}" \
      "app.kubernetes.io/part-of=openshell-cnv-fedora" \
      "openshell.pattern/role=gateway" \
      --overwrite

    # --- Wait for VMI Running + Ready ---
    echo "Waiting for vmi/${VM_NAME} to be Running and Ready..."
    deadline=$((SECONDS + 600))
    while true; do
      phase="$(kubectl -n "${NS}" get vmi "${VM_NAME}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
      ready="$(kubectl -n "${NS}" get vmi "${VM_NAME}" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
      echo "  vmi phase=${phase:-pending} ready=${ready:-false}"
      if [[ "${phase}" == "Running" && "${ready}" == "True" ]]; then
        break
      fi
      if (( SECONDS > deadline )); then
        echo "Timed out waiting for VMI Ready" >&2
        exit 1
      fi
      sleep 8
    done

    # --- Wait for SSH ---
    guest_ssh() {
      virtctl -n "${NS}" ssh "${SSH_USER}@vm/${VM_NAME}" \
        --identity-file="${SSH_KEY}" \
        --local-ssh-opts=-oStrictHostKeyChecking=no \
        --local-ssh-opts=-oUserKnownHostsFile=/dev/null \
        --command="$1"
    }

    guest_scp() {
      virtctl -n "${NS}" scp "$1" \
        "${SSH_USER}@vm/${VM_NAME}:$2" \
        --identity-file="${SSH_KEY}" \
        --local-ssh-opts=-oStrictHostKeyChecking=no \
        --local-ssh-opts=-oUserKnownHostsFile=/dev/null
    }

    echo "Waiting for guest SSH on vm/${VM_NAME}..."
    deadline=$((SECONDS + 300))
    ssh_ok=0
    while (( SECONDS <= deadline )); do
      if guest_ssh "echo ssh-ok" >/dev/null 2>&1; then
        ssh_ok=1
        break
      fi
      sleep 8
    done
    if [[ "${ssh_ok}" -ne 1 ]]; then
      echo "SSH not ready in time" >&2
      exit 1
    fi

    # --- Wait for cloud-init to finish (installs OpenShell binaries) ---
    echo "Waiting for cloud-init to finish..."
    deadline=$((SECONDS + 600))
    while true; do
      if guest_ssh "cloud-init status 2>/dev/null | grep -q done" 2>/dev/null; then
        echo "Cloud-init finished."
        break
      fi
      if (( SECONDS > deadline )); then
        echo "WARNING: cloud-init did not finish in time, proceeding anyway..."
        break
      fi
      sleep 10
    done

    # --- Post-clone hygiene ---
    echo "Post-clone hygiene (hostname)..."
    guest_ssh "sudo hostnamectl set-hostname '${VM_NAME}' || true; openshell gateway select openshell >/dev/null 2>&1 || true" || true

    # --- Resolve sandbox image ---
    # Read from env (set via values.yaml sandboxImage), or auto-detect from internal registry
    source "${SECRETS_DIR}/run-create.env" 2>/dev/null || true
    if [[ -z "${SANDBOX_IMAGE:-}" ]]; then
      REGISTRY_ROUTE="$(kubectl get route default-route -n openshift-image-registry -o jsonpath='{.spec.host}' 2>/dev/null || true)"
      if [[ -n "${REGISTRY_ROUTE}" ]]; then
        echo "Authenticating VM to image registry (${REGISTRY_ROUTE})..."
        SA_TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
        # Configure Docker daemon to trust the internal registry (self-signed cert).
        # Merge with existing daemon.json to preserve any prior settings.
        guest_ssh "sudo mkdir -p /etc/docker && if [ -f /etc/docker/daemon.json ]; then jq --arg r '${REGISTRY_ROUTE}' '.\"insecure-registries\" = ([.\"insecure-registries\"[]?, \$r] | unique)' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.tmp >/dev/null && sudo mv /etc/docker/daemon.json.tmp /etc/docker/daemon.json; else echo '{\"insecure-registries\":[\"${REGISTRY_ROUTE}\"]}' | sudo tee /etc/docker/daemon.json >/dev/null; fi && sudo systemctl restart docker && sleep 3 && sudo systemctl is-active docker" || {
          echo "ERROR: failed to configure Docker insecure-registries for ${REGISTRY_ROUTE}" >&2
          exit 1
        }
        if ! guest_ssh "echo '${SA_TOKEN}' | docker login --username unused --password-stdin '${REGISTRY_ROUTE}'" 2>&1; then
          echo "ERROR: docker login failed for ${REGISTRY_ROUTE}" >&2
          exit 1
        fi
        if ! guest_ssh "echo '${SA_TOKEN}' | sudo docker login --username unused --password-stdin '${REGISTRY_ROUTE}'" 2>&1; then
          echo "ERROR: sudo docker login failed for ${REGISTRY_ROUTE}" >&2
          exit 1
        fi
        BUILD_NS="{{ .Values.source.dataSourceNamespace | default .Release.Namespace }}"
        SANDBOX_IMAGE="${REGISTRY_ROUTE}/${BUILD_NS}/nemoclaw-sandbox:latest"
      fi
    fi
    if [[ -n "${SANDBOX_IMAGE:-}" ]]; then
      echo "Sandbox image: ${SANDBOX_IMAGE}"
    fi

    # --- Install OpenShell gateway and supervisor binaries ---
    GATEWAY_IMAGE="{{ .Values.openshell.gatewayImage }}"
    SUPERVISOR_IMAGE="{{ .Values.openshell.supervisorImage }}"
    OPENSHELL_PIP_VERSION="{{ .Values.openshell.version }}"
    echo "Installing OpenShell binaries (gateway=${GATEWAY_IMAGE}, supervisor=${SUPERVISOR_IMAGE}, cli=${OPENSHELL_PIP_VERSION})..."
    if ! guest_ssh "
      docker pull '${GATEWAY_IMAGE}' && \
      CID=\$(docker create '${GATEWAY_IMAGE}') && \
      docker cp \${CID}:/usr/local/bin/openshell-gateway /tmp/openshell-gateway && \
      docker rm \${CID} && \
      sudo mv /tmp/openshell-gateway /usr/local/bin/openshell-gateway && \
      sudo chmod 755 /usr/local/bin/openshell-gateway && \
      echo 'gateway installed'
    "; then
      echo "ERROR: gateway binary install failed" >&2; exit 1
    fi
    if ! guest_ssh "
      docker pull '${SUPERVISOR_IMAGE}' && \
      CID=\$(docker create '${SUPERVISOR_IMAGE}') && \
      docker cp \${CID}:/openshell-sandbox /tmp/openshell-supervisor && \
      docker rm \${CID} && \
      sudo mv /tmp/openshell-supervisor /usr/local/bin/openshell-supervisor && \
      sudo chmod 755 /usr/local/bin/openshell-supervisor && \
      echo 'supervisor installed'
    "; then
      echo "ERROR: supervisor binary install failed" >&2; exit 1
    fi
    if ! guest_ssh "
      pip3 install openshell==${OPENSHELL_PIP_VERSION} \
        {{- if .Values.openshell.pipIndexUrl }}
        --extra-index-url {{ .Values.openshell.pipIndexUrl }} \
        {{- end }}
        && echo 'openshell CLI installed'
    "; then
      echo "ERROR: openshell CLI install failed" >&2; exit 1
    fi
    guest_ssh "openshell-gateway --version; openshell-supervisor --version; openshell --version"

    # --- Install lsof (needed by nemoclaw for gateway listener identification) ---
    echo "Installing lsof..."
    guest_ssh "sudo dnf install -y lsof 2>&1 | tail -3" || echo "WARN: lsof install failed (non-fatal)"

    # --- Restart gateway with new binaries ---
    echo "Restarting gateway service..."
    if ! guest_ssh "systemctl --user restart openshell-gateway.service && sleep 3 && systemctl --user is-active openshell-gateway.service"; then
      echo "ERROR: gateway failed to start after binary install" >&2; exit 1
    fi

    # --- SCP SA JSON + scripts ---
    echo "Copying scripts to vm/${VM_NAME}..."
    {{- if .Values.vertexSaJson }}
    guest_scp "/gcp-sa/sa.json" "/home/${SSH_USER}/vertex-sa-{{ .Values.sandboxName }}.json"
    {{- end }}
    for script in configure-vertex-user.sh setup-nemoclaw.sh inject-user-pubkey.sh setup-dashboard.sh run-create.sh; do
      guest_scp "${SCRIPTS_DIR}/${script}" "/home/${SSH_USER}/${script}"
    done
    cp "${SECRETS_DIR}/run-create.env" "${WORK_DIR}/run-create.env"
    source "${WORK_DIR}/run-create.env" 2>/dev/null || true
    # Fetch OIDC token from Keycloak if not already provided
    if [[ -z "${OIDC_TOKEN:-}" && -n "${OIDC_ISSUER:-}" ]]; then
      OWNER="{{ .Values.accessControl.owner }}"
      if [[ -n "${OWNER}" ]]; then
        echo "Fetching OIDC token for '${OWNER}' from Keycloak..."
        TOKEN_RESPONSE=$(curl -sk -X POST "${OIDC_ISSUER}/protocol/openid-connect/token" \
          -d "grant_type=password" \
          -d "client_id=${OIDC_CLIENT_ID:-openshell-cli}" \
          -d "username=${OWNER}" \
          -d "password=${OWNER}" \
          -d "scope=openid" 2>/dev/null || true)
        OIDC_TOKEN=$(echo "${TOKEN_RESPONSE}" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        if [[ -n "${OIDC_TOKEN}" ]]; then
          echo "OIDC_TOKEN=${OIDC_TOKEN}" >> "${WORK_DIR}/run-create.env"
          echo "OIDC token obtained for ${OWNER}"
        else
          echo "WARNING: Could not fetch OIDC token (sandbox will deploy without OIDC auth)"
        fi
      fi
    fi
    # Inject SSH public key from the SSH secret if not set via helm values
    if [[ -f /ssh-key/public_key ]]; then
      SSH_PUB="$(cat /ssh-key/public_key)"
      if [[ -n "${SSH_PUB}" ]]; then
        echo "SSH_PUBKEY=\"${SSH_PUB}\"" >> "${WORK_DIR}/run-create.env"
        guest_ssh "mkdir -p ~/.ssh && chmod 700 ~/.ssh && echo '${SSH_PUB}' >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys" || true
        echo "Injected SSH public key from secret"
      fi
    fi
    # Inject provider, model, and API key from ESO-managed secret (mounted at /provider-secret)
    if [[ -f /provider-secret/provider ]]; then
      PROVIDER_FROM_SECRET="$(cat /provider-secret/provider)"
      if [[ -n "${PROVIDER_FROM_SECRET}" ]]; then
        echo "NEMOCLAW_PROVIDER=${PROVIDER_FROM_SECRET}" >> "${WORK_DIR}/run-create.env"
        echo "Injected provider from secret: ${PROVIDER_FROM_SECRET}"
      fi
    fi
    if [[ -f /provider-secret/model ]]; then
      MODEL_FROM_SECRET="$(cat /provider-secret/model)"
      if [[ -n "${MODEL_FROM_SECRET}" ]]; then
        echo "NEMOCLAW_MODEL=${MODEL_FROM_SECRET}" >> "${WORK_DIR}/run-create.env"
        echo "Injected model from secret: ${MODEL_FROM_SECRET}"
      fi
    fi
    if [[ -f /provider-secret/api_key ]]; then
      PROVIDER_KEY="$(cat /provider-secret/api_key)"
      if [[ -n "${PROVIDER_KEY}" ]]; then
        echo "NEMOCLAW_API_KEY=${PROVIDER_KEY}" >> "${WORK_DIR}/run-create.env"
        echo "Injected API key from provider secret"
      fi
    fi
    if [[ -f /provider-secret/sa_json ]]; then
      echo "$(cat /provider-secret/sa_json)" > "${WORK_DIR}/vertex-sa.json"
      echo "SA_JSON=/home/${SSH_USER}/vertex-sa-{{ .Values.sandboxName }}.json" >> "${WORK_DIR}/run-create.env"
      guest_scp "${WORK_DIR}/vertex-sa.json" "/home/${SSH_USER}/vertex-sa-{{ .Values.sandboxName }}.json"
      echo "Injected Vertex SA JSON from provider secret"
    fi
    if [[ -n "${SANDBOX_IMAGE:-}" ]]; then
      echo "SANDBOX_IMAGE=${SANDBOX_IMAGE}" >> "${WORK_DIR}/run-create.env"
    fi
    if [[ -n "${REGISTRY_ROUTE:-}" ]]; then
      echo "NEMOCLAW_CLI_IMAGE=${REGISTRY_ROUTE}/${BUILD_NS}/nemoclaw-cli:latest" >> "${WORK_DIR}/run-create.env"
    fi
    {{- if .Values.dashboard.enabled }}
    # --- Resolve dashboard webui Route for oauth2-proxy redirect URL ---
    WEBUI_ROUTE_HOST="$(kubectl get route "${VM_NAME}-webui" -n "${NS}" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
    if [[ -n "${WEBUI_ROUTE_HOST}" ]]; then
      DASHBOARD_REDIRECT_URL="https://${WEBUI_ROUTE_HOST}/oauth2/callback"
      echo "DASHBOARD_REDIRECT_URL=${DASHBOARD_REDIRECT_URL}" >> "${WORK_DIR}/run-create.env"

      # --- Register this sandbox's exact redirect URI on the shared Keycloak
      # client. Keycloak's redirect URI matching only supports a *trailing*
      # wildcard, which can't express "any per-VM hostname, fixed path" — a
      # single "https://*/oauth2/callback" entry is rejected outright
      # ("Invalid parameter: redirect_uri"). Read-modify-write the client's
      # redirectUris/webOrigins via the Admin API instead.
      KC_NS="{{ .Values.dashboard.keycloakNamespace | default .Release.Namespace }}"
      KC_ADMIN_SECRET="{{ .Values.oidc.keycloakName }}-initial-admin"
      KC_ADMIN_USER="$(kubectl get secret "${KC_ADMIN_SECRET}" -n "${KC_NS}" -o jsonpath='{.data.username}' 2>/dev/null | base64 -d || true)"
      KC_ADMIN_PASS="$(kubectl get secret "${KC_ADMIN_SECRET}" -n "${KC_NS}" -o jsonpath='{.data.password}' 2>/dev/null | base64 -d || true)"
      KC_BASE="$(echo "${OIDC_ISSUER:-}" | sed 's#/realms/.*##')"
      KC_REALM="{{ .Values.oidc.realm }}"
      DASHBOARD_CLIENT_ID="{{ .Values.dashboard.clientId }}"
      if [[ -n "${KC_ADMIN_USER}" && -n "${KC_BASE}" ]]; then
        echo "Registering redirect URI on Keycloak client '${DASHBOARD_CLIENT_ID}'..."
        KC_ADMIN_TOKEN="$(curl -sk -X POST "${KC_BASE}/realms/master/protocol/openid-connect/token" \
          -d "grant_type=password" -d "client_id=admin-cli" \
          -d "username=${KC_ADMIN_USER}" -d "password=${KC_ADMIN_PASS}" \
          | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')"
        if [[ -n "${KC_ADMIN_TOKEN}" ]]; then
          CLIENT_UUID="$(curl -sk -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
            "${KC_BASE}/admin/realms/${KC_REALM}/clients?clientId=${DASHBOARD_CLIENT_ID}" \
            | jq -r '.[0].id // empty')"
          if [[ -n "${CLIENT_UUID}" ]]; then
            CLIENT_JSON="$(curl -sk -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" \
              "${KC_BASE}/admin/realms/${KC_REALM}/clients/${CLIENT_UUID}")"
            WEBUI_ORIGIN="https://${WEBUI_ROUTE_HOST}"
            UPDATED_JSON="$(echo "${CLIENT_JSON}" | jq \
              --arg redirect "${DASHBOARD_REDIRECT_URL}" --arg origin "${WEBUI_ORIGIN}" \
              '.redirectUris = ((.redirectUris // []) + [$redirect] | unique) |
               .webOrigins = ((.webOrigins // []) + [$origin] | unique)')"
            HTTP_CODE="$(curl -sk -o /dev/null -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${KC_ADMIN_TOKEN}" -H "Content-Type: application/json" \
              -d "${UPDATED_JSON}" \
              "${KC_BASE}/admin/realms/${KC_REALM}/clients/${CLIENT_UUID}")"
            if [[ "${HTTP_CODE}" == "204" ]]; then
              echo "Redirect URI registered: ${DASHBOARD_REDIRECT_URL}"
            else
              echo "WARNING: failed to register redirect URI (HTTP ${HTTP_CODE}) — dashboard OIDC login will fail"
            fi
          else
            echo "WARNING: Keycloak client '${DASHBOARD_CLIENT_ID}' not found — dashboard OIDC login will fail"
          fi
        else
          echo "WARNING: could not obtain Keycloak admin token — dashboard OIDC login will fail"
        fi
      else
        echo "WARNING: Keycloak admin credentials not found in ${KC_NS}/${KC_ADMIN_SECRET} — dashboard OIDC login will fail"
      fi
    else
      echo "WARNING: ${VM_NAME}-webui route not found — dashboard OIDC redirect will be misconfigured"
    fi
    {{- end }}
    guest_scp "${WORK_DIR}/run-create.env" "/home/${SSH_USER}/run-create.env"

    # --- Run sandbox setup ---
    echo "Running sandbox setup on vm/${VM_NAME}..."
    guest_ssh "bash /home/${SSH_USER}/run-create.sh"

    echo "Setup complete: sandbox={{ .Values.sandboxName }} on vm/${VM_NAME}"

  configure-vertex-user.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    SA_JSON="${SA_JSON:?}"
    PROVIDER_NAME="${PROVIDER_NAME:?}"
    REGION="${VERTEX_AI_REGION:-global}"
    MODEL="${VERTEX_MODEL:-claude-sonnet-4-6}"
    GATEWAY_NAME="${OPENSHELL_GATEWAY:-openshell}"

    test -r "${SA_JSON}"
    PROJECT_ID="$(jq -r '.project_id // empty' "${SA_JSON}")"
    CLIENT_EMAIL="$(jq -r '.client_email // empty' "${SA_JSON}")"
    PRIVATE_KEY="$(jq -r '.private_key // empty' "${SA_JSON}")"

    if [[ -z "${PRIVATE_KEY}" || "${PRIVATE_KEY}" == "null" || -z "${CLIENT_EMAIL}" || "${CLIENT_EMAIL}" == "null" ]]; then
      echo "vertex_skip incomplete SA JSON (missing private_key/client_email); continuing without Vertex"
      exit 0
    fi

    openshell gateway use "${GATEWAY_NAME}" 2>/dev/null || true
    openshell settings set --global --key providers_v2_enabled --value true --yes

    if openshell provider get "${PROVIDER_NAME}" >/dev/null 2>&1; then
      openshell provider update "${PROVIDER_NAME}" \
        --config "VERTEX_AI_PROJECT_ID=${PROJECT_ID}" \
        --config "VERTEX_AI_REGION=${REGION}"
    else
      openshell provider create \
        --name "${PROVIDER_NAME}" \
        --type google-vertex-ai \
        --credential "GOOGLE_SERVICE_ACCOUNT_KEY=$(cat "${SA_JSON}")" \
        --config "VERTEX_AI_PROJECT_ID=${PROJECT_ID}" \
        --config "VERTEX_AI_REGION=${REGION}"
    fi

    openshell provider refresh configure "${PROVIDER_NAME}" \
      --credential-key GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN \
      --strategy google-service-account-jwt \
      --material "client_email=${CLIENT_EMAIL}" \
      --material "private_key=${PRIVATE_KEY}" \
      --secret-material-key private_key

    ok=0
    for _ in $(seq 1 36); do
      if openshell provider refresh status "${PROVIDER_NAME}" --credential-key GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN 2>/dev/null \
        | grep -qiE '[[:space:]]refreshed[[:space:]]'; then
        ok=1
        break
      fi
      sleep 5
    done
    [[ "${ok}" -eq 1 ]]

    openshell inference set --provider "${PROVIDER_NAME}" --model "${MODEL}" --no-verify
    echo "vertex_ok provider=${PROVIDER_NAME} region=${REGION} model=${MODEL}"

  setup-nemoclaw.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    SANDBOX_NAME="${SANDBOX_NAME:?}"
    GATEWAY_NAME="${OPENSHELL_GATEWAY:-openshell}"
    NEMOCLAW_AGENT="${NEMOCLAW_AGENT:-openclaw}"
    ONBOARD_CLI="${ONBOARD_CLI:-openclaw}"
    SANDBOX_IMAGE="${SANDBOX_IMAGE:-}"
    NEMOCLAW_CLI_IMAGE="${NEMOCLAW_CLI_IMAGE:-}"
    NEMOCLAW_PROVIDER="${NEMOCLAW_PROVIDER:-}"
    NEMOCLAW_MODEL="${NEMOCLAW_MODEL:-}"
    NEMOCLAW_API_KEY="${NEMOCLAW_API_KEY:-}"
    NEMOCLAW_ENDPOINT_URL="${NEMOCLAW_ENDPOINT_URL:-}"
    NEMOCLAW_WEB_SEARCH_PROVIDER="${NEMOCLAW_WEB_SEARCH_PROVIDER:-}"
    # Vertex AI legacy path
    PROVIDER_NAME="${PROVIDER_NAME:-}"
    VERTEX_MODEL="${VERTEX_MODEL:-claude-sonnet-4-6}"

    openshell gateway select "${GATEWAY_NAME}" >/dev/null 2>&1 || true

    # --- Install nemoclaw CLI (needed for sandbox connect / dashboard-url) ---
    if ! command -v nemoclaw &>/dev/null; then
      if [[ -n "${NEMOCLAW_CLI_IMAGE}" ]]; then
        echo "Installing nemoclaw CLI from ${NEMOCLAW_CLI_IMAGE}..."
        CID="$(docker create "${NEMOCLAW_CLI_IMAGE}" 2>/dev/null || true)"
        if [[ -n "${CID}" ]]; then
          docker cp "${CID}:/opt/nemoclaw" /tmp/nemoclaw-cli
          docker rm "${CID}" >/dev/null
          sudo mv /tmp/nemoclaw-cli /opt/nemoclaw
          printf '#!/usr/bin/env bash\nexec node /opt/nemoclaw/bin/nemoclaw.js "$@"\n' | sudo tee /usr/local/bin/nemoclaw >/dev/null
          sudo chmod 755 /usr/local/bin/nemoclaw
          echo "nemoclaw CLI installed"
        else
          echo "WARN: could not create container from ${NEMOCLAW_CLI_IMAGE}"
        fi
      else
        echo "WARN: nemoclaw not found and NEMOCLAW_CLI_IMAGE not set"
      fi
    fi

    # --- Write OIDC token for external gateway auth ---
    if [[ -n "${OIDC_TOKEN:-}" ]]; then
      OIDC_TOKEN_PATH="${HOME}/.config/openshell/gateways/${GATEWAY_NAME}/oidc_token.json"
      mkdir -p "$(dirname "${OIDC_TOKEN_PATH}")"
      chmod 700 "$(dirname "${OIDC_TOKEN_PATH}")"
      cat > "${OIDC_TOKEN_PATH}" <<OIDCEOF
    {"access_token":"${OIDC_TOKEN}","issuer":"${OIDC_ISSUER:-}","client_id":"${OIDC_CLIENT_ID:-openshell-cli}"}
    OIDCEOF
      chmod 600 "${OIDC_TOKEN_PATH}"
      echo "OIDC token configured for gateway auth"
    fi

    # --- Register mTLS gateway for internal/nemoclaw use ---
    # Use a distinct name (openshell-local) to avoid collision with any
    # existing OIDC gateway named "openshell".
    MTLS_GW_NAME="openshell-local"
    openshell gateway remove "${MTLS_GW_NAME}" 2>/dev/null || true
    if ! openshell gateway add https://127.0.0.1:17670 --name "${MTLS_GW_NAME}" --local 2>&1; then
      echo "ERROR: failed to register mTLS gateway '${MTLS_GW_NAME}'" >&2
      exit 1
    fi
    if ! openshell gateway select "${MTLS_GW_NAME}" 2>&1; then
      echo "ERROR: failed to select mTLS gateway '${MTLS_GW_NAME}'" >&2
      exit 1
    fi
    echo "mTLS gateway '${MTLS_GW_NAME}' registered and selected"

    # --- Grant mTLS client access to the default workspace ---
    # Use the OIDC gateway (which has admin access) to add the mTLS client.
    # Fall back to the mTLS gateway if OIDC is not configured.
    if [[ -n "${OIDC_TOKEN:-}" ]]; then
      openshell gateway select "${GATEWAY_NAME}" >/dev/null 2>&1 || true
      if ! openshell workspace member add --workspace default --subject openshell-client --role admin 2>&1; then
        echo "WARN: could not grant workspace access via OIDC (client may already be a member)"
      fi
      openshell gateway select "${MTLS_GW_NAME}" >/dev/null 2>&1 || true
    else
      if ! openshell workspace member add --workspace default --subject openshell-client --role admin 2>&1; then
        echo "WARN: could not grant workspace access (client may already be a member)"
      fi
    fi

    # --- Run nemoclaw onboard via mTLS gateway (externally-supervised) ---
    GATEWAY_MGMT="${HOME}/gateway-management.json"
    STATE_DIR="${HOME}/.local/state/openshell"
    echo "{\"version\":1,\"mode\":\"externally-supervised\",\"endpoint\":\"https://127.0.0.1:17670\",\"stateDir\":\"${STATE_DIR}\",\"supervisor\":{\"kind\":\"systemd-user\",\"serviceName\":\"openshell-gateway.service\",\"execPath\":\"/usr/local/bin/openshell-gateway\"}}" > "${GATEWAY_MGMT}"

    CRED_ENV=""
    case "${NEMOCLAW_PROVIDER}" in
      gemini)              CRED_ENV="GEMINI_API_KEY" ;;
      anthropic)           CRED_ENV="ANTHROPIC_API_KEY" ;;
      openai)              CRED_ENV="OPENAI_API_KEY" ;;
      build)               CRED_ENV="NVIDIA_INFERENCE_API_KEY" ;;
      openrouter)          CRED_ENV="OPENROUTER_API_KEY" ;;
      custom)              CRED_ENV="COMPATIBLE_API_KEY" ;;
      ollama|"")           CRED_ENV="" ;;
      *)                   CRED_ENV="COMPATIBLE_API_KEY" ;;
    esac

    ONBOARD_ENV=(
      "NEMOCLAW_GATEWAY_MANAGEMENT=${GATEWAY_MGMT}"
      "NEMOCLAW_GATEWAY_PORT=17670"
      "NEMOCLAW_IGNORE_RUNTIME_RESOURCES=1"
      "NEMOCLAW_OPENSHELL_GATEWAY_BIN=/usr/local/bin/openshell-gateway"
      "NEMOCLAW_OPENSHELL_SANDBOX_BIN=/usr/local/bin/openshell-supervisor"
    )
    [[ -n "${NEMOCLAW_PROVIDER}" ]] && ONBOARD_ENV+=("NEMOCLAW_PROVIDER=${NEMOCLAW_PROVIDER}")
    [[ -n "${NEMOCLAW_MODEL}" ]] && ONBOARD_ENV+=("NEMOCLAW_MODEL=${NEMOCLAW_MODEL}")
    [[ -n "${NEMOCLAW_ENDPOINT_URL}" ]] && ONBOARD_ENV+=("NEMOCLAW_ENDPOINT_URL=${NEMOCLAW_ENDPOINT_URL}")
    [[ -n "${NEMOCLAW_WEB_SEARCH_PROVIDER}" ]] && ONBOARD_ENV+=("NEMOCLAW_WEB_SEARCH_PROVIDER=${NEMOCLAW_WEB_SEARCH_PROVIDER}")
    [[ -n "${CRED_ENV}" && -n "${NEMOCLAW_API_KEY}" ]] && ONBOARD_ENV+=("${CRED_ENV}=${NEMOCLAW_API_KEY}")

    ONBOARD_OK=1
    echo "Running nemoclaw onboard (provider=${NEMOCLAW_PROVIDER:-none}, model=${NEMOCLAW_MODEL:-default})..."
    if ! env "${ONBOARD_ENV[@]}" nemoclaw onboard \
        --fresh --non-interactive \
        --name "${SANDBOX_NAME}" \
        --agent "${NEMOCLAW_AGENT}" \
        --yes --yes-i-accept-third-party-software 2>&1; then
      ONBOARD_OK=0
      echo "WARN: nemoclaw onboard failed — falling back to openshell provider create"
    fi

    # --- Fallback: configure provider if nemoclaw onboard didn't ---
    if ! openshell provider list 2>/dev/null | grep -q inference; then
      PROVIDER_TYPE=""
      CRED_KEY=""
      case "${NEMOCLAW_PROVIDER}" in
        gemini)      PROVIDER_TYPE="google-vertex-ai"; CRED_KEY="GOOGLE_API_KEY" ;;
        anthropic)   PROVIDER_TYPE="claude-code";      CRED_KEY="ANTHROPIC_API_KEY" ;;
        openai)      PROVIDER_TYPE="codex";            CRED_KEY="OPENAI_API_KEY" ;;
        build)       PROVIDER_TYPE="nvidia";           CRED_KEY="NVIDIA_API_KEY" ;;
        ollama)      PROVIDER_TYPE="ollama";           CRED_KEY="" ;;
        *)           PROVIDER_TYPE="nvidia";           CRED_KEY="API_KEY" ;;
      esac
      if [[ -n "${NEMOCLAW_PROVIDER}" && -n "${NEMOCLAW_API_KEY}" ]]; then
        echo "Configuring inference provider on gateway (type=${PROVIDER_TYPE})..."
        if ! openshell provider create \
            --name inference \
            --type "${PROVIDER_TYPE}" \
            --credential "${CRED_KEY}=${NEMOCLAW_API_KEY}" 2>&1; then
          echo "ERROR: could not configure provider on gateway" >&2
          exit 1
        fi
      fi
    fi

    # --- Create sandbox from pre-built image ---
    CREATE_ARGS=(--name "${SANDBOX_NAME}")
    if [[ -n "${SANDBOX_IMAGE}" ]]; then
      CREATE_ARGS+=(--from "${SANDBOX_IMAGE}")
      echo "Pre-pulling sandbox image..."
      sudo docker pull "${SANDBOX_IMAGE}" 2>&1 | tail -1 || true
    fi
    if ! openshell sandbox get "${SANDBOX_NAME}" >/dev/null 2>&1; then
      echo "Creating sandbox (image=${SANDBOX_IMAGE:-default}, agent=${NEMOCLAW_AGENT})..."
      if ! openshell sandbox create "${CREATE_ARGS[@]}" --no-tty -- sh -c "echo sandbox-ready"; then
        echo "ERROR: sandbox creation failed" >&2
        exit 1
      fi
    fi

    # --- Start openclaw gateway inside sandbox for GUI/TUI dashboard ---
    {{- $clusterDomain := "apps.example.com" }}
    {{- if .Values.global }}{{- if .Values.global.clusterDomain }}{{- $clusterDomain = .Values.global.clusterDomain }}{{- end }}{{- end }}
    DASHBOARD_ROUTE="{{ include "openshell-sandbox.fullname" . }}-dashboard-{{ .Release.Namespace }}.{{ $clusterDomain }}"
    OPENCLAW_TOKEN=$(openssl rand -hex 16)
    echo "Starting openclaw gateway inside sandbox (token=${OPENCLAW_TOKEN:0:8}...)..."
    openshell sandbox exec -n "${SANDBOX_NAME}" --no-tty -- node -e "
      const fs = require('fs');
      const cfg = JSON.parse(fs.readFileSync('/sandbox/.openclaw/openclaw.json', 'utf8'));
      if (!cfg.gateway) cfg.gateway = {};
      if (!cfg.gateway.auth) cfg.gateway.auth = {};
      cfg.gateway.auth.token = '${OPENCLAW_TOKEN}';
      if (!cfg.gateway.controlUi) cfg.gateway.controlUi = {};
      cfg.gateway.controlUi.allowedOrigins = ['https://${DASHBOARD_ROUTE}'];
      fs.writeFileSync('/sandbox/.openclaw/openclaw.json', JSON.stringify(cfg, null, 2));
    " 2>/dev/null || echo "WARN: could not write openclaw config"
    openshell sandbox exec -n "${SANDBOX_NAME}" --no-tty -- sh -c \
      'nohup openclaw gateway run --bind lan --port 18789 > /tmp/openclaw-gateway.log 2>&1 &' \
      2>/dev/null || echo "WARN: could not start openclaw gateway"
    OPENCLAW_READY=0
    for i in $(seq 1 10); do
      if openshell sandbox exec -n "${SANDBOX_NAME}" --no-tty -- curl -sf http://127.0.0.1:18789/health 2>/dev/null | grep -q ok; then
        OPENCLAW_READY=1; break
      fi
      echo "  waiting for openclaw gateway... (attempt $i)"
      sleep 3
    done
    if [[ "${OPENCLAW_READY}" -eq 1 ]]; then
      echo "openclaw gateway ready (dashboard token saved to config)"
    else
      echo "WARN: openclaw gateway health check failed — dashboard may not work"
    fi

    if [[ "${ONBOARD_OK}" -eq 1 ]]; then
      echo "setup-nemoclaw OK agent=${NEMOCLAW_AGENT} sandbox=${SANDBOX_NAME}"
    else
      echo "setup-nemoclaw PARTIAL agent=${NEMOCLAW_AGENT} sandbox=${SANDBOX_NAME} (nemoclaw onboard failed, provider fallback used)"
    fi

  setup-dashboard.sh: |
    #!/usr/bin/env bash
    # Runs OpenShell Dashboard + oauth2-proxy inside the VM via docker,
    # managed as `systemctl --user` services. Requires OIDC to be configured on
    # the gateway (the dashboard's gRPC client has no mTLS support).
    # This branch has no podman at all (see docs/jira/switch-podman-to-docker.md),
    # so both containers run via docker instead of podman, unlike deployment-test.
    set -euo pipefail

    if [[ "${DASHBOARD_ENABLED:-false}" != "true" ]]; then
      echo "Dashboard disabled, skipping."
      exit 0
    fi

    : "${DASHBOARD_IMAGE:?}"
    : "${DASHBOARD_PROXY_IMAGE:?}"
    : "${DASHBOARD_COOKIE_SECRET:?}"
    : "${DASHBOARD_REDIRECT_URL:?DASHBOARD_REDIRECT_URL not set — was the *-webui route created?}"
    : "${OIDC_ISSUER:?dashboard requires an OIDC-configured gateway (oidc.issuerUrl)}"
    DASHBOARD_CLIENT_ID="${DASHBOARD_CLIENT_ID:-openshell-dashboard}"

    mkdir -p "${HOME}/.config/systemd/user" "${HOME}/.config/openshell"

    # Copy just the CA cert (public, not sensitive — never the private key) to a
    # dedicated, world-readable location instead of exposing the whole TLS dir,
    # same reasoning as the rootless-podman case this was originally written
    # for: don't expose the gateway's private key to the container's bind mount.
    CA_SRC="${HOME}/.local/state/openshell/tls/ca.crt"
    CA_FOR_DASHBOARD="${HOME}/.config/openshell/dashboard-gateway-ca.crt"
    if [[ -f "${CA_SRC}" ]]; then
      install -m 0644 "${CA_SRC}" "${CA_FOR_DASHBOARD}"
    else
      echo "WARN: gateway CA cert not found at ${CA_SRC}, dashboard gRPC connection will likely fail"
    fi
    chmod o+x "${HOME}" "${HOME}/.config" "${HOME}/.config/openshell" 2>/dev/null || true

    cat > "${HOME}/.config/openshell/dashboard.env" <<ENVEOF
    PORT=8090
    OPENSHELL_GATEWAY_URL=grpcs://localhost:17670
    GATEWAY_CA_CERT=/tls/ca.crt
    AUTH_DISABLED=false
    ADMIN_ROLE=openshell-admin
    ENVEOF

    cat > "${HOME}/.config/openshell/dashboard-proxy.env" <<ENVEOF
    OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:8080
    OAUTH2_PROXY_UPSTREAMS=http://localhost:8090
    OAUTH2_PROXY_PROVIDER=oidc
    OAUTH2_PROXY_OIDC_ISSUER_URL=${OIDC_ISSUER}
    OAUTH2_PROXY_CLIENT_ID=${DASHBOARD_CLIENT_ID}
    OAUTH2_PROXY_CLIENT_SECRET_FILE=/dev/null
    OAUTH2_PROXY_REDIRECT_URL=${DASHBOARD_REDIRECT_URL}
    OAUTH2_PROXY_COOKIE_SECRET=${DASHBOARD_COOKIE_SECRET}
    OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
    OAUTH2_PROXY_CODE_CHALLENGE_METHOD=S256
    OAUTH2_PROXY_EMAIL_DOMAINS=*
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    OAUTH2_PROXY_COOKIE_SECURE=true
    OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY=true
    # oauth2-proxy rejects the id_token by default if the OIDC provider's
    # email_verified claim is false — true for real SSO-federated Keycloak
    # accounts (confirmed live on deployment-test: "email in id_token (...)
    # isn't verified", HTTP 500 at /oauth2/callback), as opposed to the
    # realm's manually created test users (alice/bob/admin/developer) which
    # don't hit this. Relevant here since this branch's task requires a real
    # user identity, not alice.
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL=true
    # --cookie-refresh defaults to disabled (0) — oauth2-proxy never uses the
    # refresh token to renew an expired access token on its own, it just keeps
    # forwarding the stale one until the gateway rejects it. Keycloak already
    # issues a normal (non-offline) refresh token by default on every login
    # regardless of scope — that's all --cookie-refresh needs. Do NOT add
    # offline_access here: Keycloak only grants an *offline* token if the
    # authenticating user has the realm's offline_access role, which
    # federated/SSO accounts don't get by default (unlike the built-in test
    # users) — confirmed on deployment-test this causes "not_allowed: Offline
    # tokens not allowed for the user or client" and a 500 at /oauth2/callback
    # for real users. See bug #13 in docs/openshell-dashboard-integration.md.
    OAUTH2_PROXY_SCOPE=openid email profile
    OAUTH2_PROXY_COOKIE_REFRESH=60s
    ENVEOF
    chmod 600 "${HOME}/.config/openshell/dashboard.env" "${HOME}/.config/openshell/dashboard-proxy.env"

    # No explicit After=/Requires= on openshell-gateway.service here: the
    # golden image's openshell-gateway.service has "After=default.target" +
    # "WantedBy=default.target" (a self-referential pattern already present
    # before this change). Chaining any unit's ordering through it — even
    # indirectly via WantedBy=openshell-gateway.service — reliably produces a
    # systemd ordering cycle at boot, silently dropping the dependent unit's
    # start job (confirmed on deployment-test). Decoupling entirely and
    # relying on Restart=on-failure to self-heal any startup race is far more
    # robust than fighting that cycle.
    cat > "${HOME}/.config/systemd/user/openshell-dashboard.service" <<UNITEOF
    [Unit]
    Description=OpenShell Dashboard (BFF + UI)

    [Service]
    Type=simple
    ExecStartPre=-/usr/bin/docker rm -f openshell-dashboard
    ExecStart=/usr/bin/docker run --rm --name openshell-dashboard --network host --env-file=%h/.config/openshell/dashboard.env -v %h/.config/openshell/dashboard-gateway-ca.crt:/tls/ca.crt:ro,Z ${DASHBOARD_IMAGE}
    ExecStop=/usr/bin/docker stop -t 5 openshell-dashboard
    Restart=on-failure
    RestartSec=5s

    [Install]
    WantedBy=default.target
    UNITEOF

    cat > "${HOME}/.config/systemd/user/openshell-dashboard-proxy.service" <<UNITEOF
    [Unit]
    Description=OpenShell Dashboard Auth Proxy (oauth2-proxy)

    [Service]
    Type=simple
    ExecStartPre=-/usr/bin/docker rm -f openshell-dashboard-proxy
    ExecStart=/usr/bin/docker run --rm --name openshell-dashboard-proxy --network host --env-file=%h/.config/openshell/dashboard-proxy.env ${DASHBOARD_PROXY_IMAGE}
    ExecStop=/usr/bin/docker stop -t 5 openshell-dashboard-proxy
    Restart=on-failure
    RestartSec=5s

    [Install]
    WantedBy=default.target
    UNITEOF

    systemctl --user daemon-reload
    systemctl --user enable --now openshell-dashboard.service openshell-dashboard-proxy.service

    echo "Waiting for dashboard to become ready..."
    ok=0
    for i in $(seq 1 15); do
      sleep 2
      if curl -sf --max-time 2 http://127.0.0.1:8090/api/v1/healthz >/dev/null 2>&1; then
        ok=1
        break
      fi
      echo "  waiting for dashboard... (attempt $i)"
    done
    if [[ "${ok}" -ne 1 ]]; then
      echo "WARN: dashboard health check timed out"
      docker logs openshell-dashboard 2>&1 | tail -10 || true
      docker logs openshell-dashboard-proxy 2>&1 | tail -10 || true
    else
      echo "dashboard ready"
    fi

    echo "setup-dashboard OK"

  inject-user-pubkey.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    : "${SSH_PUBKEY:?}"
    : "${SANDBOX_NAME:?}"

    mkdir -p "${HOME}/.openshell-user-keys"
    umask 077
    printf '%s\n' "${SSH_PUBKEY}" > "${HOME}/.openshell-user-keys/${SANDBOX_NAME}.pub"
    mkdir -p "${HOME}/.ssh"
    chmod 700 "${HOME}/.ssh"
    touch "${HOME}/.ssh/authorized_keys"
    chmod 600 "${HOME}/.ssh/authorized_keys"
    if ! grep -Fxq "${SSH_PUBKEY}" "${HOME}/.ssh/authorized_keys"; then
      printf '%s\n' "${SSH_PUBKEY}" >> "${HOME}/.ssh/authorized_keys"
    fi
    echo "pubkey_installed sandbox=${SANDBOX_NAME}"

  run-create.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    if [[ -f "${HOME}/run-create.env" ]]; then
      set -a
      source "${HOME}/run-create.env"
      set +a
    fi

    : "${SANDBOX_NAME:?}"
    : "${SSH_PUBKEY:?}"
    NEMOCLAW_AGENT="${NEMOCLAW_AGENT:-openclaw}"
    NEMOCLAW_PROVIDER="${NEMOCLAW_PROVIDER:-}"
    NEMOCLAW_MODEL="${NEMOCLAW_MODEL:-}"
    NEMOCLAW_API_KEY="${NEMOCLAW_API_KEY:-}"
    NEMOCLAW_ENDPOINT_URL="${NEMOCLAW_ENDPOINT_URL:-}"
    NEMOCLAW_WEB_SEARCH_PROVIDER="${NEMOCLAW_WEB_SEARCH_PROVIDER:-}"
    PROVIDER_NAME="${PROVIDER_NAME:-}"
    SA_JSON="${SA_JSON:-}"

    chmod +x \
      "${HOME}/configure-vertex-user.sh" \
      "${HOME}/setup-nemoclaw.sh" \
      "${HOME}/inject-user-pubkey.sh" \
      "${HOME}/setup-dashboard.sh"

    # Vertex AI legacy path: configure provider via openshell commands
    if [[ -n "${SA_JSON}" && -f "${SA_JSON}" ]]; then
      VERTEX_AI_REGION="${VERTEX_AI_REGION:-global}"
      VERTEX_MODEL="${VERTEX_MODEL:-claude-sonnet-4-6}"
      export SA_JSON PROVIDER_NAME VERTEX_AI_REGION VERTEX_MODEL SANDBOX_NAME NEMOCLAW_AGENT
      "${HOME}/configure-vertex-user.sh"
    fi

    # Run nemoclaw onboard (handles both Vertex and direct providers)
    export SANDBOX_NAME NEMOCLAW_AGENT NEMOCLAW_PROVIDER NEMOCLAW_MODEL NEMOCLAW_API_KEY
    export NEMOCLAW_ENDPOINT_URL NEMOCLAW_WEB_SEARCH_PROVIDER
    export ONBOARD_CLI="${ONBOARD_CLI:-openclaw}"
    export PROVIDER_NAME SANDBOX_IMAGE="${SANDBOX_IMAGE:-}" VERTEX_MODEL="${VERTEX_MODEL:-}"
    export NEMOCLAW_CLI_IMAGE="${NEMOCLAW_CLI_IMAGE:-}"
    export OIDC_TOKEN="${OIDC_TOKEN:-}" OIDC_ISSUER="${OIDC_ISSUER:-}" OIDC_CLIENT_ID="${OIDC_CLIENT_ID:-openshell-cli}" OIDC_PASSTHROUGH="${OIDC_PASSTHROUGH:-}"
    "${HOME}/setup-nemoclaw.sh"

    SSH_PUBKEY="${SSH_PUBKEY}" SANDBOX_NAME="${SANDBOX_NAME}" "${HOME}/inject-user-pubkey.sh"

    if [[ -n "${OIDC_TOKEN:-}" && "${OIDC_PASSTHROUGH:-}" == "true" ]]; then
      echo "Writing OIDC token to sandbox for MCP server auth..."
      openshell sandbox exec -n "${SANDBOX_NAME}" --no-tty -- sh -c "
        mkdir -p /sandbox/.oidc
        printf '{\"access_token\":\"%s\"}' '${OIDC_TOKEN}' > /sandbox/.oidc/token.json
        chmod 600 /sandbox/.oidc/token.json
      " || echo "WARN: could not write OIDC token to sandbox"
    fi

    export DASHBOARD_ENABLED="${DASHBOARD_ENABLED:-false}" DASHBOARD_IMAGE="${DASHBOARD_IMAGE:-}"
    export DASHBOARD_PROXY_IMAGE="${DASHBOARD_PROXY_IMAGE:-}" DASHBOARD_CLIENT_ID="${DASHBOARD_CLIENT_ID:-openshell-dashboard}"
    export DASHBOARD_COOKIE_SECRET="${DASHBOARD_COOKIE_SECRET:-}" DASHBOARD_REDIRECT_URL="${DASHBOARD_REDIRECT_URL:-}"
    "${HOME}/setup-dashboard.sh"

    if [[ -n "${SA_JSON}" && -f "${SA_JSON}" ]]; then
      shred -u "${SA_JSON}" 2>/dev/null || rm -f "${SA_JSON}"
    fi
    echo "run-create OK sandbox=${SANDBOX_NAME} provider=${NEMOCLAW_PROVIDER:-${PROVIDER_NAME:-none}}"
