clusterGroup:
  name: prod
  namespaces:
    external-secrets:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-cnv:
      operatorGroup: true
      targetNamespaces: []
    rhbk-operator:
      operatorGroup: true
      targetNamespaces: []
    rhdh-operator:
      operatorGroup: true
      targetNamespaces: []
    ansible-automation-platform:
      operatorGroup: true
      targetNamespaces: []
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    secure-agent-workspace:
    vault:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable
    rhbk:
      name: rhbk-operator
      namespace: rhbk-operator
      channel: stable-v24
    rhdh:
      name: rhdh
      namespace: rhdh-operator
      channel: fast
    aap:
      name: ansible-automation-platform-operator
      namespace: ansible-automation-platform
      channel: stable-2.5
    openshift-ai:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: fast
  applications:
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*
