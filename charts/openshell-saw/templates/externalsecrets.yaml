{{- if .Values.openshellSaw.tenant.name }}
{{- $cfg := .Values.openshellSaw }}
{{- $vault := $cfg.platform.vault }}
{{- $username := $cfg.tenant.username | default $cfg.tenant.name }}
{{- $defaultPrefix := printf "%s/%s" (trimSuffix "/" $vault.prefix) $username }}
{{- $prefix := $cfg.vaultPrefix | default $cfg.tenant.vaultPrefix | default $defaultPrefix }}
{{- $ns := include "openshell-saw.namespace" $cfg }}
{{- $selected := dict }}
{{- if hasKey $cfg "providerCredentials" }}
  {{- range $credential := $cfg.providerCredentials }}
    {{- $_ := set $selected $credential.remoteKey $credential }}
  {{- end }}
{{- else }}
  {{- range $selection := $cfg.instance.workspaces }}
    {{- range $bindingName, $binding := ($selection.credentialBindings | default dict) }}
      {{- $ref := $binding.secretRef | default dict }}
      {{- $refName := $ref.name | default "" }}
      {{- $matches := list }}
      {{- range $credential := $cfg.tenant.credentials }}
        {{- if or (eq $credential.name $bindingName) (eq $credential.name $refName) (eq $credential.remoteKey $refName) }}
          {{- $matches = append $matches $credential }}
        {{- end }}
      {{- end }}
      {{- if ne (len $matches) 1 }}
        {{- fail "credential binding must resolve to exactly one tenant.credentials entry" }}
      {{- end }}
      {{- $credential := first $matches }}
      {{- if not (has ($ref.key | default "") $credential.keys) }}
        {{- fail "credential binding key must be declared in tenant.credentials.keys" }}
      {{- end }}
      {{- $_ := set $selected $credential.remoteKey $credential }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range $remoteKey, $credential := $selected }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $remoteKey | quote }}
  namespace: {{ $ns }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef: {name: saw-user-vault, kind: SecretStore}
  target:
    name: {{ $remoteKey | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
      data:
        {{- range $key := $credential.keys }}
        {{ $key }}: {{ printf "{{ .%s }}" $key | quote }}
        {{- end }}
  dataFrom:
    - extract:
        key: {{ printf "%s/providers/%s" (trimSuffix "/" $prefix) $remoteKey | quote }}
{{- end }}
{{- end }}
