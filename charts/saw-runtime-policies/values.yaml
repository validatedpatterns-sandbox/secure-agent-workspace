# Platform-owned policy release; disabled until dependencies and site inputs exist.
enabled: false
targetNamespace: ""
gatewayId: ""
gatewayServiceAccount: ""
sandboxServiceAccount: ""
mode: container
network:
  # Required administrator allocation, unique among overlapping ANPs (0..99).
  priority: null
