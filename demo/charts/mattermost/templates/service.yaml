apiVersion: v1
kind: Service
metadata:
  name: mattermost
  labels:
    app.kubernetes.io/name: mattermost
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.httpPort }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: mattermost
