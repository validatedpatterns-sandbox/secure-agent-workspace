{{- if not (has .Values.delivery.mode (list "legacy" "data")) }}
{{- fail "delivery.mode must be legacy or data" }}
{{- end }}
{{- if or (gt (len .Values.delivery.configMapName) 63) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" .Values.delivery.configMapName)) }}
{{- fail "delivery.configMapName must be a DNS label of at most 63 characters" }}
{{- end }}
{{- if and (eq .Values.delivery.mode "data") (empty .Values.profiles) }}
{{- fail "data delivery requires at least one selected profile" }}
{{- end }}
{{- $profileFiles := dict }}
{{- $selected := dict }}
{{- range $profile := .Values.profiles }}
{{- if or (gt (len $profile) 63) (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $profile)) }}
{{- fail "profile names must be DNS labels of at most 63 characters" }}
{{- end }}
{{- if hasKey $selected $profile }}
{{- fail "duplicate profile selection" }}
{{- end }}
{{- $_ := set $selected $profile true }}
{{- $files := $.Files.Glob (printf "profiles/%s/**/*.yaml" $profile) }}
{{- if and (eq $.Values.delivery.mode "data") (eq (len $files) 0) }}
{{- fail "selected profile does not exist in the chart" }}
{{- end }}
{{- range $path, $_ := $files }}
{{- $_ := set $profileFiles $path ($.Files.Get $path) }}
{{- end }}
{{- end }}
{{- if $profileFiles }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.delivery.configMapName }}
  labels:
    app.kubernetes.io/name: saw-bom
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $path, $content := $profileFiles }}
  {{ $path | replace "/" "__" }}: |
{{ $content | indent 4 }}
  {{- end }}
  {{- if eq .Values.delivery.mode "legacy" }}
  apply_bom.py: |
{{ .Files.Get "files/apply_bom.py" | indent 4 }}
  {{- end }}
{{- end }}
