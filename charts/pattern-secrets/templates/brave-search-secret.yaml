apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: brave-search
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: brave-search
    template:
      type: Opaque
      data:
        api_key: {{ printf "{{ .api_key }}" | quote }}
  data:
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vaultPrefix }}/brave-search
        property: api_key
