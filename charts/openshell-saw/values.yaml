# Required — must be set at install time. Maximum 19 characters (OpenShell limit).
sandboxName: ""
# SSH public key for VM access. Set explicitly, or leave empty to read
# from the 'public_key' field in the sshSecret (created by ESO/pattern-secrets).
sshPublicKey: ""

# VM disk source — three modes:
#
# 1. DataSource (default): clone from a golden image DataSource (created by the
#    openshell-gateway-image chart or CDI DataImportCron).
#      source:
#        dataSource: openshell-gateway
#        dataSourceNamespace: openshell-agents
#
# 2. Registry: import a bootc/containerDisk image directly from a container registry.
#      source:
#        registryURL: "docker://quay.io/rh-ai-quickstart/openshell-gateway:latest"
#
# 3. HTTP: download a qcow2 disk image from a URL.
#      source:
#        httpURL: "https://example.com/openshell-gateway.qcow2"
#
# VM disk source — clone from a golden image DataSource.
# The golden image is built on the cluster via make build-gateway-image
# and imported by the openshell-gateway-image helm chart.
source:
  dataSource: openshell-gateway
  dataSourceNamespace: "openshell-agents"
  # Registry URL for golden image import. Used by the setup Job to bootstrap
  # the DataSource on first run. Defaults to the internal registry.
  goldenImageURL: ""
  # CDI pull method: "node" (uses node runtime, trusts internal CA) or "pod" (CDI importer pod)
  pullMethod: "node"
  registryURL: ""
  httpURL: ""

vm:
  cores: 4
  memory: 8Gi
  diskSize: 40Gi

# Sandbox container image. When empty, auto-detects from the internal registry.
sandboxImage: ""

# Agent to run inside the sandbox: openclaw, hermes, or langchain-deepagents-code
agent: openclaw

# Onboarding CLI: openclaw (runs inside sandbox) or nemoclaw (runs on gateway VM, requires Docker)
onboardCli: openclaw

# OpenShell gateway runtime configuration inside the sandbox VM.
openshell:
  # Bind address for `openshell-gateway` listener.
  # Keep default 0.0.0.0 for remote CLI access via route; set to 127.0.0.1
  # to restrict access to local VM context only.
  bindAddress: "0.0.0.0"

# Inference provider configuration.
# Provider keys: gemini, anthropic, openai, build (NVIDIA), openrouter, ollama, custom
inference:
  provider: ""
  model: ""
  apiKey: ""
  endpointUrl: ""
  webSearch: ""
  # Name of a k8s Secret containing provider, model, and api_key fields.
  # Defaults to "inference" (created by ESO from Vault via values-secret.yaml).
  # The Job reads provider/model/api_key from this secret automatically.
  secretName: "inference"

# Vertex AI via GCP service account (legacy — optional).
# When set, the Vertex provider is configured via openshell provider commands
# before nemoclaw onboard runs.
vertexSaJson: ""
vertex:
  region: global
  model: claude-sonnet-4-6

# SSH identity Secret for virtctl — must exist in the namespace.
# The Secret should have a 'key' data field with the private key.
sshSecret: openshell-aap-ssh
sshUser: cloud-user

# Fallback virtctl version if auto-detection from the cluster fails.
virtctlVersion: "v1.4.1"

job:
  image: "registry.fedoraproject.org/fedora:44"
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  # Wait for ESO-managed secrets before starting the setup Job.
  # Set to true when using Validated Pattern / External Secrets Operator.
  # Leave false for manual/quickstart path where secrets are created directly.
  waitForSecrets: false

# Expose the sandbox gateway and dashboard via OpenShift Routes.
route:
  enabled: true
  host: ""
  dashboard: true

# OIDC authentication.
# issuerUrl can be set explicitly, or computed from global.clusterDomain
# when deployed via the validated pattern.
oidc:
  token: ""
  issuerUrl: ""
  clientId: "openshell-cli"
  passthrough: true
  keycloakName: "openshell-keycloak"
  realm: "openshell"

# Sandbox owner (used for labeling and audit).
accessControl:
  owner: ""

# Namespace strategy: "shared" places all sandboxes in the release namespace;
# "perUser" expects a per-user namespace (e.g. saw-<username>).
namespaceMode: shared
