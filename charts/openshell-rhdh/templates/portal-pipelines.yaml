{{- /* Two pipelines, one task (portal.py <action> <arg> [timeout]). The
first task of each verifies the request and hands the user to the others as
the result `user`; each later task is one stage the workspace goes through,
so RHDH's Tekton tab draws a workspace's create and delete as a pipeline. */ -}}
{{- $readyMinutes := .Values.portal.sandboxReadyTimeoutMinutes -}}
{{- $sitesConfigured := eq (include "openshell-rhdh.containerSitesConfigured" .) "true" -}}
{{- if or (not (regexMatch "^[0-9]+$" (toString $readyMinutes))) (lt (int $readyMinutes) 1) (gt (int $readyMinutes) 60) -}}
{{- fail "portal.sandboxReadyTimeoutMinutes must be an integer from 1 to 60" -}}
{{- end -}}
{{- $taskTimeout := include "openshell-rhdh.minutesDuration" (add (int $readyMinutes) 2) -}}
{{- $intentMinutes := 10 -}}
{{- if or (has "container" .Values.portal.deploymentModes) (has "kata" .Values.portal.deploymentModes) -}}
{{- $intentMinutes = max 10 (int $readyMinutes) -}}
{{- end -}}
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: saw-workspace
  namespace: {{ .Values.portal.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
  annotations:
    # Tekton's admission webhook fills in defaults (on steps, params and
    # results), so a client-side diff never matches and the app stays
    # OutOfSync after every successful sync, which also stops the pattern
    # install's health check (seen on a fresh cluster with Pipelines 1.24).
    # Let the API server's dry run, webhooks included, compute the diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  params:
    - name: action
      type: string
    - name: arg
      type: string
      description: The request Secret (create, delete) or the user (the waits, finish-delete).
    - name: timeout
      type: string
      default: ""
      description: Seconds a wait may take.
  results:
    - name: user
      description: The user the request was for.
  volumes:
    {{- if $sitesConfigured }}
    - name: owner-directory
      secret: {secretName: saw-generator-keycloak, items: [{key: client_secret, path: client_secret}]}
    {{- end }}
    - name: scripts
      configMap:
        name: saw-portal-scripts
    {{- include "openshell-rhdh.caVolumes" . | nindent 4 }}
  steps:
    {{- /* Reuse the pod's CA builder; Tekton calls resources computeResources. */}}
    {{- $ca := include "openshell-rhdh.caInitContainer" . | fromYamlArray | first }}
    {{- $_ := set $ca "computeResources" $ca.resources }}
    {{- $_ := unset $ca "resources" }}
    {{- toYaml (list $ca) | nindent 4 }}
    - name: run
      image: {{ .Values.portal.image }}
      command: ["python3", "/opt/saw/portal.py", "$(params.action)", "$(params.arg)", "$(params.timeout)"]
      # Tekton's admission webhook adds computeResources: {} to every step;
      # declare it so a client-side diff matches without needing ServerSideDiff
      # enabled on the Argo CD controller (off by default on a fresh install).
      computeResources: {}
      volumeMounts:
        {{- if $sitesConfigured }}
        - {name: owner-directory, mountPath: /etc/saw-owner-directory, readOnly: true}
        {{- end }}
        - name: scripts
          mountPath: /opt/saw
          readOnly: true
        - name: saw-ca
          mountPath: /opt/saw-ca
          readOnly: true
      env:
        - name: SSL_CERT_FILE
          value: /opt/saw-ca/ca-bundle.crt
        - name: NAMESPACE
          value: {{ .Values.portal.namespace }}
        - name: SAW_CONTAINER_ENROLLMENT_SECONDS
          value: {{ mul $intentMinutes 60 | quote }}
        - name: PIPELINE_RUN
          valueFrom:
            fieldRef: {fieldPath: "metadata.labels['tekton.dev/pipelineRun']"}
        - name: RESULT_PATH
          value: $(results.user.path)
        - name: CLUSTER_DOMAIN
          value: {{ .Values.global.clusterDomain | quote }}
        {{- include "openshell-rhdh.containerSitesEnv" . | nindent 8 }}
        - name: SAW_DEPLOYMENT_MODES
          value: {{ include "openshell-rhdh.deploymentModes" . | quote }}
        - name: CATALOG_PATH
          value: /opt/saw/profile-catalog.json
        - name: RHDH_INTERNAL_URL
          value: {{ include "openshell-rhdh.url" . }}
        {{- if $sitesConfigured }}
        - name: SAW_PORTAL_ADMIN_SUBJECTS
          value: {{ .Values.portal.adminSubjects | default dict | toJson | quote }}
        - name: KEYCLOAK_REALM
          value: {{ .Values.keycloak.realm | quote }}
        - name: KEYCLOAK_CLIENT_ID
          value: {{ .Values.keycloak.clientId | quote }}
        - name: KEYCLOAK_SECRET_FILE
          value: /etc/saw-owner-directory/client_secret
        - name: KEYCLOAK_CA_FILE
          value: /opt/saw-ca/ca-bundle.crt
        {{- end }}
        - name: KEYCLOAK_URL
          value: https://{{ include "openshell-rhdh.keycloakHost" . }}
        - name: ARGO_NAMESPACE
          value: {{ include "openshell-rhdh.argoNamespace" . }}
        - name: PORTAL_ADMINS
          {{- with (.Values.portal.admins | default list | join ",") }}
          value: {{ . | quote }}
          {{- end }}
        - name: VAULT_ADDR
          value: {{ .Values.vault.addr }}
        - name: VAULT_SKIP_VERIFY
          value: {{ .Values.tls.insecureSkipVerify | toString | quote }}
        # Vault's in-cluster certificate is signed by the service CA.
        - name: VAULT_CACERT
          value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        - name: VAULT_AUTH_MOUNT
          value: {{ .Values.vault.authMount }}
        - name: VAULT_ROLE
          value: {{ .Values.vault.role }}
        - name: VAULT_KV_MOUNT
          value: {{ .Values.vault.kvMount }}
        - name: VAULT_PREFIX_BASE
          value: {{ .Values.vault.prefixBase }}
        - name: PRUNE_ON_REMOVE
          value: {{ .Values.portal.pruneOnRemove | toString | quote }}
        - name: DELETE_VAULT_SECRETS
          value: {{ .Values.portal.deleteVaultSecrets | toString | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        capabilities: { drop: [ALL] }
        seccompProfile: { type: RuntimeDefault }
{{- $stages := dict
  "create" (list
    (dict "name" "register" "action" "create" "timeout" "5m0s")
    (dict "name" "argo-cd-apps" "action" "wait-apps" "seconds" "600" "timeout" "12m0s")
    (dict "name" "vm" "action" "wait-vm" "seconds" "600" "timeout" (include "openshell-rhdh.minutesDuration" (add $intentMinutes 2)))
    (dict "name" "vm-running" "action" "wait-running" "seconds" "900" "timeout" "17m0s")
    (dict "name" "sandboxes" "action" "wait-ready" "seconds" (printf "%d" (mul (int $readyMinutes) 60)) "timeout" $taskTimeout))
  "delete" (list
    (dict "name" "unregister" "action" "delete" "timeout" "5m0s")
    (dict "name" "argo-cd-removes" "action" "wait-gone" "seconds" "1200" "timeout" "22m0s")
    (dict "name" "finish" "action" "finish-delete" "timeout" "5m0s")) }}
{{- range $action := list "create" "delete" }}
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: saw-workspace-{{ $action }}
  namespace: {{ $.Values.portal.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" $ | nindent 4 }}
  annotations:
    # Tekton's admission webhook fills in defaults (on steps, params and
    # results), so a client-side diff never matches and the app stays
    # OutOfSync after every successful sync, which also stops the pattern
    # install's health check (seen on a fresh cluster with Pipelines 1.24).
    # Let the API server's dry run, webhooks included, compute the diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  params:
    - name: request
      type: string
      description: The request Secret the RHDH template created (saw-req-*).
  tasks:
    {{- $prev := "" }}
    {{- range $i, $t := index $stages $action }}
    - name: {{ $t.name }}
      taskRef:
        name: saw-workspace
      timeout: {{ $t.timeout }}
      {{- if $prev }}
      runAfter: [{{ $prev }}]
      {{- end }}
      params:
        - name: action
          value: {{ $t.action }}
        - name: arg
          {{- if eq $i 0 }}
          value: $(params.request)
          {{- else }}
          value: $(tasks.{{ (index (index $stages $action) 0).name }}.results.user)
          {{- end }}
        {{- if $t.seconds }}
        - name: timeout
          value: {{ $t.seconds | quote }}
        {{- end }}
    {{- $prev = $t.name }}
    {{- end }}
{{- end }}
