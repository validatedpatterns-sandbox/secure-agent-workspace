apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
    openshell.pattern/role: gateway
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: {{ include "openshell-sandbox.fullname" . }}-root
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        {{- if .Values.source.registryURL }}
        source:
          registry:
            url: {{ .Values.source.registryURL | quote }}
            pullMethod: node
        {{- else if .Values.source.httpURL }}
        source:
          http:
            url: {{ .Values.source.httpURL | quote }}
        {{- else }}
        sourceRef:
          kind: DataSource
          name: {{ .Values.source.dataSource }}
          namespace: {{ .Values.source.dataSourceNamespace | default .Release.Namespace }}
        {{- end }}
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.vm.diskSize }}
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
        openshell.pattern/role: gateway
    spec:
      domain:
        cpu:
          cores: {{ .Values.vm.cores }}
        resources:
          requests:
            memory: {{ .Values.vm.memory }}
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: gateway
                  port: 17670
                  protocol: TCP
                - name: dashboard
                  port: 18789
                  protocol: TCP
                - name: webui
                  port: 8080
                  protocol: TCP
                - name: ssh
                  port: 22
                  protocol: TCP
        firmware:
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
          smm: {}
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: {{ include "openshell-sandbox.fullname" . }}-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: {{ include "openshell-sandbox.fullname" . }}-cloudinit
