{{/* Verbs follow stock shared-namespace driver at OpenShell 305c8b3. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-sandbox
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-gateway
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes, sandboxes/status]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, get, list, patch, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.kubernetes.identity.serverTlsSecret | quote }}]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-gateway
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-gateway, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-gateway}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-gateway
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [{{ .Release.Namespace | quote }}]
    verbs: [get]
  {{- if .Values.kubernetes.workload.runtimeClassName }}
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [{{ .Values.kubernetes.workload.runtimeClassName | quote }}]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-gateway
subjects:
  - {kind: ServiceAccount, name: {{ .Release.Name }}-gateway, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ .Release.Namespace }}-{{ .Release.Name }}-gateway}
