apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: {{ .Values.smtpPort }}
      targetPort: smtp
      protocol: TCP
    - name: ui
      port: {{ .Values.uiPort }}
      targetPort: ui
      protocol: TCP
  selector:
    app.kubernetes.io/name: mailpit
