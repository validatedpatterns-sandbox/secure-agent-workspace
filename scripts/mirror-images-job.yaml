apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-${IMAGE}
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: image-mirror
      restartPolicy: Never
      containers:
      - name: mirror
        image: registry.redhat.io/ubi8/skopeo:latest
        env:
        - name: MIRROR_IMAGE
          value: "${IMAGE}"
        - name: MIRROR_REPO
          value: "${IMAGE_REPO}"
        - name: MIRROR_TAG
          value: "${VERSION}"
        - name: MIRROR_NAMESPACE
          value: "${BUILD_NS}"
        - name: HOME
          value: /tmp/skopeo-home
        - name: XDG_RUNTIME_DIR
          value: /tmp/xdg-runtime
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          mkdir -p "${HOME}" "${XDG_RUNTIME_DIR}"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          # Use the exact CI tag; a missing version must fail rather than use latest.
          echo "Copying ${MIRROR_REPO}/${MIRROR_IMAGE}:${MIRROR_TAG}"
          skopeo copy --all --src-tls-verify=true --dest-tls-verify=true \
            --dest-cert-dir=/etc/registry-ca \
            --dest-creds="unused:${TOKEN}" \
            "docker://${MIRROR_REPO}/${MIRROR_IMAGE}:${MIRROR_TAG}" \
            "docker://image-registry.openshift-image-registry.svc:5000/${MIRROR_NAMESPACE}/${MIRROR_IMAGE}:${MIRROR_TAG}"
          echo "Mirror complete: ${MIRROR_IMAGE}:${MIRROR_TAG} -> ${MIRROR_IMAGE}:${MIRROR_TAG}"
        volumeMounts:
        - name: service-ca
          mountPath: /etc/registry-ca
          readOnly: true
      volumes:
      - name: service-ca
        configMap:
          name: openshift-service-ca.crt
          items:
          - key: service-ca.crt
            path: ca.crt
