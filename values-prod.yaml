clusterGroup:
  name: prod
  namespaces:
    external-secrets:
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-cnv:
      operatorGroup: true
      targetNamespaces:
        - openshift-cnv
    # Shared: golden image, image builds, governance interceptor.
    openshell-agents:
    # Keycloak and its RHBK operator, in a namespace of their own so they
    # never collide with a platform Keycloak (often in `keycloak`). Any
    # namespace works; see openshell-saw oidc.keycloakNamespace.
    saw-keycloak:
      operatorGroup: true
      targetNamespaces:
        - saw-keycloak
    rhdh-operator:
      operatorGroup: true
      targetNamespaces: []
    # ansible-automation-platform:
    #   operatorGroup: true
    #   targetNamespaces: []
    redhat-ods-operator:
      operatorGroup: true
      targetNamespaces: []
    vault:
  subscriptions:
    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable
    rhbk:
      name: rhbk-operator
      namespace: saw-keycloak
      channel: stable-v26
    rhdh:
      name: rhdh
      namespace: rhdh-operator
      channel: fast
    # aap:
    #   name: ansible-automation-platform-operator
    #   namespace: ansible-automation-platform
    #   channel: stable-2.5
    openshift-ai:
      name: rhods-operator
      namespace: redhat-ods-operator
      channel: fast
  applications:
    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      chart: openshift-external-secrets
      chartVersion: 0.0.*
    vault:
      name: vault
      namespace: vault
      chart: hashicorp-vault
      chartVersion: 0.1.*
    openshift-cnv:
      name: openshift-cnv
      namespace: openshift-cnv
      path: charts/openshift-cnv
    openshell-keycloak:
      name: openshell-keycloak
      namespace: saw-keycloak
      path: charts/openshell-keycloak
    # One namespace and three apps (secrets, bill of materials, VM) per user,
    # from overrides/saw-users.yaml. The chart release is tracked here; the
    # Application objects it creates live in the Argo CD namespace.
    # prune drops a user's Applications when their list entry is removed.
    # pruneOnRemove in the chart decides whether the VM and namespace go too.
    saw-users:
      name: saw-users
      namespace: openshell-agents
      path: charts/saw-users
      extraValueFiles:
        - /overrides/saw-users.yaml
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
    governance-policy:
      name: governance-policy
      namespace: openshell-agents
      path: charts/governance-policy
    # prune: switching global.governance.engine removes the interceptor's
    # Deployment and Service (APF takes over the Service name) and back.
    governance-interceptor:
      name: governance-interceptor
      namespace: openshell-agents
      path: charts/governance-interceptor
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 20
