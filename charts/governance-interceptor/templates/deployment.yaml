{{- if and .Values.enabled (eq (include "governance.engine" .) "interceptor") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-interceptor
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: governance-interceptor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: governance-interceptor
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: interceptor
          image: {{ .Values.image }}
          imagePullPolicy: Always
          args:
            - --listen
            - "0.0.0.0:{{ .Values.port }}"
            - --policy
            - /config/policy/policy.yaml
            - --profiles
            - /config/profiles
            {{- if .Values.gatewayEndpoint }}
            - --gateway-endpoint
            - {{ .Values.gatewayEndpoint | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: {{ .Values.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: policy
              mountPath: /config/policy
              readOnly: true
            - name: profiles
              mountPath: /config/profiles
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: governance-interceptor-policy
        - name: profiles
          configMap:
            name: governance-interceptor-profiles
{{- end }}
