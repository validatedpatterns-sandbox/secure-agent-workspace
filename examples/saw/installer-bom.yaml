# Example InstallerBOM (the openshell-saw chart default, `bom:` in values.yaml).
# Every OpenShell component is pinned by image digest; the in-guest installer
# pulls each image, copies the binary out, checks its version and installs it.
# To upgrade: change versions/digests here (or in chart values) and restart the VM.
apiVersion: saw.redhat.com/v1alpha1
kind: InstallerBOM
metadata:
  name: openshell-0-1-6-rhaiv-4
spec:
  # Version of charts/openshell-saw/files/installer/apply_bom.py this BOM targets.
  installerVersion: 0.1.0
  openshell:
    cli:
      version: 0.1.6-rhaiv.4
      image: quay.io/opendatahub/odh-openshell-cli@sha256:9128f07cbb29b87472a71e09a4b164ec35ea0484712cc31028209f8d1e5291c4
    gateway:
      version: 0.1.6-rhaiv.4
      image: quay.io/opendatahub/odh-openshell-gateway@sha256:bd2d7c9084b80b8d3d8ef92d00a27b963b35168fad84cd862b7f91fd9c488c3e
    supervisor:
      version: 0.1.6-rhaiv.4
      image: quay.io/opendatahub/odh-openshell-supervisor@sha256:626b91a0f53393dac0d591c142b81100916aa66b4e65444b5527672b5533fe86
      # Optional: where the binary lives inside the image (this is the default).
      # path: /openshell-supervisor
    # OpenShell 0.1.x: the sandbox runtime image the gateway mounts the
    # supervisor from. Pulled only; nothing is extracted.
    sandbox:
      version: 0.1.6-rhaiv.4
      image: quay.io/opendatahub/odh-openshell-sandbox@sha256:0cde11346e68485907c22d3c9b30802e52cf16e3853720a864ac8347bb68f6ef
  # Optional: only needed by `type: nemoclaw` sandboxes.
  # nemoclaw:
  #   cliImage: ghcr.io/validatedpatterns-sandbox/nemoclaw-cli@sha256:<digest>
