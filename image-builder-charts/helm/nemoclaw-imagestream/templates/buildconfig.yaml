{{- if .Values.source.discoveryImage }}
{{- if not (regexMatch "^[^[:space:]@]+@sha256:[a-f0-9]{64}$" .Values.source.discoveryImage) }}
{{- fail "source.discoveryImage must be an image pinned by sha256 digest" }}
{{- end }}
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ (split ":" .Values.output.imageStreamTag)._0 }}
  labels:
    {{- include "nemoclaw-imagestream.labels" . | nindent 4 }}
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.source.git.uri }}
      ref: {{ .Values.source.git.ref }}
    images:
      - from:
          kind: DockerImage
          name: {{ .Values.source.discoveryImage | quote }}
        paths:
          - sourcePath: /reviewed-runtime-bundle/mcp-tool-discovery/.
            destinationDir: tools/mcp-tool-discovery-runtime/reviewed-runtime-bundle/mcp-tool-discovery
    configMaps:
      - configMap:
          name: nemoclaw-mcporter-runtime
        destinationDir: agents/openclaw/mcporter-runtime
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      buildArgs:
        - name: TARGETARCH
          value: {{ .Values.build.targetArch | quote }}
        - name: BASE_IMAGE
          value: {{ .Values.build.baseImage | quote }}
        - name: NEMOCLAW_MODEL
          value: {{ .Values.build.model | quote }}
        - name: NEMOCLAW_INFERENCE_BASE_URL
          value: {{ .Values.build.inferenceBaseUrl | quote }}
        - name: NEMOCLAW_INFERENCE_API
          value: {{ .Values.build.inferenceApi | quote }}
        - name: NEMOCLAW_CONTEXT_WINDOW
          value: {{ .Values.build.contextWindow | quote }}
        - name: NEMOCLAW_MAX_TOKENS
          value: {{ .Values.build.maxTokens | quote }}
        - name: NEMOCLAW_REASONING
          value: {{ .Values.build.reasoning | quote }}
        - name: NEMOCLAW_TOOL_DISCLOSURE
          value: {{ .Values.build.toolDisclosure | quote }}
        - name: NEMOCLAW_AGENT_TIMEOUT
          value: {{ .Values.build.agentTimeout | quote }}
        - name: NEMOCLAW_WEB_SEARCH_ENABLED
          value: {{ .Values.build.webSearchEnabled | quote }}
        - name: NEMOCLAW_OPENCLAW_OTEL
          value: {{ .Values.build.otelEnabled | quote }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ .Values.output.imageStreamTag }}
  triggers: []
{{- end }}
