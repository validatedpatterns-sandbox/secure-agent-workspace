{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: governance-interceptor
  labels:
    app.kubernetes.io/name: governance-interceptor
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # The pod serving port {{ .Values.port }}: this chart's interceptor, or APF.
  podSelector:
    matchLabels:
      {{- include "governance.podSelector" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.port }}
          protocol: TCP
      from:
        # KubeVirt VM pods in this namespace (gateway connects to interceptor)
        - podSelector:
            matchLabels:
              kubevirt.io: virt-launcher
        # Gateway VMs of SAWs, each in its own labelled namespace
        - namespaceSelector:
            matchLabels:
              {{ .Values.sawNamespaceLabel.key }}: {{ .Values.sawNamespaceLabel.value | quote }}
          podSelector:
            matchLabels:
              kubevirt.io: virt-launcher
        {{- range .Values.kubernetesGateways }}
        {{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (.namespace | default ""))) (gt (len .namespace) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" (.gatewayId | default ""))) (gt (len .gatewayId) 19) }}
        {{- fail "kubernetesGateways requires exact namespace and gatewayId DNS labels" }}
        {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .gatewayId | quote }}
              openshell.pattern/role: gateway
        {{- end }}
{{- end }}
