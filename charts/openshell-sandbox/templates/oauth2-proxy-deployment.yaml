{{- if .Values.accessControl.enabled }}
{{- if not .Values.oidc.issuerUrl }}
{{- fail "oidc.issuerUrl is required when accessControl.enabled is true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: auth-proxy
          image: {{ .Values.accessControl.image }}
          ports:
            - name: proxy
              containerPort: 4180
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: proxy
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /usr/local/openresty/nginx/conf/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
{{- end }}
