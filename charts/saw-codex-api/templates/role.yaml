apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "saw-codex-api.fullname" . }}
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
rules:
  # Read VMs and VMIs for session listing
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list"]
  # Read Routes for codex WebSocket URLs
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
  # Read codex-secret for JWT minting
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Helm operations — manage releases (VMs, Services, Routes, Jobs, etc.)
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "serviceaccounts", "pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["create", "delete", "patch", "update"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["create", "delete", "patch", "update"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["create", "delete", "get", "list"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
