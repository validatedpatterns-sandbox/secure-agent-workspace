# Per-user sandbox configuration.
# Only the owner is required — all other values use defaults from values.yaml.
accessControl:
  owner: alice

job:
  waitForSecrets: true
  backoffLimit: 5
  activeDeadlineSeconds: 3600

nemoclawCliImage: "quay.io/rh-ai-quickstart/nemoclaw-cli:latest"

dashboard:
  insecureSkipIssuerTlsVerify: true
