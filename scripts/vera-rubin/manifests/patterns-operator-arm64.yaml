apiVersion: v1
kind: ConfigMap
metadata:
  name: patterns-operator-config
  namespace: patterns-operator
---
apiVersion: v1
data:
  controller_manager_config.yaml: "apiVersion: controller-runtime.sigs.k8s.io/v1alpha1\n\
    kind: ControllerManagerConfig\nhealth:\n  healthProbeBindAddress: :8081\nwebhook:\n\
    \  port: 9443\nleaderElection:\n  leaderElect: true\n  resourceName: f2850479.hybrid-cloud-patterns.io\n"
kind: ConfigMap
metadata:
  name: patterns-operator-manager-config
  namespace: patterns-operator
---
apiVersion: v1
data:
  nginx.conf: "error_log /dev/stdout info;\nevents {}\nhttp {\n  access_log      \
    \   /dev/stdout;\n  include            /etc/nginx/mime.types;\n  default_type\
    \       application/octet-stream;\n  keepalive_timeout  65;\n  types {\n    text/yaml\
    \         yaml yml;\n  }\n  server {\n    listen              9444 ssl;\n    listen\
    \              [::]:9444 ssl;\n    ssl_certificate     /var/cert/tls.crt;\n  \
    \  ssl_certificate_key /var/cert/tls.key;\n    root                /usr/share/nginx/html;\n\
    \  }\n}\n"
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
  name: patterns-operator-pattern-ui-catalog
  namespace: patterns-operator
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: patterns-operator-pattern-ui-catalog-cert
  labels:
    app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
  name: patterns-operator-pattern-ui-catalog
  namespace: patterns-operator
spec:
  ports:
  - name: 9444-tcp
    port: 9444
    protocol: TCP
    targetPort: https
  selector:
    app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.openshift.io/serving-cert-signed-by: openshift-service-serving-signer@1792158198
    service.beta.openshift.io/serving-cert-secret-name: webhook-server-cert
    service.beta.openshift.io/serving-cert-signed-by: openshift-service-serving-signer@1792158198
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: patterns-operator
  name: patterns-operator-webhook-service
  namespace: patterns-operator
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    control-plane: controller-manager
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: patterns-operator
    control-plane: controller-manager
  name: patterns-operator-controller-manager
  namespace: patterns-operator
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      control-plane: controller-manager
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --leader-elect
        command:
        - /manager
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        image: quay.io/sauagarw/patterns-operator:0.0.4-arm64
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: manager
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
      serviceAccount: patterns-operator-controller-manager
      serviceAccountName: patterns-operator-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
  name: patterns-operator-pattern-ui-catalog
  namespace: patterns-operator
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: patterns-operator-pattern-ui-catalog
    spec:
      containers:
      - image: quay.io/validatedpatterns/pattern-ui-catalog:stable-v1
        imagePullPolicy: Always
        name: patterns-operator-pattern-ui-catalog
        ports:
        - containerPort: 9444
          name: https
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 50Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/cert
          name: pattern-ui-catalog-cert
          readOnly: true
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-conf
          readOnly: true
          subPath: nginx.conf
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
      serviceAccount: patterns-operator-controller-manager
      serviceAccountName: patterns-operator-controller-manager
      terminationGracePeriodSeconds: 30
      volumes:
      - name: pattern-ui-catalog-cert
        secret:
          defaultMode: 420
          secretName: patterns-operator-pattern-ui-catalog-cert
      - configMap:
          defaultMode: 420
          name: patterns-operator-pattern-ui-catalog
        name: nginx-conf
