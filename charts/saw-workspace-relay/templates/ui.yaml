{{- if and .Values.enabled .Values.subject }}
{{- $v := .Values }}{{- $n := .Release.Name }}
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $n }}}
data:
  relay.json: {{ pick $v "issuer" "clientID" "subject" "audience" "gatewayEndpoint" | toJson | quote }}
  users: {{ printf "%s\n" $v.ownerSubject | quote }}
  ca.crt: |
{{ $v.gatewayCA | indent 4 }}
  token.py: |
{{ .Files.Get "files/token.py" | indent 4 }}
  saw_ui_limit.py: |
{{ .Files.Get "files/saw_ui_limit.py" | indent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $n }}-router}
spec:
  podSelector: {matchLabels: {app: {{ $n }}, role: relay}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}
    ports: [{protocol: TCP, port: 4180}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $n }}
  annotations: {argocd.argoproj.io/sync-wave: '3'}
spec:
  replicas: {{ ternary 0 1 (.Values.paused | default false) }}
  selector: {matchLabels: {app: {{ $n }}, role: relay}}
  template:
    metadata:
      labels: {app: {{ $n }}, role: relay}
      annotations: {checksum/config: {{ printf "%s%s%s" ($v | toJson) (.Files.Get "files/token.py") (.Files.Get "files/saw_ui_limit.py") | sha256sum }}}
    spec:
      serviceAccountName: {{ $n }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - name: initial-token
        image: {{ $v.pythonImage }}
        command: [python3, /config/token.py, once]
        securityContext: &restricted {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: &tokenMounts
        - {name: config, mountPath: /config, readOnly: true}
        - {name: credential, mountPath: /credential, readOnly: true}
        - {name: session, mountPath: /session}
      containers:
      - name: token-refresh
        image: {{ $v.pythonImage }}
        command: [python3, /config/token.py, refresh]
        securityContext: *restricted
        volumeMounts: *tokenMounts
        readinessProbe:
          exec:
            command: [python3, -c, "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:28789/',timeout=4).status==200"]
          timeoutSeconds: 6
          periodSeconds: 15
      - name: forward
        image: {{ $v.cliImage }}
        command: [/bin/sh, -c]
        args:
        - |
          while true; do
            openshell forward service -g relay --workspace "$1" "$2" --target-port 18789 --local 127.0.0.1:28789
            sleep 2
          done
        - relay
        - {{ $v.workspace }}
        - {{ $v.sandbox }}
        env: [{name: XDG_CONFIG_HOME, value: /session}, {name: HOME, value: /session}]
        securityContext: *restricted
        volumeMounts: [{name: session, mountPath: /session}]
      - name: transport
        image: {{ $v.pythonImage }}
        # token.py shares this ConfigMap; isolate stdlib imports from /config.
        command: [python3, -I, /config/saw_ui_limit.py, '18789', '28789', '16', --connect-only]
        securityContext: *restricted
        env:
        - {name: SAW_BROWSER_OWNER_SUBJECT, value: {{ $v.ownerSubject | quote }}}
        - {name: SAW_BROWSER_RELAY_PROOF_FILE, value: /proof/relay-proof}
        volumeMounts:
        - {name: config, mountPath: /config, readOnly: true}
        - {name: proof, mountPath: /proof, readOnly: true}
      - name: browser-login
        image: {{ $v.proxyImage }}
        args:
        - --http-address=0.0.0.0:4180
        - --upstream=http://127.0.0.1:18789
        - --provider=oidc
        - --oidc-issuer-url={{ $v.issuer }}
        - --client-id=openshell-dashboard
        - --client-secret-file=/dev/null
        - --code-challenge-method=S256
        - --redirect-url=https://{{ $v.host }}/oauth2/callback
        - --scope=openid email profile
        - --oidc-email-claim=sub
        - --authenticated-emails-file=/config/users
        - --insecure-oidc-allow-unverified-email=true
        - --pass-user-headers=true
        - --skip-provider-button=true
        - --request-logging=false
        - --reverse-proxy=true
        - --cookie-secure=true
        - --cookie-refresh=60s
        - --cookie-name=_saw_relay_session
        env:
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom: {secretKeyRef: {name: relay-credentials, key: cookie-secret}}
        ports: [{name: http, containerPort: 4180}]
        readinessProbe: {httpGet: {path: /ping, port: http}}
        securityContext: *restricted
        volumeMounts: [{name: config, mountPath: /config, readOnly: true}]
      volumes:
      - {name: session, emptyDir: {medium: Memory, sizeLimit: 2Mi}}
      - {name: config, configMap: {name: {{ $n }}}}
      - name: proof
        secret: {secretName: relay-credentials, items: [{key: relay-proof, path: relay-proof}]}
      - name: credential
        secret: {secretName: relay-credentials, defaultMode: 0440, items: [{key: client-secret, path: client-secret}]}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $n }}}
spec:
  selector: {app: {{ $n }}, role: relay}
  ports: [{port: 4180, targetPort: http, name: http}]
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $n }}
  labels: {saw.redhat.com/oidc-redirect: "true"}
  annotations: {argocd.argoproj.io/sync-wave: '4', haproxy.router.openshift.io/set-forwarded-headers: replace}
spec:
  host: {{ required "UI hostname required" $v.host }}
  to: {kind: Service, name: {{ $n }}}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
{{- end }}
