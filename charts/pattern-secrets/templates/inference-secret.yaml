apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inference
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: inference
    template:
      type: Opaque
      data:
        provider: {{ printf "{{ .provider }}" | quote }}
        model: {{ printf "{{ .model }}" | quote }}
        api_key: {{ printf "{{ .api_key }}" | quote }}
        url: {{ printf "{{ .url }}" | quote }}
  data:
    - secretKey: provider
      remoteRef:
        key: {{ .Values.vaultPrefix }}/inference
        property: provider
    - secretKey: model
      remoteRef:
        key: {{ .Values.vaultPrefix }}/inference
        property: model
    - secretKey: api_key
      remoteRef:
        key: {{ .Values.vaultPrefix }}/inference
        property: api_key
    - secretKey: url
      remoteRef:
        key: {{ .Values.vaultPrefix }}/inference
        property: url
