{{- include "openshell-sandbox.validateSandboxName" (.Values.sandboxName | default .Release.Name) }}
{{- if ne .Values.containerRuntime "podman" }}
{{- fail "containerRuntime: the in-guest installer supports podman only" }}
{{- end }}
{{- $secrets := include "openshell-sandbox.providerSecrets" . | fromJsonArray }}
{{- if .Values.spiffe.enabled }}
{{- $_ := required "spiffe.trustDomain is required" .Values.spiffe.trustDomain }}
{{- if ne .Values.spiffe.serverTransport "tcp" }}
{{- fail "spiffe.serverTransport must be tcp" }}
{{- end }}
{{- end }}
{{- range $secrets }}{{- include "openshell-sandbox.validateSecretName" . }}{{- end }}
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
    openshell.pattern/role: gateway
    {{- if .Values.spiffe.enabled }}
    saw.redhat.com/spiffe: "true"
    {{- end }}
  {{- if .Values.spiffe.enabled }}
  annotations:
    saw.redhat.com/trust-domain: {{ .Values.spiffe.trustDomain | quote }}
    saw.redhat.com/gateway-uid: {{ .Values.spiffe.gatewayUID | quote }}
  {{- end }}
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: {{ include "openshell-sandbox.fullname" . }}-root
        annotations:
          cdi.kubevirt.io/storage.bind.immediate.requested: "true"
      spec:
        {{- if .Values.source.registryURL }}
        source:
          registry:
            url: {{ .Values.source.registryURL | quote }}
            pullMethod: node
        {{- else if .Values.source.httpURL }}
        source:
          http:
            url: {{ .Values.source.httpURL | quote }}
        {{- else }}
        sourceRef:
          kind: DataSource
          name: {{ include "openshell-sandbox.dataSourceName" . }}
          namespace: {{ include "openshell-sandbox.goldenNamespace" . }}
        {{- end }}
        {{- $access := .Values.vm.accessMode | default "ReadWriteOnce" }}
        {{- if not (has $access (list "ReadWriteOnce" "ReadWriteMany")) }}
        {{- fail "vm.accessMode must be ReadWriteOnce or ReadWriteMany" }}
        {{- end }}
        {{- $volumeMode := .Values.vm.volumeMode | default "" }}
        {{- if and $volumeMode (not (has $volumeMode (list "Filesystem" "Block"))) }}
        {{- fail "vm.volumeMode must be Filesystem, Block, or empty" }}
        {{- end }}
        storage:
          {{- with .Values.vm.storageClass }}
          storageClassName: {{ . | quote }}
          {{- end }}
          accessModes:
            - {{ $access }}
          {{- if $volumeMode }}
          volumeMode: {{ $volumeMode }}
          {{- end }}
          resources:
            requests:
              storage: {{ .Values.vm.diskSize }}
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
        openshell.pattern/role: gateway
      annotations:
        # Cloud-init still needs a restart. With vm.liveInputs the installer
        # ConfigMap and Secrets are virtiofs, so they are not in this checksum.
        {{- if not .Values.vm.liveInputs }}
        openshell.pattern/installer-checksum: {{ include (print $.Template.BasePath "/configmap-installer.yaml") . | sha256sum | trunc 16 | quote }}
        {{- end }}
        openshell.pattern/cloudinit-checksum: {{ include (print $.Template.BasePath "/secret-cloudinit.yaml") . | sha256sum | trunc 16 | quote }}
    spec:
      domain:
        cpu:
          cores: {{ .Values.vm.cores }}
        resources:
          requests:
            memory: {{ .Values.vm.memory }}
        devices:
          # Send the serial console (where saw-install/saw-apply log) to the
          # virt-launcher pod's guest-console-log container, even when the
          # cluster default leaves serial console logging off.
          logSerialConsole: true
          disks:
            {{- if .Values.spiffe.enabled }}
            - name: saw-spire
              serial: saw-spire
              disk:
                bus: virtio
            {{- end }}
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            {{- if not .Values.vm.liveInputs }}
            - name: saw-installer
              serial: saw-installer
              disk:
                bus: virtio
            - name: saw-profiles
              serial: saw-profiles
              disk:
                bus: virtio
            {{- range $i, $name := $secrets }}
            - name: saw-sec-{{ $i }}
              serial: saw-sec-{{ $i }}
              disk:
                bus: virtio
            {{- end }}
            {{- end }}
          {{- if .Values.vm.liveInputs }}
          filesystems:
            - name: saw-installer
              virtiofs: {}
            - name: saw-profiles
              virtiofs: {}
            {{- range $i, $name := $secrets }}
            - name: saw-sec-{{ $i }}
              virtiofs: {}
            {{- end }}
          {{- end }}
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: gateway
                  port: 17670
                  protocol: TCP
                - name: dashboard
                  port: 18789
                  protocol: TCP
                - name: webui
                  port: 8080
                  protocol: TCP
                - name: ssh
                  port: 22
                  protocol: TCP
                {{- range $e := include "openshell-sandbox.sandboxUi" . | fromJsonArray }}
                - name: {{ $e.portName }}
                  port: {{ $e.proxyPort }}
                  protocol: TCP
                {{- end }}
        firmware:
          bootloader:
            efi:
              secureBoot: false
        features:
          acpi: {}
          smm: {}
      # Dynamic SSH key provisioning: the guest agent keeps cloud-user's
      # authorized_keys in sync with this Secret, also while the VM runs.
      # `make openshell-saw-vm-ssh` adds the caller's key to it.
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: {{ include "openshell-sandbox.sshKeySecretName" . }}
            propagationMethod:
              qemuGuestAgent:
                users:
                  - cloud-user
      {{- if .Values.vm.readinessProbe }}
      # Labeled helper: virt_qemu_ga_t cannot getattr /var/lib/saw (var_lib_t).
      # The helper checks installer completion and agent health. Failure does not re-enroll.
      readinessProbe:
        exec:
          command: ["/usr/libexec/saw-ready"]
        initialDelaySeconds: 60
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      {{- end }}
      networks:
        - name: default
          pod: {}
      volumes:
        {{- if .Values.spiffe.enabled }}
        - name: saw-spire
          secret:
            secretName: {{ include "openshell-sandbox.fullname" . }}-spire-join-token
        {{- end }}
        - name: rootdisk
          dataVolume:
            name: {{ include "openshell-sandbox.fullname" . }}-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: {{ include "openshell-sandbox.fullname" . }}-cloudinit
        - name: saw-installer
          configMap:
            name: {{ include "openshell-sandbox.fullname" . }}-installer
        - name: saw-profiles
          configMap:
            name: saw-bom-profiles
            optional: true
        {{- range $i, $name := $secrets }}
        - name: saw-sec-{{ $i }}
          secret:
            secretName: {{ $name }}
            optional: true
        {{- end }}
