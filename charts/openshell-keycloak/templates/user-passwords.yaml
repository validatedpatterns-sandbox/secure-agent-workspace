{{- /* The test users' passwords from Vault (Validated Pattern; values-secret
     keycloak-users, generated by the secrets loader). Synced before the
     realm import, which reads them as placeholders. */ -}}
{{- if .Values.keycloak.userPasswords.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloak.userPasswords.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.keycloak.userPasswords.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.keycloak.userPasswords.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.keycloak.userPasswords.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.keycloak.userPasswords.externalSecret.vaultKey }}
{{- end }}
