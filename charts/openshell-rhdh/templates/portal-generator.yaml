{{- /* The ApplicationSet plugin generator (portal.py serve): one parameter
set per workspace registry entry. Also serves /catalog.yaml for RHDH. */ -}}
{{- $ns := .Values.portal.namespace -}}
{{- $port := int .Values.portal.generator.port -}}
apiVersion: v1
kind: Secret
metadata:
  name: saw-workspaces-generator
  namespace: {{ $ns }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ include "openshell-rhdh.generatorToken" . | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: saw-workspaces-generator
  namespace: {{ $ns }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
    app.kubernetes.io/name: saw-workspaces-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: saw-workspaces-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saw-workspaces-generator
      annotations:
        checksum/scripts: {{ .Files.Get "files/portal.py" | sha256sum | trunc 16 }}
        checksum/catalog: {{ .Files.Get "files/profile-catalog.json" | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: saw-workspaces-generator
      containers:
        - name: generator
          image: {{ .Values.portal.image }}
          command: ["python3", "/opt/saw/portal.py", "serve"]
          ports:
            - name: http
              containerPort: {{ $port }}
          env:
            - name: NAMESPACE
              value: {{ $ns }}
            - name: PORT
              value: {{ $port | quote }}
            - name: CATALOG_PATH
              value: /opt/saw/profile-catalog.json
            - name: GENERATOR_TOKEN_FILE
              value: /etc/saw-generator/token
            - name: CLUSTER_DOMAIN
              value: {{ .Values.global.clusterDomain | quote }}
            - name: RHDH_BASE_URL
              value: {{ include "openshell-rhdh.url" . }}
            # /status checks the caller's Backstage token against RHDH's keys.
            - name: RHDH_INTERNAL_URL
              value: {{ include "openshell-rhdh.internalUrl" . }}
            - name: ARGO_NAMESPACE
              value: {{ include "openshell-rhdh.argoNamespace" . }}
            {{- if .Values.rhdh.rbac.enabled }}
            # The realm's users (members of usersGroup), for the group of
            # users without a workspace (RBAC: who sees the create action).
            - name: KEYCLOAK_URL
              value: https://{{ include "openshell-rhdh.keycloakHost" . }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId }}
            - name: KEYCLOAK_SECRET_FILE
              value: /etc/saw-keycloak/client_secret
            - name: KEYCLOAK_SKIP_VERIFY
              value: {{ .Values.keycloak.insecureSkipTlsVerify | toString | quote }}
            - name: USERS_GROUP
              value: {{ .Values.rhdh.rbac.usersGroup | quote }}
            {{- end }}
            - name: PORTAL_ADMINS
              value: {{ .Values.portal.admins | default list | join "," | quote }}
            # Without pruning, a deleted workspace's namespace stays.
            - name: PRUNE_ON_REMOVE
              value: {{ .Values.portal.pruneOnRemove | toString | quote }}
            - name: SAW_USERS_VALUES
              value: {{ include "openshell-rhdh.sawUsersValues" . | toJson }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          volumeMounts:
            - name: scripts
              mountPath: /opt/saw
              readOnly: true
            - name: token
              mountPath: /etc/saw-generator
              readOnly: true
            {{- if .Values.rhdh.rbac.enabled }}
            - name: keycloak
              mountPath: /etc/saw-keycloak
              readOnly: true
            {{- end }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: scripts
          configMap:
            name: saw-portal-scripts
        - name: token
          secret:
            secretName: saw-workspaces-generator
        {{- if .Values.rhdh.rbac.enabled }}
        - name: keycloak
          secret:
            secretName: saw-generator-keycloak
            optional: true
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: saw-workspaces-generator
  namespace: {{ $ns }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: saw-workspaces-generator
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- if .Values.portal.generator.networkPolicy }}
---
# The generator answers two callers only: RHDH's backend (/catalog.yaml, no
# token; /status, the user's Backstage token) and the ApplicationSet
# controller (plugin API, token).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-workspaces-generator
  namespace: {{ $ns }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: saw-workspaces-generator
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.rhdh.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "openshell-rhdh.argoNamespace" . }}
      ports:
        - protocol: TCP
          port: {{ $port }}
{{- end }}
{{- if .Values.rhdh.rbac.enabled }}
---
# The rhdh client's secret (from Vault, as rhdh-oidc): the generator reads the
# realm's users with its service account (view-users, query-groups).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: saw-generator-keycloak
  namespace: {{ .Values.portal.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.oidcSecret.secretStoreRef.name }}
    kind: {{ .Values.oidcSecret.secretStoreRef.kind }}
  target:
    name: saw-generator-keycloak
    template:
      type: Opaque
      engineVersion: v2
      data:
        client_secret: {{ printf "{{ .client_secret }}" | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.oidcSecret.vaultKey }}
{{- end }}
