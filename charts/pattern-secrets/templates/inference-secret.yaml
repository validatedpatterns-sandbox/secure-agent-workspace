{{- if has "inference" (.Values.secrets | default list) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inference
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: inference
    template:
      type: Opaque
      engineVersion: v2
      data:
        provider: {{ printf "{{ .provider }}" | quote }}
        # Optional: the portal stores a model only when the profile asks for
        # one (found live: a data-science workspace has no model key, and the
        # template failed, so no Secret and no VM install).
        model: {{ printf "{{ index . \"model\" | default \"\" }}" | quote }}
        api_key: {{ printf "{{ .api_key }}" | quote }}
        url: {{ printf "{{ index . \"url\" | default \"\" }}" | quote }}
  dataFrom:
    - extract:
        key: {{ .Values.vaultPrefix }}/inference
{{- end }}
