name: Profile catalog

# The RHDH create-workspace form and the profile catalogs that the
# openshell-rhdh and saw-users charts read are generated from
# charts/saw-bom/profiles by scripts/saw-profile-catalog.py. This workflow
# regenerates them whenever a profile changes, so adding a profile is only
# adding its directory under charts/saw-bom/profiles/.
#
# - Pull request from a branch of this repository: the regenerated files
#   are committed to that branch.
# - Pull request from a fork: the workflow token cannot write to a fork's
#   branch, so the job fails with the command to run and attaches the
#   regenerated files as profile-catalog.patch. (`make git-hooks` makes a
#   local commit regenerate them instead.)
#
# A push made with the default GITHUB_TOKEN does not start other workflows,
# so checks required on the PR's last commit would not run on the
# regenerated commit. Set the CATALOG_PUSH_TOKEN secret (a GitHub App token
# or fine-grained token with contents: write on this repository only) to
# have them run. Note that anyone who can push a branch here can read that
# token from a PR's workflow run, so scope it to this repository.

on:
  pull_request:
    paths:
      - "charts/saw-bom/profiles/**"
      - "scripts/saw-profile-catalog.py"
      - "charts/saw-users/files/profile-catalog.json"
      - "charts/openshell-rhdh/files/profile-catalog.json"
      - "charts/openshell-rhdh/files/create-workspace*.yaml"
      - "charts/openshell-rhdh/files/delete-workspace*.yaml"
  push:
    branches: [main]
    paths:
      - "charts/saw-bom/profiles/**"
      - "scripts/saw-profile-catalog.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-catalog-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's branch itself (not the merge commit), so a fix can be
          # pushed to it.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.CATALOG_PUSH_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Regenerate the profile catalog
        run: python scripts/saw-profile-catalog.py
      - name: Commit it, or say how to
        env:
          SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          outputs=$(python scripts/saw-profile-catalog.py --list)
          # shellcheck disable=SC2086
          if git diff --quiet -- $outputs; then
            echo "The profile catalog is up to date."
            exit 0
          fi
          # shellcheck disable=SC2086
          git diff --stat -- $outputs
          if [ "$SAME_REPO" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # shellcheck disable=SC2086
            git add -- $outputs
            git commit -m "chore(catalog): regenerate the profile catalog" \
              -m "Generated by scripts/saw-profile-catalog.py (Profile catalog workflow)."
            git push origin "HEAD:$BRANCH"
            echo "::notice::Regenerated the profile catalog and pushed it to $BRANCH."
            exit 0
          fi
          # shellcheck disable=SC2086
          git diff -- $outputs > profile-catalog.patch
          echo "::error::The profile catalog is stale. Run 'make catalog' and commit the result (or run 'make git-hooks' once so commits do it), or download the profile-catalog-patch artifact and run: git apply profile-catalog.patch"
          exit 1
      - name: Attach the regenerated files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: profile-catalog-patch
          path: profile-catalog.patch
          if-no-files-found: ignore
