apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openshell-keycloak.fullname" . }}
  labels:
    {{- include "openshell-keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      {{- include "openshell-keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openshell-keycloak.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/realm: {{ include (print .Template.BasePath "/realm-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-realm
          image: {{ .Values.keycloak.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: [sh, -c]
          args:
            - |
              mkdir -p /data/import
              cp /realm-source/openshell-realm.json /data/import/openshell-realm.json
              echo "Realm JSON copied to /data/import/"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: realm-config
              mountPath: /realm-source
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - start-dev
            - --import-realm
            - --hostname-strict=false
            - --proxy-headers=xforwarded
            - --http-enabled=true
          envFrom:
            - secretRef:
                name: {{ include "openshell-keycloak.fullname" . }}-admin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "openshell-keycloak.fullname" . }}-data
        - name: realm-config
          configMap:
            name: {{ include "openshell-keycloak.fullname" . }}-realm
