{{- /*
cloud-init user data, rendered directly (the old setup Job generated this
Secret at runtime to inject an SSH key). No SSH is needed.

cloud-init runs these modules once per VM instance, and a VM restart keeps
the same instance. So everything here is either first-boot bootstrap or
static. Anything that may change later (BOM, gateway config, Secret list,
route SAN) lives on the installer disk, which is re-read on every boot.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-cloudinit
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  userData: |
    #cloud-config
    hostname: {{ include "openshell-sandbox.fullname" . }}
    fqdn: {{ include "openshell-sandbox.fullname" . }}.{{ .Release.Namespace }}.svc

    users:
      - default
      - name: cloud-user
        groups: [wheel]
        sudo: ["ALL=(ALL) NOPASSWD:ALL"]
        shell: /bin/bash
        # No ssh_authorized_keys here: SSH keys are provisioned dynamically by
        # KubeVirt accessCredentials (the guest agent owns authorized_keys).

    write_files:
      # First-boot copies: the golden image's openshell-gateway-setup.service
      # needs these before the installer has run. The installer keeps them
      # in sync with the chart afterwards.
      - path: /etc/openshell/gateway.env
        owner: root:root
        permissions: "0644"
        content: |
          {{- include "openshell-sandbox.gatewayEnv" . | nindent 10 }}

      - path: /etc/openshell/gateway.toml
        owner: root:root
        permissions: "0644"
        content: |
          {{- include "openshell-sandbox.gatewayToml" . | nindent 10 }}

      - path: /usr/local/sbin/saw-mount-inputs
        owner: root:root
        permissions: "0755"
        content: |
          {{- .Files.Get "files/guest/saw-mount-inputs.sh" | nindent 10 }}

      - path: /usr/local/sbin/saw-with-lock
        owner: root:root
        permissions: "0755"
        content: |
          {{- .Files.Get "files/guest/saw-with-lock" | nindent 10 }}

      - path: /usr/local/sbin/saw-stage-installer
        owner: root:root
        permissions: "0755"
        content: |
          {{- .Files.Get "files/guest/saw-stage-installer" | nindent 10 }}
      {{- if .Values.vm.liveInputs }}
      - path: /usr/local/sbin/saw-reconcile
        owner: root:root
        permissions: "0755"
        content: |
          {{- .Files.Get "files/guest/saw-reconcile" | nindent 10 }}

      - path: /etc/systemd/system/saw-reconcile.service
        owner: root:root
        permissions: "0644"
        content: |
          {{- .Files.Get "files/guest/saw-reconcile.service" | nindent 10 }}

      - path: /etc/systemd/system/saw-inputs.path
        owner: root:root
        permissions: "0644"
        content: |
          {{- .Files.Get "files/guest/saw-inputs.path" | nindent 10 }}

      - path: /etc/systemd/system/saw-inputs.timer
        owner: root:root
        permissions: "0644"
        content: |
          {{- .Files.Get "files/guest/saw-inputs.timer" | nindent 10 }}
      {{- end }}

      - path: /etc/systemd/system/saw-install.service
        owner: root:root
        permissions: "0644"
        content: |
          {{- .Files.Get "files/guest/saw-install.service" | nindent 10 }}

      {{- if .Values.vm.gpu.enabled }}
      - path: /etc/systemd/system/saw-install.service.d/gpu.conf
        owner: root:root
        permissions: "0644"
        content: |
          [Unit]
          Requires=saw-gpu-devices.service
          After=saw-gpu-devices.service
      {{- end }}

      - path: /etc/systemd/system/saw-apply.service
        owner: root:root
        permissions: "0644"
        content: |
          {{- .Files.Get "files/guest/saw-apply.service" | nindent 10 }}

    runcmd:
      - |
        set -uo pipefail
        # Enable the installer first, so it runs on later boots even if the
        # first-boot gateway setup below fails this time.
        systemctl daemon-reload
        systemctl enable saw-install.service saw-apply.service
        {{- if .Values.vm.liveInputs }}
        systemctl enable --now saw-inputs.path saw-inputs.timer
        {{- end }}
        # Let the guest agent write authorized_keys (KubeVirt accessCredentials).
        setsebool -P virt_qemu_ga_manage_ssh on || true
        install -d -m 0750 -o root -g cloud-user /etc/openshell
        systemctl start openshell-gateway-setup.service \
          || echo "openshell-gateway-setup failed; it is retried on the next boot"
        # Queue both steps without waiting, so cloud-init is not blocked.
        systemctl start --no-block saw-install.service saw-apply.service

    final_message: "openshell-saw cloud-init finished; saw-install and saw-apply queued"
