apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: {{ include "openshell-gateway.fullname" . }}-root
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
  annotations:
    cdi.kubevirt.io/storage.bind.immediate.requested: "true"
spec:
  source:
    registry:
      url: "docker://{{ .Values.image.containerDisk }}"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.vm.diskSize }}
