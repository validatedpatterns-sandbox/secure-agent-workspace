{{- if .Values.route.dashboard }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-dashboard
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  {{- with include "openshell-sandbox.auxRouteHost" (list . "dashboard" .Values.route.dashboardHost) }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "openshell-sandbox.fullname" . }}-gateway
    weight: 100
  port:
    targetPort: dashboard
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
