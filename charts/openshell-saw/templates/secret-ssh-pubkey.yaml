{{- /*
Operator SSH public keys for KubeVirt's dynamic key provisioning
(accessCredentials in virtualmachine.yaml). The guest agent writes every value
in this Secret into cloud-user's authorized_keys, also while the VM runs.

Created empty: `make saw-vm-ssh` adds the caller's key when they
need a shell. The chart never sets `data`, so keys added that way survive
helm upgrades and Argo syncs. sshPublicKey optionally seeds one key (key1).
Not created when sshPublicKeySecret names an existing Secret.
*/ -}}
{{- if not .Values.sshPublicKeySecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshell-sandbox.sshKeySecretName" . }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
type: Opaque
{{- with include "openshell-sandbox.sshPublicKey" . }}
stringData:
  key1: {{ . | quote }}
{{- end }}
{{- end }}
