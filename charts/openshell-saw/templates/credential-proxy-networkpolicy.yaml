{{- if include "openshell-sandbox.credentialProxyEnabled" . }}
# Credential custody must not depend on opting into VM-wide segmentation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-credential-proxy
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      openshell.pattern/role: credential-proxy
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              openshell.pattern/role: gateway
      ports:
        - {protocol: TCP, port: 3128}
  {{- if .Values.networkPolicy.enabled }}
  egress:
{{ include "openshell-sandbox.commonEgressRules" (list . (list 443)) | indent 4 }}
    {{- range .Values.networkPolicy.extraEgress }}
    - {{ toYaml . | nindent 6 | trim }}
    {{- end }}
  {{- end }}
{{- end }}
