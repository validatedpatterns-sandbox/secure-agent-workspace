# Governance interceptor for signed sandbox policies.
# Runs as a gRPC service that the OpenShell gateway calls
# to enforce admin-controlled, cryptographically signed policies.
#
# Policy data (profiles + sandbox policy) is managed by the
# governance-policy chart, which creates the ConfigMap this
# deployment mounts.
enabled: true

# Which interceptor serves the governance-interceptor Service (port 18081):
#   interceptor  the OpenShell governance interceptor below, reading the
#                governance-policy ConfigMaps (default)
#   apf          NVIDIA Agent Policy Fabric (private chart and images on
#                ghcr.io), serving a signed bundle built from the same
#                governance-policy files. See docs/apf.md.
# The pattern sets global.governance.engine (values-global.yaml), which wins.
engine: interceptor

# Built by .github/workflows/build-governance-interceptor.yml on main and
# tagged with the OpenShell ref it is built from (image-builder-charts/helm/
# governance-interceptor-image/values.yaml source.git.ref). It must match the
# SAW gateways' OpenShell release.
image: "ghcr.io/validatedpatterns-sandbox/governance-interceptor:v0.1.2"
# gRPC listen port
port: 18081
# Interceptor-to-gateway connection (for hot-reload push)
gatewayEndpoint: "https://127.0.0.1:17670"
# Fail-closed: deny all operations if interceptor is unreachable
failurePolicy: "fail_closed"
# Timeout for interceptor evaluation calls
timeout: "500ms"
resources:
  limits:
    memory: 256Mi
    cpu: 500m
  requests:
    memory: 128Mi
    cpu: 100m

# SAW namespaces carrying this label may reach the interceptor from their
# gateway VMs (make openshell-saw-create and values-prod.yaml set it).
sawNamespaceLabel:
  key: openshell.pattern/saw
  value: "true"

# --- engine: apf -------------------------------------------------------------
apf:
  # The APF chart (private OCI chart on GHCR).
  chart:
    repoURL: ghcr.io/mkhaas/apf/charts
    name: apf
    version: 0.2.0
  # Pattern: an Argo CD Application installs the APF chart. Quickstart (no
  # Argo CD) turns this off and `make governance-apf` runs helm instead.
  application:
    enabled: true
  # Pattern: ExternalSecrets read the GHCR credential and the signing seed
  # from Vault (values-secret.yaml: ghcr, apf-signing). Quickstart turns this
  # off and `make governance-apf` creates the Secrets with oc.
  externalSecrets:
    enabled: true
    vaultPrefix: secret/data/hub
    refreshInterval: 15s
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
  # Secret names in this namespace.
  pullSecret: ghcr-pull
  signingSecret: governance-apf-signing
  # ConfigMaps this chart makes from files/apf (scripts/apf-bundle.py).
  bundleConfigMap: governance-apf-bundle
  trustConfigMap: governance-apf-trust
  # Values for the APF chart. The release is named governance-interceptor,
  # and fullnameOverride keeps the Service name the SAW gateways call.
  values:
    fullnameOverride: governance-interceptor
    openshift: true
    interceptor:
      port: 18081
      failurePolicy: fail_closed
      timeout: 500ms
      allowInsecureTransport: true
      # APF would call back to one gateway here; SAW has a gateway per user
      # VM, and they read the catalog through SnapshotProviderProfiles.
      gatewayEndpoint: ""
    bundle:
      manifest: bundle.yaml
    tier: 1

# Where the APF Application object is created. The pattern injects
# global.vpArgoNamespace; argo.namespace is the fallback.
argo:
  namespace: vp-gitops
  project: default
  destinationName: in-cluster
