{{- $url := include "openshell-rhdh.url" . -}}
{{- $gen := printf "saw-workspaces-generator.%s.svc:%d" .Values.portal.namespace (int .Values.portal.generator.port) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-rhdh-app-config
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
data:
  app-config-saw.yaml: |
    app:
      title: {{ .Values.rhdh.branding.title | quote }}
      branding:
        fullLogo:
          light: data:image/svg+xml;base64,{{ .Files.Get "files/logo-light.svg" | b64enc }}
          dark: data:image/svg+xml;base64,{{ .Files.Get "files/logo-dark.svg" | b64enc }}
        fullLogoWidth: {{ .Values.rhdh.branding.logoWidth }}
      baseUrl: {{ $url }}
    backend:
      baseUrl: {{ $url }}
      cors:
        origin: {{ $url }}
      reading:
        allow:
          - host: {{ $gen }}
    signInPage: oidc
    {{- if .Values.rhdh.homePage.enabled }}
    i18n:
      locales: [en]
      defaultLocale: en
      overrides:
        - /opt/app-root/src/saw/translations.json
    {{- end }}
    {{- with .Values.rhdh.hiddenMenuItems }}
    dynamicPlugins:
      frontend:
        default.main-menu-items:
          menuItems:
            {{- range . }}
            {{ . }}:
              enabled: false
            {{- end }}
    {{- end }}
    auth:
      environment: production
      session:
        secret: ${SESSION_SECRET}
      providers:
        oidc:
          production:
            metadataUrl: {{ include "openshell-rhdh.issuer" . }}/.well-known/openid-configuration
            clientId: {{ .Values.keycloak.clientId }}
            clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                # user:default/<Keycloak username>. Users are not imported
                # into the catalog; the pipeline trusts only the signed token.
                - resolver: preferredUsernameMatchingUserEntityName
                  dangerouslyAllowSignInWithoutUserInCatalog: true
    catalog:
      rules:
        - allow: [Template, Component, User, Group, Location]
      locations:
        - type: file
          target: /opt/app-root/src/saw/create-workspace.yaml
          rules:
            - allow: [Template]
        - type: file
          target: /opt/app-root/src/saw/delete-workspace.yaml
          rules:
            - allow: [Template]
        {{- if .Values.portal.admins }}
        {{- range list "create-workspace-for-user.yaml" "delete-workspace-for-user.yaml" }}
        - type: file
          target: /opt/app-root/src/saw/{{ . }}
          rules:
            - allow: [Template]
        {{- end }}
        {{- end }}
        # One Component per registered workspace, owned by its user, with
        # links to its web UIs (served by the plugin generator).
        - type: url
          target: http://{{ $gen }}/catalog.yaml
          rules:
            - allow: [Component, Group]
      processingInterval: { seconds: {{ int .Values.rhdh.catalogProcessingSeconds }} }
      {{- if .Values.rhdh.rbac.enabled }}
      # Keycloak users and groups (RBAC gives role saw-user by group), read
      # with the rhdh client's service account.
      providers:
        keycloakOrg:
          default:
            baseUrl: https://{{ include "openshell-rhdh.keycloakHost" . }}
            loginRealm: {{ .Values.keycloak.realm }}
            realm: {{ .Values.keycloak.realm }}
            clientId: {{ .Values.keycloak.clientId }}
            clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
            schedule:
              frequency: { minutes: 2 }
              timeout: { minutes: 1 }
              initialDelay: { seconds: 15 }
      {{- end }}
      # A deleted workspace (or one that changes kind) is no longer in the
      # generator's catalog.yaml: remove its entity instead of keeping it as
      # an orphan.
      orphanStrategy: delete
    # The only two cluster calls the templates make, with the rhdh-portal
    # service account's token: create a request Secret, and start one of
    # the two portal pipelines. Admission policies (portal namespace) pin
    # both to their expected shape.
    proxy:
      endpoints:
        /saw-requests:
          target: https://kubernetes.default.svc/api/v1/namespaces/{{ .Values.portal.namespace }}/secrets
          changeOrigin: true
          secure: false
          credentials: require
          allowedMethods: ['POST']
          allowedHeaders: ['Content-Type']
          headers:
            Authorization: Bearer ${token}
        /saw-pipelineruns:
          target: https://kubernetes.default.svc/apis/tekton.dev/v1/namespaces/{{ .Values.portal.namespace }}/pipelineruns
          changeOrigin: true
          secure: false
          credentials: require
          allowedMethods: ['POST']
          allowedHeaders: ['Content-Type']
          headers:
            Authorization: Bearer ${token}
        # Progress for the create template's run page (GET only). The
        # template sends the user's Backstage token in X-Saw-Token; the
        # generator answers only about that user's run and workspace.
        /saw-status:
          target: http://{{ $gen }}/status
          changeOrigin: true
          credentials: require
          allowedMethods: ['GET']
          allowedHeaders: ['X-Saw-Token']
    {{- if .Values.rhdh.tekton.enabled }}
    # The Tekton tab: each workspace entity names its pipeline runs by
    # label (backstage.io/kubernetes-id) in the portal namespace
    # (backstage.io/kubernetes-namespace). Pods only, plus the runs.
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: local
              url: https://kubernetes.default.svc
              authProvider: serviceAccount
              skipTLSVerify: true
              skipMetricsLookup: true
              serviceAccountToken:
                $file: /opt/app-root/src/saw/token
      objectTypes: [pods]
      customResources:
        - group: tekton.dev
          apiVersion: v1
          plural: pipelineruns
        - group: tekton.dev
          apiVersion: v1
          plural: taskruns
    {{- end }}
    {{- if .Values.rhdh.rbac.enabled }}
    permission:
      enabled: true
      rbac:
        admin:
          users:
            {{- range .Values.rhdh.rbac.admins }}
            - name: user:default/{{ . }}
            {{- end }}
        policies-csv-file: /opt/app-root/src/saw/rbac-policy.csv
        conditionalPoliciesFile: /opt/app-root/src/saw/rbac-conditional-policies.yaml
        policyFileReload: true
    {{- end }}
