{{- $observer := (.Values.site | default dict).observer | default dict }}
{{- $portal := $observer.namespace | default .Values.portalNamespace | default "saw-portal" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: saw-portal-runtime-observer, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [saw-bom-profiles, saw-runtime-intent, saw-runtime-status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: saw-portal-runtime-observer, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: saw-portal-runtime-observer}
subjects:
  - {kind: ServiceAccount, name: {{ $observer.serviceAccount | default "saw-workspaces-generator" }}, namespace: {{ $portal }}}
  {{- if not $observer.serviceAccount }}
  - {kind: ServiceAccount, name: {{ .Values.provisionerServiceAccount | default "saw-portal-provisioner" }}, namespace: {{ $portal }}}
{{- end }}
