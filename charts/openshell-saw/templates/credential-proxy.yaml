{{- $image := .Values.credentialProxy.image | default "" -}}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) -}}
{{- fail "credentialProxy.image must be a published repo@sha256:<digest> image; set defaults.openshellSaw.credentialProxy.image in overrides/saw-users.yaml for GitOps, or CREDENTIAL_PROXY_IMAGE for quickstart" -}}
{{- end -}}
{{- $name := printf "%s-credential-proxy" (include "openshell-sandbox.fullname" .) -}}
{{- $profiles := dict -}}
{{- $refresh := dict -}}
{{- range $path, $_ := .Files.Glob "files/provider-profiles/*.yaml" -}}
  {{- $profile := $.Files.Get $path | fromYaml -}}
  {{- range $credential := $profile.credentials | default list -}}
    {{- $spec := $credential.refresh | default dict -}}
    {{- if eq ($spec.strategy | default "") "oauth2_refresh_token" -}}
      {{- $url := urlParse $spec.token_url -}}
      {{- if or (ne $url.scheme "https") $url.userinfo $url.query $url.fragment (contains "?" $spec.token_url) (contains "#" $spec.token_url) (not (regexMatch "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:443)?$" $url.host)) -}}
        {{- fail (printf "provider %s refresh token_url must be HTTPS on port 443 without userinfo, query or fragment" $profile.id) -}}
      {{- end -}}
      {{- $host := trimSuffix ":443" $url.host -}}
      {{- if not (has $host ($.Values.egress.allow | default list)) -}}
        {{- fail (printf "provider %s refresh token_url host must be in egress.allow" $profile.id) -}}
      {{- end -}}
      {{- $keys := list -}}
      {{- range $spec.material -}}{{- $keys = append $keys .name -}}{{- end -}}
      {{- range list "client_id" "client_secret" "refresh_token" -}}
        {{- if not (has . $keys) -}}{{- fail "OAuth refresh requires client_id, client_secret and refresh_token material" -}}{{- end -}}
      {{- end -}}
      {{- $_ := set $refresh $profile.id (dict "credential" $credential.name "spec" (dict "strategy" $spec.strategy "tokenURL" $spec.token_url "refreshBeforeSeconds" $spec.refresh_before_seconds "maxLifetimeSeconds" $spec.max_lifetime_seconds "material" (dict "clientID" "client_id" "clientSecret" "client_secret" "refreshToken" "refresh_token"))) -}}
    {{- end -}}
  {{- end -}}
  {{- if $profile.credentials -}}
    {{- $hosts := list -}}
    {{- range $profile.endpoints -}}
      {{- if and .host (not (has .host $hosts)) -}}{{- $hosts = append $hosts .host -}}{{- end -}}
    {{- end -}}
    {{- $_ := set $profiles $profile.id $hosts -}}
  {{- end -}}
{{- end -}}
{{- if hasKey $profiles "nvidia" -}}{{- $_ := set $profiles "build" (index $profiles "nvidia") -}}{{- end -}}
{{- $bindings := list -}}
{{- $mounts := dict -}}
{{- $attached := concat (list .Values.inference.secretName) (.Values.additionalProviderSecrets | default list) | compact -}}
{{- range .Values.credentialProxy.secrets -}}
  {{- if has .name $attached -}}
  {{- include "openshell-sandbox.validateSecretName" .name -}}
  {{- if not (regexMatch "^[A-Za-z0-9_.-]+$" (.key | default "")) -}}
    {{- fail (printf "credentialProxy.secrets[%s].key is invalid" .name) -}}
  {{- end -}}
  {{- if not .providers -}}{{- fail (printf "credentialProxy.secrets[%s].providers is required" .name) -}}{{- end -}}
  {{- if and (hasKey . "refresh") (not (kindIs "bool" .refresh)) -}}
    {{- fail "credentialProxy.secrets[].refresh must be a boolean" -}}
  {{- end -}}
  {{- $binding := dict "secret" .name "key" .key "providers" .providers -}}
  {{- if .refresh -}}
    {{- if ne (len .providers) 1 -}}{{- fail "refresh binding requires exactly one provider type" -}}{{- end -}}
    {{- $type := first .providers -}}
    {{- if not (hasKey $refresh $type) -}}{{- fail (printf "provider %s has no OAuth refresh spec" $type) -}}{{- end -}}
    {{- $entry := index $refresh $type -}}
    {{- if ne .key $entry.credential -}}{{- fail "refresh binding key must match the profile credential" -}}{{- end -}}
    {{- $_ := set $binding "refresh" $entry.spec -}}
  {{- end -}}
  {{- $bindings = append $bindings $binding -}}
  {{- $_ := set $mounts .name true -}}
  {{- end -}}
{{- end -}}
{{- $policy := dict "markerPrefix" "saw-cred" "allowHosts" (include "openshell-sandbox.egressHosts" . | fromJsonArray) "profiles" $profiles "bindings" $bindings -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  config.json: |
{{ toPrettyJson $policy | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.credentialProxy.replicas }}
  selector:
    matchLabels:
      openshell.pattern/role: credential-proxy
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
        openshell.pattern/role: credential-proxy
      annotations:
        checksum/config: {{ toJson $policy | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-proxy
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - {name: connect, containerPort: 3128, protocol: TCP}
            - {name: health, containerPort: 8081, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: connect}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/saw-proxy, readOnly: true}
            - {name: ca, mountPath: /var/run/saw/ca, readOnly: true}
            {{- range $secret, $_ := $mounts }}
            - {name: "secret-{{ $secret }}", mountPath: "/var/run/saw/secrets/{{ $secret }}", readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}-config}
        - name: ca
          secret: {secretName: saw-credential-proxy-ca}
        {{- range $secret, $_ := $mounts }}
        - name: "secret-{{ $secret }}"
          secret: {secretName: {{ $secret | quote }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  selector:
    openshell.pattern/role: credential-proxy
  ports:
    - {name: connect, port: 3128, targetPort: connect, protocol: TCP}
    - {name: health, port: 8081, targetPort: health, protocol: TCP}
