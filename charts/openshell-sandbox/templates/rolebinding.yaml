apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-setup
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openshell-sandbox.fullname" . }}-setup
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openshell-sandbox.fullname" . }}-setup
