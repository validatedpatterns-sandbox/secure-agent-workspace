keycloak:
  name: openshell-keycloak
  instances: 1

  hostname: ""

  realm: openshell
  registrationAllowed: true

  clients:
    cli:
      clientId: openshell-cli
      public: true
      accessTokenLifespan: 900

  testUsers:
    - username: developer
      firstName: Developer
      lastName: User
      password: developer
      roles:
        - openshell-user
    - username: admin
      firstName: Admin
      lastName: User
      password: admin
      roles:
        - openshell-user
        - openshell-admin
    - username: alice
      firstName: Alice
      lastName: User
      password: alice
      roles:
        - openshell-user
        - openshell-admin
    - username: bob
      firstName: Bob
      lastName: User
      password: bob
      roles:
        - openshell-user
        - openshell-admin

  roles:
    - openshell-user
    - openshell-admin
