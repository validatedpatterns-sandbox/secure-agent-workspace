{{- $secretName := printf "%s-admin" (include "openshell-keycloak.fullname" .) -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "openshell-keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN: {{ .Values.keycloak.adminUser | quote }}
  {{- if .Values.keycloak.adminPassword }}
  KEYCLOAK_ADMIN_PASSWORD: {{ .Values.keycloak.adminPassword | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "KEYCLOAK_ADMIN_PASSWORD") }}
  KEYCLOAK_ADMIN_PASSWORD: {{ index $existingSecret.data "KEYCLOAK_ADMIN_PASSWORD" | b64dec | quote }}
  {{- else }}
  KEYCLOAK_ADMIN_PASSWORD: {{ randAlphaNum 24 | quote }}
  {{- end }}
