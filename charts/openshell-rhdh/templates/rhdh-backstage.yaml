{{- /* Red Hat Developer Hub, configured for the agent workspace portal. */ -}}
apiVersion: {{ include "openshell-rhdh.backstageApiVersion" . }}
kind: Backstage
metadata:
  name: {{ .Values.rhdh.name }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
spec:
  application:
    appConfig:
      configMaps:
        - name: saw-rhdh-app-config
    dynamicPluginsConfigMapName: saw-rhdh-dynamic-plugins
    extraEnvs:
      envs:
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        {{- if .Values.tls.insecureSkipVerify }}
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        {{- else }}
        # Node keeps its own CAs and adds these: the cluster's and the
        # router's (Keycloak), the Kubernetes API's (the proxy endpoints).
        - name: NODE_EXTRA_CA_CERTS
          value: /opt/saw-ca/ca-bundle.crt
        {{- end }}
      secrets:
        # AUTH_OIDC_CLIENT_SECRET, SESSION_SECRET (from Vault)
        - name: rhdh-oidc
        # `token`: the rhdh-portal service account's token for the proxy
        # endpoints (see saw-rhdh-app-config).
        - name: rhdh-portal-token
          key: token
    extraFiles:
      mountPath: /opt/app-root/src/saw
      configMaps:
        - name: saw-rhdh-templates
        {{- if .Values.rhdh.rbac.enabled }}
        - name: saw-rhdh-rbac
        {{- end }}
      {{- if .Values.rhdh.tekton.enabled }}
      secrets:
        # `token` of rhdh-kubernetes-reader, read by the Kubernetes plugin
        # ($file in saw-rhdh-app-config).
        - name: rhdh-kubernetes-reader-token
          key: token
      {{- end }}
    route:
      enabled: true
      {{- if .Values.rhdh.host }}
      host: {{ .Values.rhdh.host }}
      {{- end }}
  # RHDH mounts individual template files with subPath. A new Pod must load changes.
  deployment:
    patch:
      spec:
        # Cold plugin installation can exceed Kubernetes' default ten-minute rollout deadline.
        progressDeadlineSeconds: 1800
        template:
          metadata:
            annotations:
              saw.redhat.com/portal-templates: {{ include (print $.Template.BasePath "/rhdh-templates.yaml") . | sha256sum | quote }}
              {{- if not .Values.tls.insecureSkipVerify }}
              saw.redhat.com/oidc-startup-check: {{ .Files.Get "files/wait-oidc.py" | sha256sum | quote }}
          spec:
            initContainers:
              {{- include "openshell-rhdh.caInitContainer" . | nindent 14 }}
              # Stock OIDC caches initial discovery, including a startup failure.
              # Wait for the issuer before the backend initializes that provider.
              - name: saw-oidc-discovery
                image: {{ .Values.portal.image }}
                command:
                  - python3
                  - /opt/saw-ca-sources/wait-oidc.py
                  - {{ include "openshell-rhdh.issuer" . | quote }}
                  - /opt/saw-ca/ca-bundle.crt
                volumeMounts:
                  - name: saw-ca
                    mountPath: /opt/saw-ca
                    readOnly: true
                  - name: saw-ca-sources
                    mountPath: /opt/saw-ca-sources
                    readOnly: true
                resources:
                  requests: { cpu: 10m, memory: 32Mi }
                  limits: { memory: 64Mi }
                securityContext:
                  allowPrivilegeEscalation: false
                  runAsNonRoot: true
                  capabilities: { drop: [ALL] }
                  seccompProfile: { type: RuntimeDefault }
            containers:
              - name: backstage-backend
                # Preserve the operator's health endpoint and allow five minutes for backend initialization.
                startupProbe:
                  failureThreshold: 15
                volumeMounts:
                  - name: saw-ca
                    mountPath: /opt/saw-ca
                    readOnly: true
            volumes:
              {{- include "openshell-rhdh.caVolumes" . | nindent 14 }}
  {{- end }}
  database:
    enableLocalDb: true
