name: In-guest installer and chart tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-image-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Credential proxy image pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python scripts/credential-proxy-pin.py check --base-ref "origin/$BASE_REF"
          else
            python scripts/credential-proxy-pin.py check
          fi

  shared-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: credential-proxy/go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt -e ./cli
      - name: Static lint
        run: |
          mkdir -p test-results
          set -o pipefail
          make lint-static 2>&1 | tee test-results/lint.log
      - name: External tool and static asset tests
        run: |
          mkdir -p test-results
          set -o pipefail
          make test-installer PYTHON=python PYTEST_ARGS='-m ci_external -n 2 --dist=load --durations=40 -ra --junitxml=test-results/external.xml' 2>&1 | tee test-results/external.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-shared
          path: test-results/

  test:
    needs: shared-checks
    if: always()
    runs-on: ubuntu-24.04
    # Leave time for pytest to print failures even if a gateway test stalls.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.14 matches the Fedora 44 guest that runs apply_bom.py.
        python: ["3.12", "3.14"]
    steps:
      # Keep the existing matrix check names required by branch rules.
      # A skipped dependency must not produce a successful matrix check.
      - name: Require successful shared checks
        env:
          SHARED_RESULT: ${{ needs.shared-checks.result }}
        run: |
          if [ "$SHARED_RESULT" != success ]; then
            echo "Shared checks did not pass: $SHARED_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version-file: credential-proxy/go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt -e ./cli
      - name: Python behavior and integration tests
        run: |
          mkdir -p test-results
          set -o pipefail
          make test-installer PYTHON=python PYTEST_ARGS='-m "not ci_external" -n 2 --dist=load --durations=40 -ra --junitxml=test-results/python.xml' 2>&1 | tee test-results/python.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-python-${{ matrix.python }}
          path: test-results/

  bundle-drift-check:
    # If a signed installer bundle is committed, it must still verify
    # against a fresh render. Without this, any PR that edits apply_bom.py
    # (or the shipped provider profiles, or the default BOM) without
    # re-running "Sign installer bundle" would silently ship a bundle that
    # fails signing.mode: enforce for every SAW, with no CI signal at all
    # (PR #54 review, 3). Skips cleanly if no bundle is committed yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@v3
      - name: Verify the committed bundle against a fresh render
        run: |
          set -euo pipefail
          bundle=charts/openshell-saw/files/installer/bundle.sigstore.json
          if [[ ! -f "$bundle" ]]; then
            echo "no bundle.sigstore.json committed yet; nothing to check"
            exit 0
          fi
          keys=(charts/openshell-saw/files/installer/*.pub)
          if [[ ! -e "${keys[0]}" ]]; then
            echo "bundle.sigstore.json is committed but no matching *.pub sits next to it" >&2
            exit 1
          fi
          pip install -q pyyaml
          helm template saw-sign charts/openshell-saw --namespace saw-sign -f tests/fixtures/saw-network-topology.yaml -f tests/fixtures/credential-proxy-values.yaml --set sandboxName=saw-sign > /tmp/rendered.yaml
          python3 scripts/build-installer-manifest.py /tmp/rendered.yaml /tmp/installer-manifest.txt
          ok=0
          for key in "${keys[@]}"; do
            if cosign verify-blob --bundle "$bundle" --key "$key" --offline /tmp/installer-manifest.txt; then
              ok=1
              break
            fi
          done
          if [[ "$ok" -ne 1 ]]; then
            echo "committed bundle.sigstore.json no longer verifies against a fresh render." >&2
            echo "Re-run the 'Sign installer bundle' workflow and commit the new bundle." >&2
            exit 1
          fi
          echo "bundle.sigstore.json matches a fresh render"
