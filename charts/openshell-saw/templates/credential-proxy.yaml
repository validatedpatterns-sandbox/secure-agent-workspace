{{- if include "openshell-sandbox.credentialProxyEnabled" . }}
{{- $image := .Values.credentialProxy.image | default "" -}}
{{- if not (regexMatch "^.+@sha256:[0-9a-f]{64}$" $image) -}}
{{- fail "credentialProxy.image must be a repo@sha256:<digest> image; the chart default is the published multi-arch image, and an override (defaults.openshellSaw.credentialProxy.image, CREDENTIAL_PROXY_IMAGE) must also be digest-pinned." -}}
{{- end -}}
{{- $name := printf "%s-credential-proxy" (include "openshell-sandbox.fullname" .) -}}
{{- $catalog := dict -}}
{{- range $path, $_ := .Files.Glob "files/provider-profiles/*.yaml" -}}
{{- $_ := set $catalog $path ($.Files.Get $path | fromYaml) -}}
{{- end -}}
{{- $attached := concat (list .Values.inference.secretName) (.Values.additionalProviderSecrets | default list) | compact -}}
{{- $policy := include "saw.governedProxyPolicy" (dict "catalog" $catalog "attached" $attached "bindings" .Values.credentialProxy.secrets "allowHosts" (include "openshell-sandbox.egressHosts" . | fromJsonArray)) | fromJson -}}
{{- $mounts := dict -}}{{- range $policy.bindings -}}{{- $_ := set $mounts .secret true -}}{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  config.json: |
{{ toPrettyJson $policy | indent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.credentialProxy.replicas }}
  selector:
    matchLabels:
      openshell.pattern/role: credential-proxy
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
        openshell.pattern/role: credential-proxy
      annotations:
        checksum/config: {{ toJson $policy | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-proxy
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args: [serve]
          ports:
            - {name: connect, containerPort: 3128, protocol: TCP}
            - {name: health, containerPort: 8081, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: connect}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/saw-proxy, readOnly: true}
            - {name: ca, mountPath: /var/run/saw/ca, readOnly: true}
            {{- range $secret, $_ := $mounts }}
            - {name: "secret-{{ $secret }}", mountPath: "/var/run/saw/secrets/{{ $secret }}", readOnly: true}
            {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $name }}-config}
        - name: ca
          secret: {secretName: saw-credential-proxy-ca}
        {{- range $secret, $_ := $mounts }}
        - name: "secret-{{ $secret }}"
          secret: {secretName: {{ $secret | quote }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  selector:
    openshell.pattern/role: credential-proxy
  ports:
    - {name: connect, port: 3128, targetPort: connect, protocol: TCP}
    - {name: health, port: 8081, targetPort: health, protocol: TCP}

{{- end }}
