name: Publish SAW installer release

on:
  push:
    tags: ["saw-installer-*"]
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name; must match metadata.name in the selected BOM"
        required: true
        type: string
      bom:
        description: "InstallerBOM path"
        required: true
        default: examples/saw/installer-bom.yaml
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: saw-golden-image
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install bundle dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Select and validate release BOM
        id: release
        env:
          INPUT_RELEASE: ${{ inputs.release_name }}
          INPUT_BOM: ${{ inputs.bom }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bom="${INPUT_BOM:-examples/saw/installer-bom.yaml}"
          tag_release="${GITHUB_REF_NAME#saw-installer-}"
          release="${INPUT_RELEASE:-$tag_release}"
          test -f "$bom"
          bom_name="$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["metadata"]["name"])' "$bom")"
          test "$bom_name" = "$release" || {
            echo "BOM metadata.name ($bom_name) must match release name ($release)." >&2
            exit 1
          }
          echo "bom=$bom" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Build signed OCI release bundle
        env:
          BOM: ${{ steps.release.outputs.bom }}
          RELEASE: ${{ steps.release.outputs.release }}
          SIGNING_KEY: ${{ secrets.SAW_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY" || {
            echo 'Set the SAW_RELEASE_SIGNING_KEY environment secret to the release signing key.' >&2
            exit 1
          }
          umask 077
          key_file="$RUNNER_TEMP/saw-release-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key_file"
          python tools/saw/build_release_bundle.py \
            --installer-bom "$BOM" \
            --name "$RELEASE" \
            --signing-key "$key_file" \
            --output "$RUNNER_TEMP/saw-release-context"

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable OCI release image
        id: publish
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/saw-installer"
          docker buildx build \
            --file "$RUNNER_TEMP/saw-release-context/Dockerfile" \
            --tag "$image:$RELEASE" \
            --push \
            --provenance=false \
            --metadata-file "$RUNNER_TEMP/release-image-metadata.json" \
            "$RUNNER_TEMP/saw-release-context"
          digest="$(python - "$RUNNER_TEMP/release-image-metadata.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1]))['containerimage.digest'])
          PY
          )"
          ref="$image@$digest"
          printf 'bundleRef=%s\nbundleDigest=%s\nrelease=%s\n' "$ref" "$digest" "$RELEASE" \
            | tee "$RUNNER_TEMP/saw-installer-release.txt"
          {
            echo "### SAW installer release"
            echo '```yaml'
            cat "$RUNNER_TEMP/saw-installer-release.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: saw-installer-${{ steps.release.outputs.release }}
          path: |
            ${{ runner.temp }}/saw-installer-release.txt
            ${{ runner.temp }}/saw-release-context/build-inputs.json
