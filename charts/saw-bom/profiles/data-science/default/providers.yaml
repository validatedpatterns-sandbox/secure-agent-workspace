apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
    - name: nvidia
      type: nvidia
      credentialSecret: inference
      credentialSecretKey: api_key
    - name: brave
      type: brave
      credentialSecret: web-search
      credentialSecretKey: api_key
    # Optional APIs: enable and add their names to notebook.providers.
    - name: openai
      type: openai
      enabled: false
      model: gpt-4o
      credentialSecret: inference-openai
      credentialSecretKey: api_key
      modelSecretKey: model
    - name: anthropic
      type: anthropic
      enabled: false
      model: claude-sonnet-4-6
      credentialSecret: inference-anthropic
      credentialSecretKey: api_key
      modelSecretKey: model
