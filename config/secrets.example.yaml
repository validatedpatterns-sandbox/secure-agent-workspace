# Copy this template to config/users/<username>/secret.yaml.
# This file is local-only, must never be committed, and should be chmod 600.
# Fill the complete provider configuration, then push it to Vault.
providers:
  nvidia:
    type: nvidia
    api_key: REPLACE_ME
    model: nvidia/nemotron-3-super-120b-a12b
    endpoint: https://integrate.api.nvidia.com/v1
  brave:
    type: brave
    api_key: REPLACE_ME
    endpoint: https://api.brave.com/v1

  # Example custom provider:
