{{- if .Values.route.webui }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-webui
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
    {{- if .Values.dashboard.enabled }}
    # A web UI route: https://<host>/oauth2/callback goes on the dashboard's
    # Keycloak client (the redirect registrar in charts/openshell-keycloak,
    # or make keycloak-register).
    saw.redhat.com/oidc-redirect: "true"
    {{- end }}
spec:
  {{- with include "openshell-sandbox.auxRouteHost" (list . "webui" .Values.route.webuiHost) }}
  host: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "openshell-sandbox.fullname" . }}-gateway
    weight: 100
  port:
    targetPort: webui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
