{{- /*
The cluster's ingress CA, for a workspace VM to trust the in-cluster Keycloak
when the cluster's *.apps certificate is not from a public CA. The
saw-ingress-ca imperative job copies it from openshift-config-managed
default-ingress-cert (public data) into Vault, so no workspace needs RBAC on
openshift-config-managed. openshell-saw oidc.clusterCaSecret names this Secret.
*/ -}}
{{- with .Values.clusterCaSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.secretStoreRef.name }}
    kind: {{ $.Values.secretStoreRef.kind }}
  target:
    name: {{ . }}
  data:
    - secretKey: ca-bundle.crt
      remoteRef:
        key: {{ $.Values.sshVaultPrefix | default $.Values.vaultPrefix }}/cluster-ingress-ca
        property: ca-bundle.crt
{{- end }}
