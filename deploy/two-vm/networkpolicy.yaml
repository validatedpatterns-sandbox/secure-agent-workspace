apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-agent-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: saw-agent
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: saw-integrations
      ports:
        - port: 18080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-integrations-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: saw-integrations
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: saw-agent
      ports:
        - port: 18080
          protocol: TCP
