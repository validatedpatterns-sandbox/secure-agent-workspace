apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ (split ":" .Values.output.imageStreamTag)._0 }}
  labels:
    {{- include "codex-openshell-image.labels" . | nindent 4 }}
spec:
  source:
    type: Dockerfile
    dockerfile: |
      FROM {{ .Values.build.toolsImage }} AS tools
      RUN microdnf install -y --setopt=install_weak_deps=0 \
              python3 iproute nftables util-linux \
          && microdnf clean all

      FROM {{ .Values.build.baseImage }}
      USER 0
      COPY --from=tools /usr/bin/curl /usr/bin/curl
      COPY --from=tools /usr/bin/python3 /usr/bin/python3
      COPY --from=tools /usr/bin/nsenter /usr/bin/nsenter
      COPY --from=tools /usr/sbin/ip /usr/sbin/ip
      COPY --from=tools /usr/sbin/nft /usr/sbin/nft
      COPY --from=tools /usr/lib64/libpython3.9.so* /usr/lib64/
      COPY --from=tools /usr/lib64/python3.9/ /usr/lib64/python3.9/
      COPY --from=tools /usr/lib64/libcurl.so* /usr/lib64/
      RUN printf '#!/bin/sh\nwhile [ $# -gt 0 ]; do\n  case "$1" in\n    --) shift; break ;;\n    --bind|--ro-bind|--dev-bind|--tmpfs|--proc|--dev|--dir|--symlink|--remount-ro|--setenv|--chdir) shift 2 ;;\n    --file|--lock-file) shift 2 ;;\n    -*) shift ;;\n    *) break ;;\n  esac\ndone\nexec "$@"\n' > /usr/local/bin/bwrap && chmod +x /usr/local/bin/bwrap
      USER 1001
  strategy:
    type: Docker
    dockerStrategy:
      forcePull: true
  output:
    to:
      kind: ImageStreamTag
      name: {{ .Values.output.imageStreamTag }}
  resources:
    limits:
      memory: 2Gi
  triggers: []
