# Required — must be set at install time. Maximum 19 characters (OpenShell limit).
sandboxName: ""
# SSH public key for VM access. Set explicitly, or leave empty to read
# from the 'public_key' field in the sshSecret (created by ESO/pattern-secrets).
sshPublicKey: ""

# VM disk source — three modes:
#
# 1. DataSource (default): clone from a golden image DataSource (created by the
#    openshell-gateway-image chart or CDI DataImportCron).
#      source:
#        dataSource: openshell-gateway
#        dataSourceNamespace: openshell-agents
#
# 2. Registry: import a bootc/containerDisk image directly from a container registry.
#      source:
#        registryURL: "docker://quay.io/rh-ai-quickstart/openshell-gateway:latest"
#
# 3. HTTP: download a qcow2 disk image from a URL.
#      source:
#        httpURL: "https://example.com/openshell-gateway.qcow2"
#
# VM disk source — clone from a golden image DataSource.
# The golden image is built on the cluster via make build-gateway-image
# and imported by the openshell-gateway-image helm chart.
source:
  # Leave empty to auto-select from containerRuntime (openshell-gateway-docker for docker,
  # openshell-gateway for podman). Set explicitly to override.
  dataSource: ""
  dataSourceNamespace: "openshell-agents"
  # Registry URL for golden image import. Used by the setup Job to bootstrap
  # the DataSource on first run. Defaults to the internal registry.
  goldenImageURL: ""
  # CDI pull method: "node" (uses node runtime, trusts internal CA) or "pod" (CDI importer pod)
  pullMethod: "node"
  registryURL: ""
  httpURL: ""

vm:
  cores: 4
  memory: 8Gi
  diskSize: 40Gi
  # GPU passthrough (KubeVirt hostDevices) into the gateway VM. Requires:
  #   1. Bare-metal (or nested-virt/IOMMU-capable) nodes — does NOT work on standard cloud VM
  #      instance types (e.g. AWS non-.metal EC2), which don't expose an IOMMU to the guest.
  #   2. The NVIDIA GPU Operator's vfio-manager binding vfio-pci to the GPU on a node labeled
  #      nvidia.com/gpu.workload.config=vm-passthrough (mutually exclusive with that node's
  #      container-mode GPU use).
  #   3. A matching `permittedHostDevices` entry on the cluster's HyperConverged CR — see
  #      charts/openshift-cnv/values.yaml.
  # Off by default. See docs/gpu-passthrough.md for the full runbook and verified hardware
  # requirements (including a live confirmation of what does NOT work).
  gpu:
    enabled: false
    count: 1
    # Must match the `resourceName` configured in the cluster's HyperConverged
    # permittedHostDevices.pciHostDevices entry for this GPU model.
    deviceName: "nvidia.com/GA102GL_A10G"

# Sandbox container image. When empty, auto-detects from the internal registry.
sandboxImage: ""

# NemoClaw CLI container image. Used to install the nemoclaw CLI on the gateway VM.
nemoclawCliImage: ""

# Agent to run inside the sandbox: openclaw, hermes, or langchain-deepagents-code
agent: openclaw

# Onboarding CLI: openclaw (runs inside sandbox) or nemoclaw (runs on gateway VM, requires Docker)
onboardCli: openclaw

# Container runtime inside the gateway VM: docker or podman
# docker: uses openshell-gateway-docker golden image. Required for NemoClaw onboarding.
# podman: uses openshell-gateway golden image. For openclaw, opencode, or any external sandbox image.
containerRuntime: docker

# OpenShell gateway runtime configuration inside the sandbox VM.
openshell:
  # Bind address for `openshell-gateway` listener.
  # Keep default 0.0.0.0 for remote CLI access via route; set to 127.0.0.1
  # to restrict access to local VM context only.
  bindAddress: "0.0.0.0"
  # OpenShell binaries installed at provisioning time (not baked into golden image).
  gatewayImage: "quay.io/opendatahub/odh-openshell-gateway:v0.0.103-rhaiv.0"
  supervisorImage: "quay.io/opendatahub/odh-openshell-supervisor:v0.0.103-rhaiv.0"
  version: "0.0.103+rhaiv.0"
  pipIndexUrl: "https://packages.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cpu-ubi9-test/simple/"

  # gatewayImage: "ghcr.io/nvidia/openshell/gateway:0.0.103"
  # supervisorImage: "ghcr.io/nvidia/openshell/supervisor:0.0.103"
  # version: "0.0.103"
  # pipIndexUrl: ""
# Inference provider configuration.
# Provider keys: gemini, brave, tavily (governed profiles required for each)
inference:
  provider: ""
  model: ""
  apiKey: ""
  endpointUrl: ""
  webSearch: ""
  # Name of a k8s Secret containing provider, model, and api_key fields.
  # Defaults to "inference" (created by ESO from Vault via values-secret.yaml).
  # The Job reads provider/model/api_key from this secret automatically.
  secretName: "inference"

# Additional per-provider credential secrets to mount for the BOM path
# (charts/saw-bom), beyond the primary `inference` secret above. Each name
# here must exactly match a `credentialSecret:` value declared in a BOM
# profile's providers.yaml — the Job mounts each one dynamically at
# /ws-secrets/<name>, the same mechanism already used for the inference
# secret, so a BOM profile's declared secret name is what actually controls
# resolution (previously this was a single secret hardcoded to the literal
# name "web-search", ignoring whatever a profile actually declared).
additionalProviderSecrets:
  - web-search

# Vertex AI via GCP service account (legacy — optional).
# When set, the Vertex provider is configured via openshell provider commands
# before nemoclaw onboard runs.
vertexSaJson: ""
vertex:
  region: global
  model: claude-sonnet-4-6

# SSH identity Secret for virtctl — must exist in the namespace.
# The Secret should have a 'key' data field with the private key.
sshSecret: openshell-aap-ssh
sshUser: cloud-user

# Fallback virtctl version if auto-detection from the cluster fails.
virtctlVersion: "v1.4.1"

job:
  image: "registry.fedoraproject.org/fedora:44"
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  # Wait for ESO-managed secrets before starting the setup Job.
  # Set to true when using Validated Pattern / External Secrets Operator.
  # Leave false for manual/quickstart path where secrets are created directly.
  waitForSecrets: false

# Expose the sandbox gateway and dashboard via OpenShift Routes.
route:
  enabled: true
  host: ""
  dashboard: true
  # OpenShell Dashboard web UI (see `dashboard` below). Distinct from `dashboard`
  # above, which is the OpenClaw in-sandbox web UI on port 18789.
  webui: true

# OpenShell Dashboard — standalone Go BFF + React admin UI for OpenShell
# (gateways, workspaces, sandboxes, providers). Runs via docker inside the
# sandbox VM (this branch has no podman — see docs/jira/switch-podman-to-docker.md),
# fronted by oauth2-proxy for OIDC/PKCE auth against the
# centralized Keycloak. Requires oidc.issuerUrl/oidc.token to be set — the
# dashboard's gRPC client has no mTLS support, so it only works against an
# OIDC-configured gateway.
dashboard:
  enabled: true
  image: "quay.io/gkrumbach07/openshell-dashboard:latest"
  proxyImage: "quay.io/oauth2-proxy/oauth2-proxy:v7.9.0"
  clientId: "openshell-dashboard"
  # Keycloak only supports a *trailing* wildcard in redirect URIs, which can't
  # express "any hostname, fixed path" — needed since each sandbox VM gets a
  # unique per-VM Route hostname. The setup Job registers this sandbox's exact
  # redirect URI onto the shared client via the Keycloak Admin API instead
  # (confirmed live: Keycloak rejects "https://*/oauth2/callback" outright).
  # Namespace where Keycloak (and its "<keycloakName>-initial-admin" secret)
  # is deployed. Empty = same namespace as this sandbox (the VP-path default,
  # where openshell-keycloak and openshell-saw are co-located).
  keycloakNamespace: ""
  # Skip TLS verification for the OIDC issuer in oauth2-proxy.
  # Only enable for dev/lab clusters with self-signed Keycloak certs.
  insecureSkipIssuerTlsVerify: false

# Governance interceptor — enforces signed sandbox policies.
# Deployed as a Kubernetes pod, accessed from VM over the pod network.
governance:
  enabled: true
  # gRPC endpoint reachable from the gateway VM. Leave empty to derive
  # from the release namespace (http://governance-interceptor.<namespace>.svc.cluster.local:18081).
  endpoint: ""
  port: 18081
  failurePolicy: "fail_closed"
  timeout: "500ms"

# OIDC authentication.
# issuerUrl can be set explicitly, or computed from global.clusterDomain
# when deployed via the validated pattern.
oidc:
  token: ""
  issuerUrl: ""
  clientId: "openshell-cli"
  passthrough: true
  keycloakName: "openshell-keycloak"
  realm: "openshell"

# Sandbox owner (used for labeling and audit).
accessControl:
  owner: ""

# Namespace strategy: "shared" places all sandboxes in the release namespace;
# "perUser" expects a per-user namespace (e.g. saw-<username>).
namespaceMode: shared
