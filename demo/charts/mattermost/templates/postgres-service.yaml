apiVersion: v1
kind: Service
metadata:
  name: mattermost-postgres
  labels:
    app.kubernetes.io/name: mattermost-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgresPort }}
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: mattermost-postgres
