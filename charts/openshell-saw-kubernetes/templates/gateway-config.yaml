{{/* Configuration fields verified against stock ODH OpenShell 305c8b3. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-gateway-config
  labels:
    {{- include "saw-kubernetes.labels" . | nindent 4 }}
data:
  gateway.toml: |
    [openshell]
    version = 2
    [openshell.gateway]
    name = {{ .Release.Name | quote }}
    bind_address = "0.0.0.0:17670"
    health_bind_address = "0.0.0.0:8081"
    compute_driver = "kubernetes"
    policy_validation_failure_mode = "fail_closed"
    enable_loopback_service_http = false
    enable_websocket_tunnel = true
    provider_profile_sources = [{ type = "interceptor", name = "governance" }]
    [openshell.gateway.auth]
    allow_unauthenticated_users = false
    [openshell.gateway.mtls_auth]
    enabled = true
    [openshell.gateway.tls]
    cert_path = "/etc/openshell-tls/server/tls.crt"
    key_path = "/etc/openshell-tls/server/tls.key"
    client_ca_path = "/etc/openshell-tls/client-ca/ca.crt"
    [openshell.gateway.gateway_jwt]
    signing_key_path = "/etc/openshell-jwt/signing.pem"
    public_key_path = "/etc/openshell-jwt/public.pem"
    kid_path = "/etc/openshell-jwt/kid"
    gateway_id = {{ .Release.Name | quote }}
    ttl_secs = 3600
    [openshell.gateway.credential_storage]
    key_encryption_key_env = "OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY"
    [openshell.gateway.oidc]
    issuer = {{ .Values.oidc.issuerUrl | quote }}
    audience = {{ .Values.oidc.clientId | quote }}
    roles_claim = {{ .Values.oidc.rolesClaim | quote }}
    admin_role = {{ .Values.oidc.adminRole | quote }}
    user_role = {{ .Values.oidc.userRole | quote }}
    dangerously_allow_insecure_http = false
    [openshell.drivers.kubernetes]
    namespace = {{ .Release.Namespace | quote }}
    gateway_id = {{ .Release.Name | quote }}
    workspace_mode = "shared"
    service_account_name = {{ printf "%s-sandbox" .Release.Name | quote }}
    grpc_endpoint = {{ printf "https://%s-gateway.%s.svc:17670" .Release.Name .Release.Namespace | quote }}
    default_image = {{ .Values.kubernetes.workload.image | quote }}
    supervisor_image = {{ .Values.kubernetes.supervisor.image | quote }}
    sandbox_runtime_image = {{ .Values.kubernetes.workload.runtimeImage | quote }}
    # Driver projects only ca.crt: supervisors must trust the SERVER root.
    client_tls_secret_name = {{ .Values.kubernetes.identity.serverTlsSecret | quote }}
    default_runtime_class_name = {{ .Values.kubernetes.workload.runtimeClassName | quote }}
    workspace_storage_class = {{ .Values.kubernetes.storage.className | quote }}
    workspace_default_storage_size = {{ .Values.kubernetes.storage.workspaceSize | quote }}
    allow_driver_config = true
    sa_token_ttl_secs = 3600
    image_pull_policy = "IfNotPresent"
    supervisor_image_pull_policy = "IfNotPresent"
    sandbox_runtime_image_pull_policy = "IfNotPresent"
    image_pull_secrets = {{ .Values.kubernetes.imagePullSecrets | toJson }}
    https_proxy = {{ .Values.kubernetes.proxy.url | quote }}
    # Stock SAW proxy accepts DNS:443 CONNECT targets, never literal IPs.
    proxy_connect_by_hostname = true
    proxy_ca_bundle = "/etc/openshell-tls/proxy-ca/ca.crt"
    [openshell.drivers.kubernetes.resource_admission]
    enabled = true
    [openshell.drivers.kubernetes.resource_admission.required_labels]
    "openshell.ai/sandbox-attachable" = "true"
    "openshell.ai/sandbox-attachable-workspace" = "${workspace}"
    [openshell.drivers.kubernetes.sandbox_runtime]
    boundary_port = 5500
    [[openshell.gateway.interceptors]]
    name = "governance"
    grpc_endpoint = {{ .Values.kubernetes.governance.endpoint | quote }}
    failure_policy = "fail_closed"
    binding_policy = "allowlist"
    timeout = "500ms"
    allow_insecure_transport = {{ hasPrefix "http://" .Values.kubernetes.governance.endpoint }}
    {{- range $rpc, $phases := dict "CreateSandbox" (list "modify_operation" "validate") "CreateProvider" (list "validate") "UpdateConfig" (list "validate") "SubmitPolicyAnalysis" (list "validate") "ImportProviderProfiles" (list "validate") "UpdateProviderProfiles" (list "validate") "DeleteProviderProfile" (list "validate") }}
    [[openshell.gateway.interceptors.bindings]]
    rpc = {{ printf "openshell.v1.OpenShell/%s" $rpc | quote }}
    phases = {{ $phases | toJson }}
    {{- end }}
