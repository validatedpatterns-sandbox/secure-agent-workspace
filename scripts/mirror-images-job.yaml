apiVersion: batch/v1
kind: Job
metadata:
  name: mirror-${IMAGE}
spec:
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: image-mirror
      restartPolicy: Never
      containers:
      - name: mirror
        image: registry.redhat.io/ubi8/skopeo:latest
        env:
        - name: HOME
          value: /tmp/skopeo-home
        - name: XDG_RUNTIME_DIR
          value: /tmp/xdg-runtime
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          mkdir -p "${HOME}" "${XDG_RUNTIME_DIR}"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          # quay tags have been published as X.Y.Z, vX.Y.Z or only latest:
          # use the first that exists and store it as the requested version.
          WANTED="${VERSION}"
          SRC=""
          INSPECT_LOG="$(mktemp)"
          trap 'rm -f "${INSPECT_LOG}"' EXIT
          for TAG in "${WANTED}" "v${WANTED#v}" latest; do
            if skopeo inspect --raw "docker://${QUAY_REPO}/${IMAGE}:${TAG}" > /dev/null 2>"${INSPECT_LOG}"; then
              SRC="${TAG}"; break
            fi
            if ! grep -Eiq 'manifest unknown|not found|name unknown' "${INSPECT_LOG}"; then
              echo "ERROR: cannot inspect ${QUAY_REPO}/${IMAGE}:${TAG}; check registry access" >&2
              exit 1
            fi
            echo "no tag ${TAG} on ${QUAY_REPO}/${IMAGE}"
          done
          if [ -z "${SRC}" ]; then echo "ERROR: none of the tags exist"; exit 1; fi
          echo "Copying ${QUAY_REPO}/${IMAGE}:${SRC}"
          skopeo copy --src-tls-verify=true --dest-tls-verify=false \
            --dest-creds="unused:${TOKEN}" \
            "docker://${QUAY_REPO}/${IMAGE}:${SRC}" \
            "docker://image-registry.openshift-image-registry.svc:5000/${BUILD_NS}/${IMAGE}:${WANTED}"
          echo "Mirror complete: ${IMAGE}:${SRC} -> ${IMAGE}:${WANTED}"
