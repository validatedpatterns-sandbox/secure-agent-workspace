apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-k8s.fullname" . }}-gateway-config
  labels:
    {{- include "openshell-k8s.labels" . | nindent 4 }}
data:
  gateway.toml: |
    [openshell]
    version = 1

    [openshell.gateway]
    name                  = {{ include "openshell-k8s.fullname" . | quote }}
    bind_address          = "0.0.0.0:8080"
    health_bind_address   = "0.0.0.0:8081"
    metrics_bind_address  = "0.0.0.0:9090"
    log_level             = "info"
    sandbox_namespace     = {{ .Release.Namespace | quote }}
    default_image         = {{ .Values.sandboxImage | quote }}
    supervisor_image      = "{{ .Values.supervisor.image.repository }}:{{ .Values.supervisor.image.tag }}"
    compute_drivers       = ["kubernetes"]
    policy_validation_failure_mode = "fail_closed"
    enable_loopback_service_http = true
    provider_profile_sources = [
      { type = "interceptor", name = "governance" },
    ]

    # Per-session K8s gateway: no TLS, no OIDC.
    # Security model: NetworkPolicy isolates the namespace, external users
    # connect via codex Route (TLS edge) + app-server JWT auth.
    # Intra-cluster traffic is already protected by the CNI.
    disable_tls = true

    [openshell.gateway.auth]
    allow_unauthenticated_users = true

    [openshell.gateway.gateway_jwt]
    signing_key_path = "/etc/openshell-jwt/signing.pem"
    public_key_path  = "/etc/openshell-jwt/public.pem"
    kid_path         = "/etc/openshell-jwt/kid"
    gateway_id       = {{ include "openshell-k8s.fullname" . | quote }}
    ttl_secs         = 3600

    [openshell.drivers.kubernetes]
    workspace_mode               = "shared"
    gateway_id                   = {{ include "openshell-k8s.fullname" . | quote }}
    grpc_endpoint                = "http://{{ include "openshell-k8s.fullname" . }}-gateway.{{ .Release.Namespace }}.svc:8080"
    service_account_name         = {{ include "openshell-k8s.sandboxSA" . | quote }}
    supervisor_sideload_method   = "init-container"
    topology                     = "combined"
    sa_token_ttl_secs            = 3600

    [openshell.drivers.kubernetes.managed_ssh_ingress]
    enabled                       = true
    gateway_namespace             = {{ .Release.Namespace | quote }}
    gateway_pod_selector          = { "app.kubernetes.io/name" = {{ include "openshell-k8s.fullname" . | quote }}, "app.kubernetes.io/component" = "gateway" }

    [openshell.drivers.kubernetes.sidecar]
    proxy_uid                    = 1337
    process_binary_aware_network_policy = true

    [openshell.gateway.credential_storage]
    key_encryption_key_env = "OPENSHELL_GATEWAY_CREDENTIAL_KEY_ENCRYPTION_KEY"

    # Governance interceptor — sidecar on localhost (intra-pod only).
    # allow_insecure_transport is safe: localhost-only, no network exposure.
    [[openshell.gateway.interceptors]]
    name           = "governance"
    grpc_endpoint  = "http://localhost:{{ .Values.governance.port }}"
    failure_policy = {{ .Values.governance.failurePolicy | quote }}
    binding_policy = "allowlist"
    timeout        = {{ .Values.governance.timeout | quote }}
    allow_insecure_transport = true

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/CreateSandbox"
    phases = ["modify_operation", "validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/CreateProvider"
    phases = ["validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/UpdateConfig"
    phases = ["validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/SubmitPolicyAnalysis"
    phases = ["validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/ImportProviderProfiles"
    phases = ["validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/UpdateProviderProfiles"
    phases = ["validate"]

    [[openshell.gateway.interceptors.bindings]]
    rpc = "openshell.v1.OpenShell/DeleteProviderProfile"
    phases = ["validate"]
