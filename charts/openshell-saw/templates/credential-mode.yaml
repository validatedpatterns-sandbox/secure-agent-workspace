{{- if not (include "openshell-sandbox.credentialProxyEnabled" .) }}
# Compatibility slot: cloud-init helpers on existing VM root disks require it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-credential-mode
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  mode: direct
{{- end }}
