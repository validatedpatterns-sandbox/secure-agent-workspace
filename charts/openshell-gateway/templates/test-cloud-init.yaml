{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "openshell-gateway.fullname" . }}-cloud-init-test
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  serviceAccountName: {{ include "openshell-gateway.fullname" . }}-test
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: {{ .Values.test.image }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          VM_NAME="{{ include "openshell-gateway.fullname" . }}"
          SVC_NAME="{{ include "openshell-gateway.fullname" . }}-gateway"
          NAMESPACE="{{ .Release.Namespace }}"
          VMI_TIMEOUT={{ .Values.test.vmiTimeout }}
          GW_TIMEOUT={{ .Values.test.gatewayTimeout }}

          API_SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

          kube_get() {
            curl -sf --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
              "${API_SERVER}${1}"
          }

          echo "=== Gateway verification for ${VM_NAME} ==="

          # --- Check DataVolume provisioning ---
          DV_NAME="${VM_NAME}-root"
          echo "Waiting up to ${VMI_TIMEOUT}s for DataVolume '${DV_NAME}' to succeed..."
          DV_PHASE=""
          elapsed=0
          while [ "${elapsed}" -lt "${VMI_TIMEOUT}" ]; do
            DV_PHASE=$(kube_get "/apis/cdi.kubevirt.io/v1beta1/namespaces/${NAMESPACE}/datavolumes/${DV_NAME}" \
              | tr -d '\n\r ' \
              | grep -o '"phase":"[^"]*"' \
              | head -1 \
              | cut -d'"' -f4 || true)

            if [ "${DV_PHASE}" = "Succeeded" ]; then
              echo "DataVolume '${DV_NAME}' is Succeeded (${elapsed}s)"
              break
            fi

            echo "  waiting for DataVolume... phase=${DV_PHASE:-unknown} (${elapsed}s/${VMI_TIMEOUT}s)"
            sleep 10
            elapsed=$((elapsed + 10))
          done

          if [ "${DV_PHASE}" != "Succeeded" ]; then
            echo "FAIL: DataVolume '${DV_NAME}' not Succeeded after ${VMI_TIMEOUT}s"
            exit 1
          fi

          # --- Check VMI status and optionally probe ports ---
          VMI_PHASE=$(kube_get "/apis/kubevirt.io/v1/namespaces/${NAMESPACE}/virtualmachineinstances/${VM_NAME}" 2>/dev/null \
            | tr -d '\n\r ' \
            | grep -o '"phase":"[^"]*"' \
            | head -1 \
            | cut -d'"' -f4 || true)

          if [ "${VMI_PHASE}" = "Running" ]; then
            echo "VMI is Running — probing gateway port..."
            elapsed=0
            while [ "${elapsed}" -lt "${GW_TIMEOUT}" ]; do
              if timeout 5 bash -c "echo > /dev/tcp/${SVC_NAME}/17670" 2>/dev/null; then
                echo "Gateway port 17670 is open (${elapsed}s)"
                break
              fi
              echo "  waiting for gateway port 17670... (${elapsed}s/${GW_TIMEOUT}s)"
              sleep 10
              elapsed=$((elapsed + 10))
            done

            if ! timeout 5 bash -c "echo > /dev/tcp/${SVC_NAME}/17670" 2>/dev/null; then
              echo "WARN: Gateway port 17670 not reachable (non-fatal)"
            fi

            echo "Checking SSH port ${SVC_NAME}:22..."
            if timeout 10 bash -c "echo > /dev/tcp/${SVC_NAME}/22" 2>/dev/null; then
              echo "SSH port 22 is open"
            else
              echo "WARN: SSH port 22 not reachable on ${SVC_NAME} (non-fatal)"
            fi
          else
            echo "VMI is '${VMI_PHASE:-not found}'. Skipping port checks."
          fi

          echo "=== All checks passed ==="
{{- end }}
