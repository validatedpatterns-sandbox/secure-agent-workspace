{{- include "openshell-sandbox.validateSecretName" .Values.sshSecret }}
{{- include "openshell-sandbox.validateSecretName" (.Values.inference.secretName | default .Values.inference.provider) }}
{{- include "openshell-sandbox.validateSandboxName" .Release.Name }}
{{- with .Values.sandboxName }}{{- include "openshell-sandbox.validateSandboxName" . }}{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-setup
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openshell-sandbox.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openshell-sandbox.fullname" . }}-setup
      restartPolicy: OnFailure
      {{- if .Values.job.waitForSecrets }}
      initContainers:
        - name: wait-for-secrets
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for required secrets..."
              deadline=$((SECONDS + 600))
              while true; do
                all_ready=true
                for secret in "{{ .Values.sshSecret }}" "{{ .Values.inference.secretName | default .Values.inference.provider }}"; do
                  [[ -z "${secret}" ]] && continue
                  if ! [[ "${secret}" =~ ^[a-z0-9][a-z0-9.-]*$ ]]; then
                    echo "ERROR: invalid secret name: ${secret}" >&2
                    exit 1
                  fi
                  if ! kubectl get secret "${secret}" -n {{ .Release.Namespace }} >/dev/null 2>&1; then
                    echo "  waiting for secret/${secret}..."
                    all_ready=false
                  fi
                done
                if [[ "${all_ready}" == "true" ]]; then
                  echo "All secrets ready."
                  exit 0
                fi
                if (( SECONDS > deadline )); then
                  echo "Timed out waiting for secrets" >&2
                  exit 1
                fi
                sleep 10
              done
      {{- end }}
      containers:
        - name: setup
          image: {{ .Values.job.image }}
          command: ["/bin/bash", "/scripts/run-setup.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: setup-env
              mountPath: /secrets
              readOnly: true
            {{- if .Values.vertexSaJson }}
            - name: gcp-sa
              mountPath: /gcp-sa
              readOnly: true
            {{- end }}
            {{- if or .Values.inference.secretName .Values.inference.provider }}
            - name: provider-secret
              mountPath: /provider-secret
              readOnly: true
            {{- end }}
            - name: ssh-key
              mountPath: /ssh-key
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: {{ include "openshell-sandbox.fullname" . }}-scripts
            defaultMode: 0755
        - name: setup-env
          secret:
            secretName: {{ include "openshell-sandbox.fullname" . }}-setup-env
        {{- if .Values.vertexSaJson }}
        - name: gcp-sa
          secret:
            secretName: {{ include "openshell-sandbox.fullname" . }}-gcp-sa
        {{- end }}
        {{- if or .Values.inference.secretName .Values.inference.provider }}
        - name: provider-secret
          secret:
            secretName: {{ .Values.inference.secretName | default .Values.inference.provider }}
            optional: true
        {{- end }}
        - name: ssh-key
          secret:
            secretName: {{ .Values.sshSecret }}
            defaultMode: 0600
