# One isolated user/SAW instance. Render directly with Helm for a disposable
# test, or through saw-blueprint's ApplicationSet for GitOps deployment.
#
# Do not put provider credentials, Vault/OIDC tokens, registry credentials, or
# mutable image tags here. ESO retrieves provider values from Vault; the VM sees
# only explicitly declared Secret keys through read-only mounts.
openshellSaw:
  # Namespace creation is owned by Helm --create-namespace or Argo's
  # CreateNamespace sync option, not by this chart's resource set.
  createNamespace: false
  # Shared identity and Vault connection. saw-blueprint supplies these globally.
  platform: {}
  # platform:
  #   issuer: https://identity.example.com/realms/saw
  #   vault: {server: https://vault.example.com, mount: secret, prefix: saw/users, authMount: kubernetes, audience: vault, caBundle: "<public CA PEM>"}

  # One user/SAW identity. Namespace identity derives from issuer + subject + name;
  # username is display metadata and is used as the default Vault prefix suffix.
  tenant: {}
  # tenant:
  #   name: research
  #   subject: immutable-oidc-subject
  #   username: alice
  #   credentials: [{name: nvidia, remoteKey: nvidia, keys: [type, model, endpoint, api_key]}]
  # Rendered user values set vaultPrefix (for example saw/alice) and
  # providerCredentials. Each provider becomes a Secret named remoteKey.

  # Approved shared CDI DataSource. The chart clones it to the tenant's private
  # saw-root DataVolume; never set a registry URL or pull Secret here.
  image: {}
  # image: {namespace: saw-images, dataSource: qualified-saw-release-<hash>, diskSizeGi: 40, storageClassName: optional}

  # Instance selects reviewed workspace profiles and binds logical credential names
  # to ESO Secret keys. The chart derives ownerSubject from tenant.subject.
  instance: {}
  # instance:
  #   workspaces:
  #       - profileRef: {name: data-science, configMapRef: {name: profiles}}
  #         credentialBindings:
  #           nvidia:
  #             secretRef: {name: nvidia, key: api_key}

  # Public, reviewed profile documents. Every item becomes a read-only ConfigMap
  # mounted in the VM. Keys use profiles__<profile>__<workspace>__<type>.yaml.
  profileConfigMaps: []
  # profileConfigMaps:
  #   - name: profiles
  #     data:
  #       profiles__data-science__default__workspace.yaml: |-
  #         apiVersion: saw.redhat.com/v1alpha1
  #         kind: Workspace
  #         metadata: {name: default}

  # Immutable resolved release. saw-blueprint normally selects the global default
  # or approved per-tenant override, then passes it here. This chart creates a
  # namespace-local installer ConfigMap because cross-namespace mounts are illegal.
  installerRelease: {}
  # installerRelease:
  #   name: saw-2026-09
  #   bundleRef: registry.example.com/saw-installer@sha256:<64-hex-digest>
  #   bundleDigest: sha256:<64-hex-digest>
  #   bom: {installerVersion: 0.2.0, openshell: {cli: {...}, gateway: {...}, supervisor: {...}}}

  # Set enabled to create the VM. Halted creates it but does not boot it; use
  # Always only after the image and installer release are qualified.
  guest: {}
  # guest: {enabled: true, cores: 4, memoryGi: 8, runStrategy: Halted}
