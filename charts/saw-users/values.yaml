# One entry per person. The pattern's list lives in overrides/saw-users.yaml.
# A name is a lowercase DNS label, unique, and at most 19 characters: it is
# the VM name (OpenShell's limit), in namespace saw-<name>, as with
# `make saw-create OPENSHELL_SAW_NAME=<name>`. The dashboard route
# label "<name>-dashboard-saw-<name>" is then at most 53 of 63.
users: []

# Default for every user; a user's own `pruneOnRemove` wins. Prefer setting it
# on the one entry you are about to remove (in overrides/saw-users.yaml):
# while it is true for a user, deleting that user's apps (or the saw-users app,
# or uninstalling the pattern) also deletes that user's VM.
# false: removing a user deletes that user's Argo CD Applications and leaves
# the namespace and the VM (openshell-saw gets cleanupOnDelete: false, so its
# pre-delete hook, which Argo CD would run on app deletion, is not rendered).
# The namespace is marked Prune=false so the parent app does not delete it.
# true: those Applications get a foreground finalizer and openshell-saw keeps
# its pre-delete hook, so Argo CD deletes the VM and the namespace goes too.
# The saw-users app in values-prod turns on prune. Without that, Argo CD
# keeps objects after they disappear from this chart.
pruneOnRemove: false

defaults:
  profiles:
    - data-science
  # Shared hub prefix. Set vaultPrefix on a user for a private path
  # (secret/data/hub/saw-<user>/<generation> is what the self-service portal writes).
  # This chart does not create Vault entries.
  vaultPrefix: secret/data/hub
  # The SSH key the VMs are provisioned with is the pattern's, not the
  # user's: it is always read from here.
  sshVaultPrefix: secret/data/hub
  # Provider Secrets for a user none of whose profiles is in the catalog.
  secrets:
    - inference
    - web-search
  # Merged under each user's `values`. owner is the user name.
  openshellSaw:
    signing:
      mode: warn
    prune:
      mode: report
      sandboxes: false
    dashboard:
      insecureSkipIssuerTlsVerify: true

# Sandbox web UIs (ui.route: true in a SAW-BOM sandbox.yaml). Each one gets a
# route and an owner-only oauth2-proxy in the VM that listens on
# proxyBasePort + n, in front of an `openshell forward` on forwardBasePort + n
# (n: its place in the sorted <workspace>/<sandbox> list). The VM opens `max`
# proxy ports, so a user can have at most that many. A user's own `sandboxUi`
# list ([{workspace, sandbox}]) replaces the one from their profiles.
sandboxUi:
  max: 8
  proxyBasePort: 4201
  forwardBasePort: 14201

# Extra labels on every user namespace (the self-service portal marks the
# ones it created: saw.redhat.com/portal=true).
namespaceLabels: {}

# Where the generated Application objects are stored. The pattern injects
# global.vpArgoNamespace; argo.namespace is the fallback for helm template.
argo:
  namespace: vp-gitops
  project: default
  destinationName: in-cluster
  retryLimit: 20
  finalizer: resources-finalizer.argocd.argoproj.io/foreground

# global.* values passed on to openshell-saw (the ones its templates read).
machineGlobals:
  - clusterDomain
  - sshPublicKey

syncWave:
  namespace: "-1"
  secrets: "0"
  bom: "0"
  sandbox: "1"

# Stubs so `helm template` works. On a cluster the pattern replaces these
# with the real global.* parameters. Empty values are not copied onto the
# per-user apps (an empty parameter makes the root app look OutOfSync).
global:
  repoURL: https://example.com/secure-agent-workspace.git
  targetRevision: main
  clusterDomain: example.com
  pattern: secure-agent-workspace
  vpArgoNamespace: vp-gitops
