# NOTE: This chart requires a pre-existing Secret 'rhdh-k8s-proxy-token' in the
# RHDH namespace containing K8S_API_TOKEN (a long-lived token for the
# saw-provisioner ServiceAccount) and K8S_API_URL. The quickstart path
# creates this automatically via 'make deploy-rhdh'. For ArgoCD deployments,
# run 'make deploy-rhdh' once after the first sync to seed the token.
