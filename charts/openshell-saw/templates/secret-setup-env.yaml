apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-setup-env
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  run-create.env: |
    SANDBOX_NAME={{ .Values.sandboxName | default (include "openshell-sandbox.fullname" .) }}
    SSH_PUBKEY="{{ .Values.sshPublicKey }}"
    NEMOCLAW_AGENT={{ .Values.agent }}
    ONBOARD_CLI={{ .Values.onboardCli }}
    {{- if .Values.sandboxImage }}
    SANDBOX_IMAGE={{ .Values.sandboxImage }}
    {{- end }}
    NEMOCLAW_PROVIDER={{ .Values.inference.provider }}
    NEMOCLAW_MODEL={{ .Values.inference.model }}
    NEMOCLAW_API_KEY={{ .Values.inference.apiKey }}
    NEMOCLAW_ENDPOINT_URL={{ .Values.inference.endpointUrl }}
    NEMOCLAW_WEB_SEARCH_PROVIDER={{ .Values.inference.webSearch }}
    {{- if .Values.vertexSaJson }}
    PROVIDER_NAME=vertex-{{ .Values.sandboxName | default (include "openshell-sandbox.fullname" .) }}
    SA_JSON=/home/{{ .Values.sshUser }}/vertex-sa-{{ .Values.sandboxName | default (include "openshell-sandbox.fullname" .) }}.json
    VERTEX_AI_REGION={{ .Values.vertex.region }}
    VERTEX_MODEL={{ .Values.vertex.model }}
    {{- end }}
    {{- $oidcIssuer := include "openshell-sandbox.oidcIssuerUrl" . }}
    {{- if or .Values.oidc.token $oidcIssuer }}
    OIDC_ISSUER={{ $oidcIssuer }}
    OIDC_CLIENT_ID={{ .Values.oidc.clientId }}
    OIDC_PASSTHROUGH={{ .Values.oidc.passthrough }}
    {{- end }}
    {{- if .Values.oidc.token }}
    OIDC_TOKEN={{ .Values.oidc.token }}
    {{- end }}
    {{- if .Values.dashboard.enabled }}
    DASHBOARD_ENABLED=true
    DASHBOARD_IMAGE={{ .Values.dashboard.image }}
    DASHBOARD_PROXY_IMAGE={{ .Values.dashboard.proxyImage }}
    DASHBOARD_CLIENT_ID={{ .Values.dashboard.clientId }}
    DASHBOARD_COOKIE_SECRET={{ randAlphaNum 32 | quote }}
    {{- end }}
