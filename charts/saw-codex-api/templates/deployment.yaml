apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "saw-codex-api.fullname" . }}
  labels:
    {{- include "saw-codex-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "saw-codex-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "saw-codex-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "saw-codex-api.fullname" . }}
      containers:
        - name: api
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OIDC_ISSUER_URL
              value: {{ include "saw-codex-api.oidcIssuerUrl" . | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
            - name: MANAGED_NAMESPACE
              value: {{ .Values.managedNamespace | quote }}
            - name: SAW_CHART_PATH
              value: {{ .Values.sawChartPath | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
