{{- $u := required "verified registration owner required" .Values.owner -}}
{{- $id := required "registration required" .Values.registration -}}
{{- if or (gt (len $u) 19) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $u)) (not (regexMatch "^[0-9a-f]{16}$" $id)) }}{{ fail "invalid portal owner or registration" }}{{ end }}
{{- $subject := required "resolved ownerSubject required" .Values.ownerSubject }}
{{- if not (regexMatch "^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$" $subject) }}{{ fail "invalid ownerSubject" }}{{ end }}
{{- $runtime := printf "saw-%s" $u }}
{{- $trusted := printf "saw-ctl-%s" $id }}
{{- if ne .Release.Namespace $runtime }}{{ fail "release namespace must match workspace owner" }}{{ end }}
{{- $prefix := required "owner-scoped vaultPrefix required" .Values.vaultPrefix }}
{{- if not (regexMatch (printf "^[a-zA-Z0-9_-]+/data/([a-zA-Z0-9_-]+/)*saw-%s(/%s)?$" $u $id) $prefix) }}{{ fail "vaultPrefix must match the owner (…/saw-<owner>, or …/saw-<owner>/<registration> from the portal)" }}{{ end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $trusted }}
  labels:
    saw.redhat.com/runtime-owner: {{ required "installationID required" .Values.installationID | quote }}
    saw.redhat.com/portal-owner: {{ $u | quote }}
    saw.redhat.com/registration: {{ $id | quote }}
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# The workspace's platform pods (gateway, controller, identity and enrollment
# Jobs, relay) reach the Kubernetes API through the control-plane nodes. An
# AdminNetworkPolicy can select nodes by label, so no cluster IPs are needed.
# Allow here is final and takes precedence over the default-deny below. It
# comes after the runtime's own policy (priority 51), which only covers
# sandbox supervisors, and never selects a sandbox pod.
{{- $apiSite := include "portal.site" . | fromJson }}
{{- $api := $apiSite.kubernetesApi | default dict }}
{{- $apiNamespaces := list $runtime $trusted }}
{{- range $slot := ($apiSite.targets | default dict) }}{{- if $slot.ui }}{{- $apiNamespaces = append $apiNamespaces (printf "saw-ui-%s" $slot.relayID) }}{{- end }}{{- end }}
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: saw-{{ $id }}-kubernetes-api
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  priority: {{ required "kubernetesApi.priority required" $api.priority }}
  subject:
    pods:
      namespaceSelector:
        matchExpressions:
        - {key: kubernetes.io/metadata.name, operator: In, values: {{ $apiNamespaces | uniq | toJson }}}
      podSelector:
        matchLabels: {saw.redhat.com/kubernetes-api: allow}
        matchExpressions: [{key: openshell.ai/boundary-role, operator: DoesNotExist}]
  egress:
  - name: kubernetes-api
    action: Allow
    to: {{ required "kubernetesApi.to required" $api.to | toJson }}
    ports: [{portNumber: {protocol: TCP, port: {{ $api.port | default 6443 }}}}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ $trusted }}, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress], ingress: [], egress: []}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: {{ $runtime }}, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
spec: {podSelector: {}, policyTypes: [Ingress, Egress], ingress: [], egress: []}
{{- $customSecret := "" }}
{{- $sources := dict }}
{{- /* helm lint turns required into a warning and yields "", which range cannot iterate. */}}
{{- $bindings := required "explicit credential bindings required" (.Values.site | default dict).credentialBindings }}
{{- range ($bindings | default list) }}
{{- if eq .type "custom-inference" }}{{- $customSecret = .secret }}{{- end }}
{{- $fields := get $sources .secret | default list }}
{{- /* A refreshable credential's Secret holds only the refresh material; OpenShell mints the token. */}}
{{- if .refresh }}{{- $fields = concat $fields (list "client_id" "client_secret" "refresh_token") }}{{- else }}{{- $fields = append $fields .key }}{{- end }}
{{- $_ := set $sources .secret ($fields | uniq | sortAlpha) }}
{{- end }}
{{- range $secret, $fields := $sources }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $trusted }}
spec:
  refreshInterval: 1m
  secretStoreRef: {kind: ClusterSecretStore, name: {{ $.Values.secretStore | quote }}}
  {{- if eq $customSecret $secret }}
  target:
    name: {{ $secret }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        url: {{ required "custom inference requires the enrolled site URL" $.Values.site.customInferenceURL | quote }}
  {{- else }}
  target: {name: {{ $secret }}, creationPolicy: Owner}
  {{- end }}
  data:
    {{- range $fields }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ printf "%s/%s" $prefix $secret | quote }}, property: {{ . }}}
    {{- end }}
{{- end }}

{{- $pull := (.Values.site | default dict).imagePull | default dict }}
{{- if $pull }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: portal-image-{{ $id }}, namespace: {{ $pull.namespace }}}
rules: [{apiGroups: [image.openshift.io], resources: [imagestreams/layers], resourceNames: {{ $pull.streams | toJson }}, verbs: [get]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: portal-image-{{ $id }}, namespace: {{ $pull.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: portal-image-{{ $id }}}
subjects: [{kind: ServiceAccount, name: {{ $u }}-sandbox, namespace: {{ $runtime }}}]
{{- end }}
