apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: codexsessions.saw.redhat.com
spec:
  group: saw.redhat.com
  names:
    kind: CodexSession
    plural: codexsessions
    singular: codexsession
    shortNames: [cs]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, owner]
              properties:
                name:
                  type: string
                  maxLength: 19
                  pattern: "^[a-z][a-z0-9-]*$"
                owner:
                  type: string
                runtime:
                  type: object
                  properties:
                    backend:
                      type: string
                      enum: ["vm", "kubernetes"]
                desiredState:
                  type: string
                  enum: ["Running", "Stopped"]
                  default: "Running"
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Creating, Running, Stopped, Stopping, Deleting, Error]
                message:
                  type: string
                backend:
                  type: string
                namespace:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Backend
          type: string
          jsonPath: .status.backend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
