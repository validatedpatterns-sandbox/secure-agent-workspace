{{- $s := include "portal.site" . | fromJson }}{{- $a := $s.automaticEnrollment | default dict }}
{{- if and (.Values.site | default dict).automaticEnrollment (ne (get $a "enabled" | toString) "false") }}
{{- $autoApprove := eq (toString ($a.autoApprove | default false)) "true" }}
{{- if or (not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $a.image)) (not (regexMatch (include "portal.revisionPattern" $) ($a.revision | default ""))) (and (not $autoApprove) (ne (len ($a.reference | default dict)) (ternary 23 21 (not (empty $s.kataRuntimeClass))))) }}{{ fail "automatic enrollment requires a pinned image, a full Git commit SHA revision and a reviewed boundary (or autoApprove, which may follow a branch)" }}{{- end }}
{{- $observer := $s.observer | default dict }}
{{- $r := .Values.registration }}{{- $g := .Values.owner }}{{- $n := .Release.Namespace }}
{{- $t := printf "saw-ctl-%s" $r }}{{- $archive := printf "saw-history-%s" $r }}
{{- $targets := include "portal.targets" . | fromJson }}
{{- $bases := list }}{{- range $slot := $targets }}{{- $bases = append $bases $slot.base }}{{- end }}
{{- $gov := $s.governanceNamespace }}{{- $name := printf "enroll-%s" $r }}{{- $policy := printf "saw-%s-runtime" $n }}
{{- $gatewayVersion := dig "stack" "gateway" "values" "kubernetes" "gateway" "version" .Values.driverDefaults.gatewayVersion $s -}}
{{- $bootstrap := dict "registration" $r "installation" .Values.installationID "user" $g "subject" .Values.ownerSubject "governance" $gov "reference" ($a.reference | default dict) "autoApprove" $autoApprove "profileSHA256" ($s.selectedDigest | default $a.profileSHA256) "targets" $targets "gatewayVersion" $gatewayVersion "customInferenceURL" ($s.customInferenceURL | default "") "credentialBindings" ($s.credentialBindings | default list) "lifecycleVersion" ($s.lifecycleVersion | default 0) "modelInputs" ($s.modelInputs | default dict) "resources" $a.resources "domain" .Values.global.clusterDomain "auditReceipts" ($s.auditReceipts | default false) -}}
{{- $scripts := (.Files.Glob "files/*.py").AsConfig -}}
{{- with $s.kataRuntimeClass }}{{- $_ := set $bootstrap "kataRuntimeClass" . }}{{- end }}
{{- $revision := dict "chartVersion" .Chart.Version "image" $a.image "config" $bootstrap "scripts" $scripts | toJson | sha256sum | trunc 12 -}}
{{- $scriptName := printf "bootstrap-%s" $revision -}}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ $name }}, namespace: {{ $t }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ $t }}-{{ $name }}}
rules:
  - {apiGroups: [""], resources: [namespaces], resourceNames: [{{ $n }}], verbs: [get]}
  - {apiGroups: [""], resources: [nodes], verbs: [list]}
  - {apiGroups: [config.openshift.io], resources: [clusterversions], resourceNames: [version], verbs: [get]}
  - {apiGroups: [kataconfiguration.openshift.io], resources: [kataconfigs], verbs: [list]}
  - {apiGroups: [apiextensions.k8s.io], resources: [customresourcedefinitions], resourceNames: [kataconfigs.kataconfiguration.openshift.io, sandboxes.agents.x-k8s.io, externalsecrets.external-secrets.io, adminnetworkpolicies.policy.networking.k8s.io], verbs: [get]}
{{- with $s.kataRuntimeClass }}
  - {apiGroups: [node.k8s.io], resources: [runtimeclasses], resourceNames: [{{ .name | quote }}], verbs: [get]}
  - {apiGroups: [admissionregistration.k8s.io], resources: [validatingadmissionpolicies, validatingadmissionpolicybindings], resourceNames: [{{ $policy }}-kata], verbs: [get]}
{{- end }}
  - {apiGroups: [policy.networking.k8s.io], resources: [adminnetworkpolicies], verbs: [list]}
  - {apiGroups: [policy.networking.k8s.io], resources: [adminnetworkpolicies], resourceNames: [{{ $policy }}-egress], verbs: [get]}
  - {apiGroups: [admissionregistration.k8s.io], resources: [validatingadmissionpolicies, validatingadmissionpolicybindings], resourceNames: [{{ $policy }}, {{ $n }}-pods-driver, {{ $n }}-secrets-driver, {{ $n }}-services-driver], verbs: [get]}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ $t }}-{{ $name }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $t }}-{{ $name }}}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $t }}}]
{{- range $ns := list $n $t $gov }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $name }}, namespace: {{ $ns }}}
rules:
{{- if eq $ns $n }}
  - {apiGroups: [rbac.authorization.k8s.io], resources: [roles], resourceNames: [{{ $g }}-gateway], verbs: [get]}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [saw-bom-profiles, {{ $g }}-gateway-config], verbs: [get]}
  - {apiGroups: [""], resources: [persistentvolumeclaims], resourceNames: {{ include "portal.claims" $ }}, verbs: [get]}
  - {apiGroups: [apps], resources: [statefulsets], resourceNames: [{{ $g }}-gateway], verbs: [get]}
  - {apiGroups: [""], resources: [services], resourceNames: [{{ $g }}-gateway], verbs: [get]}
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies], resourceNames: [{{ $g }}-gateway, {{ $g }}-default-deny, openshell-sandbox-workloads, openshell-sandbox-supervisors], verbs: [get]}
{{- else if eq $ns $t }}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [{{ $g }}-gateway-ca], verbs: [get]}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [saw-portal-enrollment], verbs: [get, patch]}
{{- else }}
  - {apiGroups: [apps], resources: [deployments], resourceNames: [governance-interceptor], verbs: [get]}
  - {apiGroups: [""], resources: [services], resourceNames: [governance-interceptor], verbs: [get]}
  - {apiGroups: [""], resources: [configmaps], resourceNames: [governance-interceptor-policy, governance-interceptor-profiles], verbs: [get]}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}, namespace: {{ $ns }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $t }}}]
{{- end }}

{{- with include "portal.pullNamespace" $a }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $name }}-pull, namespace: {{ . }}}
rules: [{apiGroups: [image.openshift.io], resources: [imagestreams/layers], resourceNames: [{{ base (index (splitList "@" $a.image) 0) | quote }}], verbs: [get]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}-pull, namespace: {{ . }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-pull}
subjects: [{kind: ServiceAccount, name: {{ $name }}, namespace: {{ $t }}}]
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: {{ $scriptName }}, namespace: {{ $t }}}
immutable: true
data:
  config.json: {{ $bootstrap | toJson | quote }}
{{ $scripts | indent 2 }}
{{- if $s.auditReceipts }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bootstrap-writer, namespace: {{ $archive }}}
spec:
  podSelector: {matchExpressions: [{key: saw-audit-writer, operator: In, values: {{ $bases | toJson }}}]}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $t }}}}
      podSelector: {matchLabels: {app: {{ $name }}}}
    ports: [{port: 8443, protocol: TCP}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: bootstrap-egress, namespace: {{ $t }}}
spec:
  podSelector: {matchLabels: {app: {{ $name }}}}
  policyTypes: [Egress]
  egress:
{{ toYaml $s.stack.identity.values.network.bootstrapEgress | indent 4 }}
    {{- if $s.auditReceipts }}
    # Reads each writer's receipt key for the tool gate.
    - to:
      - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ $archive }}}}
        podSelector: {matchExpressions: [{key: saw-audit-writer, operator: In, values: {{ $bases | toJson }}}]}
      ports: [{port: 8443, protocol: TCP}]
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata: {name: {{ $name }}-{{ $revision }}, namespace: {{ $t }}}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1200
  template:
    metadata: {labels: {app: {{ $name }}, saw.redhat.com/kubernetes-api: allow}}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: enroll
        image: {{ $a.image | quote }}
        command: [python3, /bootstrap/enroll.py]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts: [{name: scripts, mountPath: /bootstrap, readOnly: true},{name: ca, mountPath: /writer-ca, readOnly: true}]
      volumes:
      - {name: scripts, configMap: {name: {{ $scriptName }}}}
      - {name: ca, configMap: {name: openshift-service-ca.crt}}
{{- end }}
