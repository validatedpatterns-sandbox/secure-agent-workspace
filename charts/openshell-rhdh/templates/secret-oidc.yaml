apiVersion: v1
kind: Secret
metadata:
  name: rhdh-oidc-credentials
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
type: Opaque
stringData:
  SESSION_SECRET: {{ randAlphaNum 32 | quote }}
  AUTH_OIDC_METADATA_URL: "https://{{ include "openshell-rhdh.keycloakHost" . }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration"
  AUTH_OIDC_CLIENT_ID: {{ .Values.keycloak.clientId | quote }}
  AUTH_OIDC_CLIENT_SECRET: {{ .Values.keycloak.clientSecret | quote }}
  RHDH_BASE_URL: {{ include "openshell-rhdh.baseUrl" . | quote }}
