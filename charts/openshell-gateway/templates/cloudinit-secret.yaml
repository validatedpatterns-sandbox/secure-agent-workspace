apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshell-gateway.fullname" . }}-cloudinit
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  userData: |
    #cloud-config
    hostname: {{ include "openshell-gateway.fullname" . }}
    fqdn: {{ include "openshell-gateway.fullname" . }}.{{ .Release.Namespace }}.svc

    users:
      - default
      - name: cloud-user
        groups: [wheel]
        sudo: ["ALL=(ALL) NOPASSWD:ALL"]
        shell: /bin/bash
        ssh_authorized_keys:
          - {{ .Values.sshPublicKey | quote }}

    {{- if eq .Values.image.mode "snapshot" }}
    package_update: true
    packages:
      - podman
      - podman-docker
      - curl
      - jq
      - qemu-guest-agent
      - openssh-clients
    {{- end }}

    write_files:
      - path: /etc/openshell/gateway.env
        owner: root:root
        permissions: "0644"
        content: |
          OPENSHELL_BIND_ADDRESS=0.0.0.0
          OPENSHELL_SERVER_PORT=17670
          OPENSHELL_DRIVERS=podman
          OPENSHELL_GRPC_ENDPOINT=https://host.containers.internal:17670
          OPENSHELL_SSH_GATEWAY_HOST=host.containers.internal
          OPENSHELL_SSH_GATEWAY_PORT=17670
          OPENSHELL_SANDBOX_IMAGE={{ .Values.image.sandbox }}
          OPENSHELL_SUPERVISOR_IMAGE={{ .Values.image.supervisor }}
          OPENSHELL_TLS_CERT=/home/cloud-user/.local/state/openshell/tls/server/tls.crt
          OPENSHELL_TLS_KEY=/home/cloud-user/.local/state/openshell/tls/server/tls.key
          OPENSHELL_TLS_CLIENT_CA=/home/cloud-user/.local/state/openshell/tls/ca.crt
          {{- if .Values.oidc.enabled }}
          OPENSHELL_CONFIG_FILE=/etc/openshell/gateway.toml
          {{- end }}

      {{- if .Values.oidc.enabled }}
      {{- if not .Values.oidc.issuerUrl }}
      {{- fail "oidc.issuerUrl is required when oidc.enabled is true" }}
      {{- end }}
      - path: /etc/openshell/gateway.toml
        owner: root:root
        permissions: "0644"
        content: |
          [openshell.gateway.oidc]
          issuer = {{ .Values.oidc.issuerUrl | quote }}
          audience = {{ .Values.oidc.clientId | quote }}
          jwks_ttl_secs = {{ .Values.oidc.jwksTtlSecs }}
          roles_claim = {{ .Values.oidc.rolesClaim | quote }}
          admin_role = {{ .Values.oidc.adminRole | quote }}
          user_role = {{ .Values.oidc.userRole | quote }}

          [openshell.gateway.auth]
          allow_unauthenticated_users = false

          [openshell.gateway.mtls_auth]
          enabled = false
      {{- end }}

      {{- if eq .Values.image.mode "snapshot" }}
      - path: /usr/local/sbin/openshell-cnv-bootstrap.sh
        owner: root:root
        permissions: "0755"
        content: |
          #!/usr/bin/env bash
          set -euo pipefail

          OPENSHELL_VERSION="{{ .Values.openshell.version }}"
          RELEASE_TAG="v${OPENSHELL_VERSION}"
          ARCH="$(uname -m)"
          case "${ARCH}" in
            x86_64|amd64) RPM_ARCH="x86_64" ;;
            aarch64|arm64) RPM_ARCH="aarch64" ;;
            *) echo "unsupported arch: ${ARCH}" >&2; exit 1 ;;
          esac

          BASE="https://github.com/NVIDIA/OpenShell/releases/download/${RELEASE_TAG}"
          CLI_RPM="openshell-${OPENSHELL_VERSION}-1.fc{{ .Values.openshell.fedoraRelease }}.${RPM_ARCH}.rpm"
          GW_RPM="openshell-gateway-${OPENSHELL_VERSION}-1.fc{{ .Values.openshell.fedoraRelease }}.${RPM_ARCH}.rpm"
          TMP="$(mktemp -d)"
          trap 'rm -rf "${TMP}"' EXIT

          echo "Installing OpenShell ${RELEASE_TAG} (${RPM_ARCH})..."
          curl -fL --retry 3 -o "${TMP}/${CLI_RPM}" "${BASE}/${CLI_RPM}"
          curl -fL --retry 3 -o "${TMP}/${GW_RPM}" "${BASE}/${GW_RPM}"
          dnf install -y "${TMP}/${CLI_RPM}" "${TMP}/${GW_RPM}"

          echo "Installing Node.js 22..."
          dnf install -y --setopt=install_weak_deps=False nodejs

          USER_NAME="cloud-user"
          USER_HOME="$(getent passwd "${USER_NAME}" | cut -d: -f6)"
          USER_UID="$(id -u "${USER_NAME}")"
          install -d -m 0750 -o root -g "${USER_NAME}" /etc/openshell

          install -d -m 0755 "${USER_HOME}/.config"
          chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config"
          install -d -m 0755 "${USER_HOME}/.config/openshell"
          cp /etc/openshell/gateway.env "${USER_HOME}/.config/openshell/gateway.env"
          {{- if .Values.oidc.enabled }}
          if [[ -f /etc/openshell/gateway.toml ]]; then
            cp /etc/openshell/gateway.toml "${USER_HOME}/.config/openshell/gateway.toml"
          fi
          {{- end }}
          chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config/openshell"

          loginctl enable-linger "${USER_NAME}"
          systemctl enable --now podman.socket

          cat > /etc/systemd/system/openshell-gateway-setup.service <<UNIT
          [Unit]
          Description=OpenShell gateway user-service setup (first boot)
          After=multi-user.target
          ConditionPathExists=!/var/lib/openshell-gateway-setup.done

          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/local/sbin/openshell-gateway-user-setup.sh
          ExecStartPost=/usr/bin/touch /var/lib/openshell-gateway-setup.done

          [Install]
          WantedBy=multi-user.target
          UNIT
          sed -i 's/^          //' /etc/systemd/system/openshell-gateway-setup.service

          cat > /usr/local/sbin/openshell-gateway-user-setup.sh <<'SETUP'
          #!/usr/bin/env bash
          set -euo pipefail
          USER_NAME="cloud-user"
          USER_UID="$(id -u "${USER_NAME}")"
          USER_HOME="$(getent passwd "${USER_NAME}" | cut -d: -f6)"

          systemctl start "user@${USER_UID}.service"

          for _ in $(seq 1 90); do
            if [[ -S "/run/user/${USER_UID}/bus" ]]; then
              break
            fi
            sleep 1
          done
          if [[ ! -S "/run/user/${USER_UID}/bus" ]]; then
            echo "user systemd bus not ready for ${USER_NAME}" >&2
            exit 1
          fi

          export XDG_RUNTIME_DIR="/run/user/${USER_UID}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${USER_UID}/bus"

          run_user() {
            sudo -u "${USER_NAME}" XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}" systemctl --user "$@"
          }

          run_user daemon-reload
          for unit in podman.socket openshell-gateway.service; do
            ok=0
            for _ in $(seq 1 15); do
              if run_user enable --now "${unit}"; then
                ok=1; break
              fi
              sleep 2
              run_user daemon-reload || true
            done
            if [[ "${ok}" -ne 1 ]]; then
              echo "failed to enable --now ${unit} for ${USER_NAME}" >&2
              exit 1
            fi
          done

          sleep 3

          sudo -u "${USER_NAME}" XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}" bash -lc '
            set -euo pipefail
            TLS_DIR="${HOME}/.local/state/openshell/tls"
            {{- if not .Values.oidc.enabled }}
            MTLS_DIR="${HOME}/.config/openshell/gateways/openshell/mtls"
            mkdir -p "${MTLS_DIR}"
            if [[ -f "${TLS_DIR}/ca.crt" ]]; then
              cp -f "${TLS_DIR}/ca.crt" "${MTLS_DIR}/ca.crt"
              cp -f "${TLS_DIR}/client/tls.crt" "${MTLS_DIR}/tls.crt"
              cp -f "${TLS_DIR}/client/tls.key" "${MTLS_DIR}/tls.key"
            fi
            {{- end }}
            mkdir -p "${HOME}/.config/openshell/gateways/openshell"
            {{- if .Values.oidc.enabled }}
            printf "%s\n" "{\"name\":\"openshell\",\"gateway_endpoint\":\"https://127.0.0.1:17670\",\"is_remote\":false,\"gateway_port\":17670,\"auth_mode\":\"oidc\",\"oidc_issuer\":{{ .Values.oidc.issuerUrl | quote }},\"oidc_client_id\":{{ .Values.oidc.clientId | quote }},\"oidc_audience\":{{ .Values.oidc.clientId | quote }}}" > "${HOME}/.config/openshell/gateways/openshell/metadata.json"
            {{- else }}
            printf "%s\n" "{\"name\":\"openshell\",\"gateway_endpoint\":\"https://127.0.0.1:17670\",\"is_remote\":false,\"gateway_port\":17670,\"auth_mode\":\"mtls\"}" > "${HOME}/.config/openshell/gateways/openshell/metadata.json"
            {{- end }}
            echo openshell > "${HOME}/.config/openshell/active_gateway"
          '

          echo "Pre-pulling sandbox image..."
          sudo -u "${USER_NAME}" XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" DBUS_SESSION_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}" \
            podman pull "{{ .Values.image.sandbox }}" || true

          echo "OpenShell gateway user setup complete."
          SETUP
          sed -i 's/^          //' /usr/local/sbin/openshell-gateway-user-setup.sh
          chmod 755 /usr/local/sbin/openshell-gateway-user-setup.sh

          systemctl daemon-reload
          systemctl enable openshell-gateway-setup.service
          systemctl start openshell-gateway-setup.service

          echo "Bootstrap complete."
      {{- end }}

    runcmd:
      {{- if eq .Values.image.mode "snapshot" }}
      - [/usr/local/sbin/openshell-cnv-bootstrap.sh]
      {{- else }}
      - |
        USER_NAME="cloud-user"
        USER_HOME="$(getent passwd "${USER_NAME}" | cut -d: -f6)"
        install -d -m 0750 -o root -g "${USER_NAME}" /etc/openshell
        install -d -m 0755 "${USER_HOME}/.config"
        chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config"
        install -d -m 0755 "${USER_HOME}/.config/openshell"
        cp /etc/openshell/gateway.env "${USER_HOME}/.config/openshell/gateway.env"
        {{- if .Values.oidc.enabled }}
        if [[ -f /etc/openshell/gateway.toml ]]; then
          cp /etc/openshell/gateway.toml "${USER_HOME}/.config/openshell/gateway.toml"
        fi
        {{- end }}
        chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config/openshell"
        systemctl start openshell-gateway-setup.service
      {{- end }}

    final_message: "openshell-gateway cloud-init finished"
