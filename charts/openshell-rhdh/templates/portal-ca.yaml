{{- /* What the CA bundle is built from (see tls in values.yaml and
files/ca-bundle.py), in each namespace whose pods build it: RHDH's (RHDH,
the Keycloak setup Job) and the portal's (the generator). */ -}}
{{- range $ns := include "openshell-rhdh.caNamespaces" . | fromJsonArray }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-ca-sources
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "openshell-rhdh.labels" $ | nindent 4 }}
data:
  ca-bundle.py: |
{{ $.Files.Get "files/ca-bundle.py" | indent 4 }}
  wait-oidc.py: |
{{ $.Files.Get "files/wait-oidc.py" | indent 4 }}
  extra-ca.crt: |
{{ $.Values.tls.extraCaBundle | default "" | indent 4 }}
---
# The cluster's trusted CA bundle (system and proxy CAs), injected by the
# Cluster Network Operator under ca-bundle.crt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-trusted-ca
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "openshell-rhdh.labels" $ | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
{{- end }}
---
# The router's CA, for Keycloak's route when the default ingress
# certificate is self-signed: a public certificate, readable by the pods of
# the namespaces above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: saw-portal-ingress-ca
  namespace: openshift-config-managed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["default-ingress-cert"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: saw-portal-ingress-ca
  namespace: openshift-config-managed
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "openshell-rhdh.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: saw-portal-ingress-ca
subjects:
  {{- range $ns := include "openshell-rhdh.caNamespaces" . | fromJsonArray }}
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:{{ $ns }}
  {{- end }}
