# Container runtime to bake into the golden image: docker or podman
# docker: removes Podman, installs Docker CE, tags as openshell-gateway-docker
# podman: keeps Fedora default Podman, enables podman.socket, tags as openshell-gateway
containerRuntime: podman

openshell:
  # Informational: the in-VM installer installs OpenShell from the SAW's
  # InstallerBOM (charts/openshell-saw values `bom:`), not from these.
  version: "0.1.2"
  gatewayImage: "quay.io/opendatahub/odh-openshell-gateway:v0.1.2-rhaiv.0"
  supervisorImage: "quay.io/opendatahub/odh-openshell-supervisor:v0.1.2-rhaiv.0"
  pipIndexUrl: "https://packages.redhat.com/api/pypi/public-rhai/rhoai/3.6-EA1/cpu-ubi9-test/simple/"

# Pinned cosign used only to verify the installer bundle. The OpenShell
# publisher key is not known, so this does not verify those images (that
# uses apply_bom.py's own per-pull podman policy instead, from the BOM's
# signature field).
#
# The download itself was unauthenticated (PR #54 review, 7): a compromised
# release URL or a MITM'd download would bake a malicious cosign binary
# into every golden image -- and cosign is the thing verify-bundle trusts
# to say whether the installer is genuine. sha256 pulled from cosign's own
# published checksums file for this release; re-verify against
# https://github.com/sigstore/cosign/releases/tag/v2.4.1 when bumping the version.
cosign:
  version: "v2.4.1"
  url: "https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64"
  sha256: "8b24b946dd5809c6bd93de08033bcf6bc0ed7d336b7785787c080f574b89249b"

# Minimum signing.mode this image enforces at /etc/saw/signing-mode,
# regardless of what config.json (in the installer ConfigMap, which a
# namespace editor can change) says -- the effective mode used by
# verify-bundle and apply_bom.py is the stricter of this and config.json's
# signing.mode. Empty = no floor (today's behavior). Set to "enforce" for
# production images so a namespace editor cannot set signing.mode: off in
# config.json and skip enforcement (PR #54 review round 2, 1).
signing:
  floor: ""

build:
  builderImage: "registry.fedoraproject.org/fedora:44"
  fedoraCloud: "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
  memoryLimit: "4Gi"

# NVIDIA driver + Container Toolkit for GPU-passthrough VMs. Off by default.
# Only relevant when the VM will receive a KubeVirt hostDevices GPU, which
# requires bare-metal or IOMMU-capable nodes. The kernel module is built on
# first boot against the VM's running kernel (nvidia-driver-setup.service).
# The repo must match build.fedoraCloud. Fedora 44's kernel 7.2 does not
# build the 575 open module from the Fedora 41 repo (dma_is_direct is gone).
# 610.57.04 is the open driver that includes the kernel 7.2 fixes.
# See docs/gpu-passthrough.md.
gpu:
  enabled: false
  driverRepoUrlX86_64: "https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64/cuda-fedora44.repo"
  driverRepoUrlAarch64: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/sbsa/cuda-rhel10.repo"
  # NEVRA without the dist tag. virt-customize passes these to dnf.
  openDkmsPackage: "kmod-nvidia-open-dkms-610.57.04"
  driverPackage: "nvidia-driver-610.57.04"
  # nvidia-smi moved out of nvidia-driver in the 610 packaging.
  smiPackage: "nvidia-driver-cuda-610.57.04"
  containerToolkitRepoUrl: "https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo"

output:
  imageStreamTag: "openshell-gateway:latest"

goldenImage:
  enabled: true
  diskSize: 40Gi
  storageClassName: ""
