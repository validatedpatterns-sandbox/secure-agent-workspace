{{- $observer := (.Values.site | default dict).observer | default dict }}
{{- $portal := .Values.portalNamespace | default "saw-portal" }}
{{- $observerNamespace := $observer.namespace | default $portal }}
{{- $observerServiceAccount := $observer.serviceAccount | default "saw-workspaces-generator" }}
{{- $generatorServiceAccount := "saw-workspaces-generator" }}
{{- $provisionerServiceAccount := .Values.provisionerServiceAccount | default "saw-portal-provisioner" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: saw-portal-runtime-observer, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [saw-bom-profiles, saw-runtime-intent, saw-runtime-status]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: saw-portal-runtime-observer, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: saw-portal-runtime-observer}
subjects:
  - {kind: ServiceAccount, name: {{ $observerServiceAccount }}, namespace: {{ $observerNamespace }}}
  {{- if or (ne $observerServiceAccount $generatorServiceAccount) (ne $observerNamespace $portal) }}
  - {kind: ServiceAccount, name: {{ $generatorServiceAccount }}, namespace: {{ $portal }}}
  {{- end }}
  {{- if and (ne $provisionerServiceAccount $generatorServiceAccount) (or (ne $observerServiceAccount $provisionerServiceAccount) (ne $observerNamespace $portal)) }}
  - {kind: ServiceAccount, name: {{ $provisionerServiceAccount }}, namespace: {{ $portal }}}
  {{- end }}
