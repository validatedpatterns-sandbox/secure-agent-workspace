apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-keycloak.fullname" . }}-realm
  labels:
    {{- include "openshell-keycloak.labels" . | nindent 4 }}
data:
  openshell-realm.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "enabled": true,
      "registrationAllowed": {{ .Values.keycloak.registrationAllowed }},
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "sslRequired": "external",
      "roles": {
        "realm": [
          {{- $roles := .Values.keycloak.roles }}
          {{- range $i, $role := $roles }}
          {{- if $i }},{{ end }}
          {
            "name": {{ $role | quote }},
            "composite": false,
            "clientRole": false
          }
          {{- end }}
        ]
      },
      "clients": [
        {
          "clientId": {{ .Values.keycloak.clients.cli.clientId | quote }},
          "name": "OpenShell CLI",
          "enabled": true,
          "publicClient": {{ .Values.keycloak.clients.cli.public }},
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": false,
          "attributes": {
            "pkce.code.challenge.method": "S256",
            "access.token.lifespan": {{ .Values.keycloak.clients.cli.accessTokenLifespan | quote }},
            "oauth2.device.authorization.grant.enabled": "true",
            "oauth2.device.polling.interval": "5"
          },
          "redirectUris": [
            "http://localhost:*",
            "http://127.0.0.1:*",
            "urn:ietf:wg:oauth:2.0:oob"
          ],
          "webOrigins": [
            "http://localhost",
            "http://127.0.0.1"
          ],
          "protocolMappers": [
            {
              "name": "realm-roles",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "multivalued": "true",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": {{ .Values.keycloak.clients.cli.clientId | quote }},
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      {{- if .Values.keycloak.externalIdp.enabled }}
      "identityProviders": [
        {
          "alias": {{ .Values.keycloak.externalIdp.alias | quote }},
          "displayName": {{ .Values.keycloak.externalIdp.displayName | quote }},
          "providerId": {{ .Values.keycloak.externalIdp.providerType | quote }},
          "enabled": true,
          "trustEmail": true,
          "firstBrokerLoginFlowAlias": "first broker login",
          "config": {
            "issuer": {{ .Values.keycloak.externalIdp.issuerUrl | quote }},
            "authorizationUrl": {{ .Values.keycloak.externalIdp.authorizationUrl | quote }},
            "tokenUrl": {{ .Values.keycloak.externalIdp.tokenUrl | quote }},
            "clientId": {{ .Values.keycloak.externalIdp.clientId | quote }},
            "clientSecret": {{ .Values.keycloak.externalIdp.clientSecret | quote }},
            "defaultScope": {{ .Values.keycloak.externalIdp.scopes | quote }},
            "useJwksUrl": "true",
            "syncMode": "IMPORT"
          }
        }
      ],
      {{- if .Values.keycloak.externalIdp.defaultIdp }}
      "browserFlow": "browser",
      "authenticationFlows": [],
      {{- end }}
      {{- end }}
      "users": [
        {{- range $i, $user := .Values.keycloak.testUsers }}
        {{- if $i }},{{ end }}
        {
          "username": {{ $user.username | quote }},
          "firstName": {{ $user.firstName | default ($user.username | title) | quote }},
          "lastName": {{ $user.lastName | default "User" | quote }},
          "enabled": true,
          "emailVerified": true,
          "email": {{ printf "%s@openshell.local" $user.username | quote }},
          "credentials": [
            {
              "type": "password",
              "value": {{ $user.password | quote }},
              "temporary": false
            }
          ],
          "realmRoles": [
            {{- range $j, $role := $user.roles }}
            {{- if $j }},{{ end }}
            {{ $role | quote }}
            {{- end }}
          ]
        }
        {{- end }}
      ]
    }
