# Pattern CR for SAW on OCP5-rc5/arm64 (Vera Rubin).
# Adjust gitSpec.targetRepo / targetRevision to your fork + branch.
apiVersion: gitops.hybrid-cloud-patterns.io/v1alpha1
kind: Pattern
metadata:
  name: secure-agent-workspace
  namespace: openshift-operators
spec:
  clusterGroupName: prod
  gitSpec:
    inClusterGitServer: false
    targetRepo: https://github.com/sauagarwa/secure-agent-workspace
    targetRevision: openshift-vera-rubin
  multiSourceConfig:
    clusterGroupChartVersion: 0.9.*
    enabled: true
