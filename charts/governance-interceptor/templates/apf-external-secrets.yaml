{{- if and .Values.enabled (eq (include "governance.engine" .) "apf") .Values.apf.externalSecrets.enabled }}
{{- $es := .Values.apf.externalSecrets }}
# Pull secret for the private APF images (Vault: <prefix>/ghcr, fields
# username and token; values-secret.yaml.template shows the entry).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.apf.pullSecret }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.apf.pullSecret }}
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        # Built with toJson and trimmed: a token file ending in a newline
        # would otherwise make invalid JSON, which Kubernetes rejects.
        .dockerconfigjson: {{ `{{ $u := .username | trim }}{{ $t := .token | trim }}{{ dict "auths" (dict "ghcr.io" (dict "username" $u "password" $t "auth" (printf "%s:%s" $u $t | b64enc))) | toJson }}` | quote }}
  dataFrom:
    - extract:
        key: {{ $es.vaultPrefix }}/ghcr
---
# The private key APF signs provenance tokens with (Vault: <prefix>/apf-signing,
# field seed). The same key signs the bundle; its public half is in the chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.apf.signingSecret }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ .Values.apf.signingSecret }}
    template:
      type: Opaque
      engineVersion: v2
      data:
        apf-dev.seed: {{ `{{ .seed }}` | quote }}
  dataFrom:
    - extract:
        key: {{ $es.vaultPrefix }}/apf-signing
{{- if .Values.apf.application.enabled }}
---
# Lets Argo CD pull the private APF chart: a repository Secret in the Argo CD
# namespace, from the same GHCR credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: governance-apf-chart-repo
  namespace: {{ include "governance.argoNamespace" . }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: governance-apf-chart-repo
    template:
      type: Opaque
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: apf
        type: helm
        enableOCI: "true"
        url: {{ .Values.apf.chart.repoURL | quote }}
        username: {{ `{{ .username | trim }}` | quote }}
        password: {{ `{{ .token | trim }}` | quote }}
  dataFrom:
    - extract:
        key: {{ $es.vaultPrefix }}/ghcr
{{- end }}
{{- end }}
