{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
{{- $except := include "openshell-sandbox.networkPolicyExcept" . | fromJsonArray -}}
{{- $externalPorts := include "openshell-sandbox.networkPolicyExternalPorts" . | fromJsonArray -}}
{{- $apiTargets := include "openshell-sandbox.cleanupApiTargets" . | fromJsonArray -}}
{{- $importTargets := include "openshell-sandbox.diskImportTargets" . | fromJsonArray -}}
{{- $cdiPorts := list -}}
{{- range $importTargets -}}
  {{- if not (has .port $cdiPorts) -}}{{- $cdiPorts = append $cdiPorts .port -}}{{- end -}}
{{- end -}}
{{- $globalGovernance := (.Values.global | default dict).governance | default dict -}}
{{- $engine := $globalGovernance.engine | default (.Values.governance.engine | default "interceptor") -}}
{{- if not (has $engine (list "interceptor" "apf")) -}}
  {{- fail (printf "governance engine must be interceptor or apf, not %q" $engine) -}}
{{- end -}}
{{- if not (kindIs "slice" $np.extraEgress) -}}
  {{- fail "networkPolicy.extraEgress must be a list of NetworkPolicy rules" -}}
{{- end -}}
{{- if not (kindIs "slice" $np.extraIngress) -}}
  {{- fail "networkPolicy.extraIngress must be a list of NetworkPolicy rules" -}}
{{- end -}}
{{- range $np.extraEgress -}}{{- include "openshell-sandbox.validateNetworkPolicyRule" (list "egress" .) -}}{{- end -}}
{{- range $np.extraIngress -}}{{- include "openshell-sandbox.validateNetworkPolicyRule" (list "ingress" .) -}}{{- end -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-default-deny
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-vm
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      openshell.pattern/role: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # virtctl ssh/port-forward is dialed by virt-api, not by the CLI host.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-cnv
          podSelector:
            matchLabels:
              kubevirt.io: virt-api
      ports:
        - protocol: TCP
          port: 22
    {{- if $np.allow.ingressController }}
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
          podSelector: {}
      ports:
        - protocol: TCP
          port: 17670
        - protocol: TCP
          port: 18789
        - protocol: TCP
          port: 8080
        {{- range $e := include "openshell-sandbox.sandboxUi" . | fromJsonArray }}
        - protocol: TCP
          port: {{ $e.proxyPort }}
        {{- end }}
    {{- end }}
    {{- range $np.extraIngress }}
    - {{ toYaml . | nindent 6 | trim }}
    {{- end }}
  egress:
{{ include "openshell-sandbox.commonEgressRules" (list . $externalPorts) | indent 4 }}
    {{- if and .Values.governance.enabled $np.allow.governanceInterceptor }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.governance.namespace | quote }}
          podSelector:
            matchLabels:
              {{- if eq $engine "apf" }}
              app.kubernetes.io/name: apf
              app.kubernetes.io/instance: governance-interceptor
              {{- else }}
              app.kubernetes.io/name: governance-interceptor
              {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.governance.port }}
    {{- end }}
    {{- range $np.extraEgress }}
    - {{ toYaml . | nindent 6 | trim }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-cdi-import
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      app: containerized-data-importer
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-cnv
  egress:
{{ include "openshell-sandbox.commonEgressRules" (list . $cdiPorts) | indent 4 }}
{{- if .Values.cleanupOnDelete }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-cleanup-hook
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  podSelector:
    matchLabels:
      openshell.pattern/role: cleanup
  policyTypes: [Egress]
  egress:
    # Include both the Service IP and its backends for pre/post-DNAT policy
    # evaluation. The hook uses KUBERNETES_SERVICE_HOST, not DNS.
    - to:
        - ipBlock:
            cidr: {{ printf "%s/32" .Values.cleanupApi.serviceIP | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- range $apiTargets }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
{{- end }}
