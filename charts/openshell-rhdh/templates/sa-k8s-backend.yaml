apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhdh-k8s-backend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhdh-k8s-backend
  namespace: {{ .Values.pipelines.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdh-k8s-backend
  namespace: {{ .Values.pipelines.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhdh-k8s-backend
subjects:
  - kind: ServiceAccount
    name: rhdh-k8s-backend
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhdh-catalog-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhdh-catalog-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rhdh-sandbox-entities"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhdh-catalog-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: openshell-rhdh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhdh-catalog-proxy
subjects:
  - kind: ServiceAccount
    name: rhdh-catalog-proxy
    namespace: {{ .Values.namespace }}
