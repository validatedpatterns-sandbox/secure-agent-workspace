{{- include "saw-users.validate" . -}}
{{- range $user := .Values.users | default list }}
{{- if and (not (include "saw-users.awaitingOwner" (dict "root" $ "user" $user))) (not (and $.Values.projection.enabled (has (dig "deployment" "mode" "vm" ($user.values | default dict)) (list "container" "kata")))) }}
{{- $container := has (dig "deployment" "mode" "vm" ($user.values | default dict)) (list "container" "kata") }}
{{- if $container }}{{- $user = include "saw-users.containerUser" (dict "root" $ "user" $user) | fromJson }}{{- end }}
{{- if not $container }}
---
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s-secrets" $user.name)
  "wave" $.Values.syncWave.secrets
  "path" "charts/pattern-secrets"
  "release" (printf "saw-%s-secrets" $user.name)
  "values" (include "saw-users.vaultPrefix" (dict "root" $ "user" $user))
) }}
{{- end }}
---
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s-bom" $user.name)
  "wave" $.Values.syncWave.bom
  "path" "charts/saw-bom"
  "release" (printf "saw-%s-bom" $user.name)
  "values" (include "saw-users.profiles" (dict "root" $ "user" $user))
) }}
---
{{- if $container }}
{{- $site := include "saw-users.containerSite" (dict "root" $ "user" $user) | fromJson }}
{{- $mode := dig "deployment" "mode" "vm" ($user.values | default dict) }}
{{- if ne (eq $mode "kata") (not (empty $site.kataRuntimeClass)) }}{{ fail "registration placement differs from the site RuntimeClass approval" }}{{- end }}
{{- /* Which Secret backs which provider type; OpenShell's provider profiles
       decide where each credential may be used. */}}
{{- $scope := dict "root" $ "user" $user }}
{{- $attached := include "saw-users.secretNames" $scope | fromJsonArray }}
{{- $credentials := list }}
{{- range $binding := include "saw-users.credentialBindings" $scope | fromJsonArray }}
{{- if has $binding.name $attached }}
{{- range $type := $binding.providers }}
{{- $credential := dict "secret" $binding.name "key" $binding.key "type" $type }}
{{- if $binding.refresh }}{{- $_ := set $credential "refresh" "oauth2_refresh_token" }}{{- end }}
{{- $credentials = append $credentials $credential }}
{{- end }}
{{- end }}
{{- end }}
{{- $_ := set $site "credentialBindings" $credentials }}
{{ $values := dict "owner" $user.name "ownerSubject" $user.ownerSubject "registration" $user.registration "vaultPrefix" $user.vaultPrefix "installationID" $user.installationID "intentGeneration" $user.intentGeneration "site" $site "global" $.Values.global }}
{{ include "saw-users.application" (dict "root" $ "user" $user "appName" (printf "saw-%s" $user.name) "wave" $.Values.syncWave.sandbox "path" "charts/saw-portal-container" "release" $user.name "values" (toYaml $values)) }}
{{- else }}
{{ include "saw-users.application" (dict
  "root" $
  "user" $user
  "appName" (printf "saw-%s" $user.name)
  "wave" $.Values.syncWave.sandbox
  "path" "charts/openshell-saw"
  "release" $user.name
  "ignoreVMDefaults" true
  "values" (include "saw-users.openshellValues" (dict "root" $ "user" $user))
) }}
{{- end }}
{{- end }}
{{- end }}
