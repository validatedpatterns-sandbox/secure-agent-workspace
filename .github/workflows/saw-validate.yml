name: SAW validation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: saw-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Offline contracts and Argo chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-saw-test.txt
      - name: Verify generated schema and run offline gates
        run: make saw-test-fast SAW_PYTHON=python
      - name: Render the pattern's GitOps inputs
        run: make saw-render-gitops SAW_PYTHON=python
      - name: Build guest source bundle (not a qualified VM image)
        run: python tools/saw/build_guest_bundle.py --installer-bom examples/saw/installer-bom.yaml --output "$RUNNER_TEMP/saw-guest.tar.gz"
      - name: Generate allowlisted VM image build context (no registry credentials)
        run: python tools/saw/build_image_context.py --installer-bom examples/saw/installer-bom.yaml --output "$RUNNER_TEMP/saw-image-context"
      - name: Verify guest systemd unit syntax on Linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman
          systemd-analyze verify guest/systemd/saw-guest.service guest/systemd/saw-guest-mounts.service guest/systemd/saw-openshell-gateway.service
      - name: Verify real systemd runtime visibility without exposing home directories
        run: |
          SAW_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')
          sudo env SAW_SYSTEMD_TEST=1 PYTHONDONTWRITEBYTECODE=1 "$SAW_TEST_PYTHON" -m pytest -q -p no:cacheprovider tests/saw/test_systemd_namespace.py

  saw-validate:
    if: always()
    needs: [contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every gate to pass
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
        run: test "$CONTRACT_RESULT" = success
