{{- if and .Values.snapshot.enabled (eq .Values.image.mode "snapshot") }}
{{- $snapshotAPI := "snapshot.kubevirt.io/v1beta1" }}
{{- if not (.Capabilities.APIVersions.Has "snapshot.kubevirt.io/v1beta1") }}
  {{- $snapshotAPI = "snapshot.kubevirt.io/v1alpha1" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshell-gateway.fullname" . }}-snapshot
  labels:
    {{- include "openshell-gateway.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "openshell-gateway.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openshell-gateway.fullname" . }}-snapshot
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: snapshot
          image: {{ .Values.test.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              VM_NAME="{{ include "openshell-gateway.fullname" . }}"
              SVC_NAME="{{ include "openshell-gateway.fullname" . }}-gateway"
              SNAP_NAME="snap-${VM_NAME}"
              NS="{{ .Release.Namespace }}"
              SNAPSHOT_API="{{ $snapshotAPI }}"
              TIMEOUT={{ .Values.snapshot.timeout }}

              API_SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CACERT="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              kube() {
                curl -sf --cacert "${CACERT}" -H "Authorization: Bearer ${TOKEN}" \
                  -H "Content-Type: application/json" "$@"
              }

              kube_get_vmi() {
                kube "${API_SERVER}/apis/kubevirt.io/v1/namespaces/${NS}/virtualmachineinstances/${VM_NAME}" 2>/dev/null
              }

              # --- Phase 1: Wait for VMI Running + Ready ---
              echo "Waiting up to ${TIMEOUT}s for VMI '${VM_NAME}' to become Ready..."
              elapsed=0
              while [ "${elapsed}" -lt "${TIMEOUT}" ]; do
                VMI_JSON="$(kube_get_vmi || true)"
                PHASE=$(echo "${VMI_JSON}" | tr -d ' \n\r' | grep -oE '"phase":"[^"]+"' | head -1 | cut -d'"' -f4 || true)
                READY_COND=$(echo "${VMI_JSON}" | tr -d ' \n\r' | grep -oE '\{[^}]*"type":"Ready"[^}]*\}' | head -1)
                READY=$(echo "${READY_COND}" | grep -oE '"status":"[^"]+"' | cut -d'"' -f4 || true)

                if [ "${PHASE}" = "Running" ] && [ "${READY}" = "True" ]; then
                  echo "VMI '${VM_NAME}' is Ready (${elapsed}s)"
                  break
                fi
                echo "  waiting for VMI Ready... phase=${PHASE:-unknown} ready=${READY:-false} (${elapsed}s)"
                sleep 10
                elapsed=$((elapsed + 10))
              done

              if [ "${PHASE}" != "Running" ] || [ "${READY}" != "True" ]; then
                echo "FAIL: VMI not Ready after ${TIMEOUT}s" >&2
                exit 1
              fi

              # --- Phase 2: TCP-probe gateway port ---
              echo "Waiting for gateway port ${SVC_NAME}:17670..."
              gw_elapsed=0
              while [ "${gw_elapsed}" -lt 300 ]; do
                if timeout 5 bash -c "echo > /dev/tcp/${SVC_NAME}/17670" 2>/dev/null; then
                  echo "Gateway port 17670 is open (${gw_elapsed}s)"
                  break
                fi
                echo "  waiting for gateway port... (${gw_elapsed}s)"
                sleep 10
                gw_elapsed=$((gw_elapsed + 10))
              done

              if ! timeout 5 bash -c "echo > /dev/tcp/${SVC_NAME}/17670" 2>/dev/null; then
                echo "FAIL: Gateway port 17670 not reachable after 300s" >&2
                exit 1
              fi

              # --- Phase 3: Delete existing snapshot if present ---
              echo "Checking for existing snapshot '${SNAP_NAME}'..."
              if kube "${API_SERVER}/apis/${SNAPSHOT_API}/namespaces/${NS}/virtualmachinesnapshots/${SNAP_NAME}" >/dev/null 2>&1; then
                echo "Deleting existing snapshot '${SNAP_NAME}'..."
                kube -X DELETE "${API_SERVER}/apis/${SNAPSHOT_API}/namespaces/${NS}/virtualmachinesnapshots/${SNAP_NAME}" || true
                sleep 5
              fi

              # --- Phase 4: Create VirtualMachineSnapshot ---
              echo "Creating VirtualMachineSnapshot '${SNAP_NAME}'..."
              kube -X POST "${API_SERVER}/apis/${SNAPSHOT_API}/namespaces/${NS}/virtualmachinesnapshots" -d '{
                "apiVersion": "'"${SNAPSHOT_API}"'",
                "kind": "VirtualMachineSnapshot",
                "metadata": {
                  "name": "'"${SNAP_NAME}"'",
                  "namespace": "'"${NS}"'"
                },
                "spec": {
                  "source": {
                    "apiGroup": "kubevirt.io",
                    "kind": "VirtualMachine",
                    "name": "'"${VM_NAME}"'"
                  }
                }
              }'

              # --- Phase 5: Wait for snapshot readyToUse ---
              echo "Waiting for snapshot '${SNAP_NAME}' to become readyToUse..."
              snap_elapsed=0
              while [ "${snap_elapsed}" -lt 600 ]; do
                READY_TO_USE=$(kube "${API_SERVER}/apis/${SNAPSHOT_API}/namespaces/${NS}/virtualmachinesnapshots/${SNAP_NAME}" \
                  | tr -d ' \n\r' | grep -oE '"readyToUse":(true|false)' | head -1 | cut -d: -f2 || true)

                if [ "${READY_TO_USE}" = "true" ]; then
                  echo "Snapshot '${SNAP_NAME}' is readyToUse (${snap_elapsed}s)"
                  break
                fi
                echo "  waiting for snapshot readyToUse... (${snap_elapsed}s)"
                sleep 10
                snap_elapsed=$((snap_elapsed + 10))
              done

              if [ "${READY_TO_USE}" != "true" ]; then
                echo "FAIL: Snapshot not readyToUse after 600s" >&2
                exit 1
              fi

              # --- Phase 6: Stop the gateway VM (no longer needed after snapshot) ---
              echo "Stopping gateway VM '${VM_NAME}' (sandboxes will be created from snapshot)..."
              kube -X PATCH "${API_SERVER}/apis/kubevirt.io/v1/namespaces/${NS}/virtualmachines/${VM_NAME}" \
                -H "Content-Type: application/merge-patch+json" \
                -d '{"spec":{"runStrategy":"Halted"}}' || echo "WARN: could not stop VM"

              echo "=== Snapshot '${SNAP_NAME}' created and gateway VM stopped ==="
{{- end }}
