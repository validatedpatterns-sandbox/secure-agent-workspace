{{- if and .Values.openshellSaw.tenant.name .Values.openshellSaw.createNamespace }}{{- $cfg := .Values.openshellSaw }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openshell-saw.namespace" $cfg }}
  labels: {app.kubernetes.io/managed-by: argocd, pod-security.kubernetes.io/enforce: restricted}
  annotations: {argocd.argoproj.io/sync-options: Prune=false,Delete=false, saw.redhat.com/enrollment-identity: {{ include "openshell-saw.identity" $cfg | quote }}}
{{- end }}
