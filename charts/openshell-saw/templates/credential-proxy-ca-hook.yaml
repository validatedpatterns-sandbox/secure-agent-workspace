{{- $name := "saw-credential-proxy-ca-hook" -}}
{{- $annotations := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" "argocd.argoproj.io/hook" "PreSync" "argocd.argoproj.io/hook-delete-policy" "BeforeHookCreation,HookSucceeded" -}}
{{- $apiTargets := include "openshell-sandbox.cleanupApiTargets" . | fromJsonArray -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20" "argocd.argoproj.io/sync-wave" "-20") $annotations) | nindent 4 }}
spec:
  podSelector:
    matchLabels: {openshell.pattern/role: credential-proxy-ca-hook}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: {{ printf "%s/32" .Values.cleanupApi.serviceIP | quote }}}
      ports: [{protocol: TCP, port: 443}]
    {{- range $apiTargets }}
    - to:
        - ipBlock: {cidr: {{ .cidr | quote }}}
      ports: [{protocol: TCP, port: {{ .port }}}]
    {{- end }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-15" "argocd.argoproj.io/sync-wave" "-15") $annotations) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-15" "argocd.argoproj.io/sync-wave" "-15") $annotations) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [saw-credential-proxy-ca]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [saw-proxy-ca]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-15" "argocd.argoproj.io/sync-wave" "-15") $annotations) | nindent 4 }}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}, namespace: {{ .Release.Namespace }}}
roleRef:
  {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ $name }}
  labels: {openshell.pattern/role: credential-proxy-ca-hook}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-10" "argocd.argoproj.io/sync-wave" "-10") $annotations) | nindent 4 }}
spec:
  restartPolicy: OnFailure
  serviceAccountName: {{ $name }}
  securityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: init-ca
      image: {{ .Values.credentialProxy.image | quote }}
      args: [init-ca]
      env:
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - {name: SAW_CA_SECRET_NAME, value: saw-credential-proxy-ca}
        - {name: SAW_CA_CONFIGMAP_NAME, value: saw-proxy-ca}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
