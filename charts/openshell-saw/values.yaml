# Required — must be set at install time. Maximum 19 characters (OpenShell limit).
sandboxName: ""
# Operator SSH access (used by `make openshell-saw-configure-gateway` to fetch
# the gateway CA). Provisioning does not use SSH. Keys are provisioned
# dynamically by KubeVirt accessCredentials through the qemu guest agent:
# updating the Secret updates cloud-user's authorized_keys in the running VM.
# https://kubevirt.io/user-guide/user_workloads/accessing_virtual_machines/
#
# The chart creates an empty <name>-ssh-pubkey Secret for this;
# `make openshell-saw-vm-ssh` adds your key to it when you need a shell.
# Or name an existing Secret instead (every value in it is a public key):
sshPublicKeySecret: ""
# Optional: seed the chart-created Secret with one key (key1).
sshPublicKey: ""

# VM root disk source. The disk is made once, when it does not exist; changing
# the source later does not touch an existing VM's disk. Nothing runs in the
# namespace for it (no Job): KubeVirt and CDI import or clone it.
#
# 1. Registry (default): import the golden image into the VM's own disk.
#    Without registryURL, the internal registry's
#    <dataSourceNamespace>/openshell-gateway:latest (make copy-images, or the
#    openshell-gateway-image build); the namespace may pull it from there.
#      source:
#        registryURL: "docker://quay.io/rh-ai-quickstart/openshell-gateway@sha256:<digest>"
#
# 2. DataSource: clone a golden image DataSource that already exists (the
#    openshell-gateway-image chart's goldenImage, or a CDI DataImportCron).
#      source:
#        dataSource: openshell-gateway
#        dataSourceNamespace: openshell-agents
#
# 3. HTTP: download a qcow2 disk image from a URL. An http(s) host is added
#    to the namespace egress firewall unless that host and port are already
#    allowed. A host inside the cluster needs no entry.
#      source:
#        httpURL: "https://example.com/openshell-gateway.qcow2"
source:
  # Set to clone this DataSource instead of importing (mode 2).
  dataSource: ""
  # The shared namespace of the golden image (its DataSource, or its image
  # in the internal registry).
  dataSourceNamespace: "openshell-agents"
  # Older name for registryURL.
  goldenImageURL: ""
  internalRegistry: "image-registry.openshift-image-registry.svc:5000"
  # CDI pull method: "node" (the node's runtime pulls, trusts the internal
  # registry's CA, caches the image) or "pod" (the CDI importer pod).
  pullMethod: "node"
  registryURL: ""
  httpURL: ""

vm:
  cores: 4
  memory: 8Gi
  diskSize: 40Gi
  # Share the installer ConfigMap, profiles, and provider Secrets over
  # virtiofs so a change is visible without restarting the VM. Off until
  # the guest units from a new cloud-init are in place: turning it on
  # requires recreating the VM. Disks, VM size, and cloud-init still restart.
  liveInputs: false
  # Mark the VMI Ready only after the in-guest installer finished both steps.
  # Uses a guest-agent exec probe (`test -f /var/lib/saw/ready`). Off by
  # default: it needs qemu-guest-agent with guest-exec allowed in the image.
  readinessProbe: false

# Versioned Bill of Materials for the software installed inside the VM.
# The in-guest installer (files/installer/apply_bom.py) pulls each image by
# digest, copies the binary out, checks its version and installs it.
# Change this block to upgrade; the VM applies it on its next restart
# (`virtctl restart <vm>`). Images must be pinned by digest.
bom:
  apiVersion: saw.redhat.com/v1alpha1
  kind: InstallerBOM
  metadata:
    name: openshell-0-1-2-rhaiv-0
  spec:
    installerVersion: 0.1.0
    # OpenShell 0.1.x. Moving from 0.0.x recreates the gateway state and
    # every sandbox (the installer does it; see docs/versioned-bom-installer.md).
    openshell:
      cli:
        version: 0.1.2-rhaiv.0
        image: quay.io/opendatahub/odh-openshell-cli@sha256:7d04766147c6960da7d06580f3efd6538679d147aa3b0cd364993c534c3a6c7b
      gateway:
        version: 0.1.2-rhaiv.0
        image: quay.io/opendatahub/odh-openshell-gateway@sha256:c3b230a32245d0a6c35ed11c17cf590da9ede79dfb0378e3829e16709f63fba3
      supervisor:
        version: 0.1.2-rhaiv.0
        image: quay.io/opendatahub/odh-openshell-supervisor@sha256:0179eb17dcc0098d3fce360035c0be0c26a39949ce09a397c7c259bf728170ff
      # Sandbox runtime image: the podman driver mounts the supervisor from it
      # into every sandbox (gateway.toml sandbox_runtime_image). Pulled, not
      # extracted.
      sandbox:
        version: 0.1.2-rhaiv.0
        image: quay.io/opendatahub/odh-openshell-sandbox@sha256:283838f9787bdd876ec8f110a5d5b5c752082a410f75173f0abf2533ae651989
    # NemoClaw CLI, needed by `type: nemoclaw` sandboxes (the default
    # data-science profile has one). Remove it if no profile needs it.
    # A tag is accepted here with a warning; pin a digest when one exists.
    nemoclaw:
      cliImage: quay.io/rh-ai-quickstart/nemoclaw-cli:latest

# OpenShell gateway runtime configuration inside the VM.
openshell:
  # Bind address for the `openshell-gateway` listener. Keep 0.0.0.0 for
  # remote CLI access via the route; 127.0.0.1 restricts it to the VM.
  bindAddress: "0.0.0.0"

# Container runtime inside the gateway VM. Stage 1 supports podman only.
containerRuntime: podman

# Image and installer-bundle signature checks. warn records an unsigned
# component and still installs it. enforce refuses the install. off skips
# the check. enforce also requires trustKeys or a keyless identity below:
# the public keys themselves live in the golden image at /etc/saw/trust,
# not in this namespace.
signing:
  mode: warn
  trustKeys: []
  identity: ""
  issuer: ""

# Cosign check for harnessRef.image (keyless, same OIDC identity as
# .github/workflows/harness-bundles.yml). Empty identity/issuer refuses
# image-sourced harnesses. Inline ConfigMap bundles skip this.
harness:
  cosign:
    identity: ""
    issuer: "https://token.actions.githubusercontent.com"

# Dropping an object from a SAW-BOM profile. report only logs what would be
# deleted. on deletes it. Sandboxes are kept unless sandboxes is true, because
# they hold user work. This is not pruneOnRemove (that deletes a user's VM).
prune:
  mode: report
  sandboxes: false

# If a BOM profile's sandbox image lives in this cluster's internal registry,
# the VM's rootless Podman pulls it without credentials. This grants
# system:image-puller to system:unauthenticated, scoped to this namespace.
internalRegistry:
  allowAnonymousPull: false

# Provider credential Secrets. Every `credentialSecret:` named in a SAW-BOM
# profile must be listed here (or be inference.secretName). The VM waits
# until each listed Secret exists. A Secret that changes after boot still
# needs a VM restart (`vm.liveInputs` shares the files over virtiofs instead).
inference:
  secretName: "inference"
additionalProviderSecrets:
  - web-search

# Keycloak/OIDC for end users. The gateway accepts OIDC bearer tokens from
# users (roles from realm_access.roles) and mTLS from the local installer.
# The installer never logs in to Keycloak.
oidc:
  issuerUrl: ""
  clientId: "openshell-cli"
  keycloakName: "openshell-keycloak"
  # Namespace Keycloak runs in (any namespace works). Used to compute the
  # issuer URL from global.clusterDomain and to find its admin Secret.
  keycloakNamespace: "saw-keycloak"
  realm: "openshell"
  rolesClaim: "realm_access.roles"
  adminRole: "openshell-admin"
  userRole: "openshell-user"

# Sandbox owner. `owner` is used for labels; `ownerSubject` is the owner's
# OIDC subject (`openshell whoami`) and, when set, is added as admin to every
# workspace the installer creates.
accessControl:
  owner: ""
  ownerSubject: ""

# Expose the sandbox gateway and dashboards via OpenShift Routes.
route:
  enabled: true
  host: ""
  dashboard: true
  webui: true
  # Hostname of the webui route, used for the dashboard's OAuth redirect.
  # Computed from global.clusterDomain when empty.
  webuiHost: ""
  # Hostname of the dashboard route (openclaw control UI allowed origin).
  # Computed from global.clusterDomain when empty.
  dashboardHost: ""

# Sandbox web UIs (OpenClaw / NemoClaw control UI) on their own routes. The
# saw-users chart fills the list from the user's SAW-BOM profiles (sandboxes
# with ui.route: true): [{workspace, sandbox, proxyPort, forwardPort}]. For
# each, the VM runs `openshell forward service` from forwardPort to the
# sandbox's targetPort and an oauth2-proxy on proxyPort (Keycloak, client
# dashboard.clientId), and the route <vm>-<workspace>-<sandbox>-ui sends to
# that proxy. Only the owner (accessControl.owner, matched against the
# Keycloak preferred_username) and allowedUsers get through. The ports are
# VM interface ports, so changing the list takes a VM restart.
sandboxUi: []
sandboxUiProxy:
  targetPort: 18789
  allowedUsers: []
  # OpenClaw's trusted-proxy auth: the sandbox's gateway takes the user from
  # the oauth2-proxy's X-Forwarded-User (allowed: the same users) instead of
  # asking for its gateway token, and approves their UI devices. Only
  # requests from `cidrs` are trusted; the forward arrives over loopback.
  # The CLI and TUI in the sandbox use the gateway secret as a password.
  # Off: the UI asks for the token (make sandbox-ui prints it).
  trustedProxy:
    enabled: true
    cidrs: ["127.0.0.1/32", "::1/128"]
    deviceAutoApprove: true

# OpenShell Dashboard + oauth2-proxy, run inside the VM by the installer.
# Needs oidc.issuerUrl (or global.clusterDomain) and a known webui host.
dashboard:
  enabled: true
  image: "quay.io/gkrumbach07/openshell-dashboard:latest"
  proxyImage: "quay.io/oauth2-proxy/oauth2-proxy:v7.9.0"
  clientId: "openshell-dashboard"
  insecureSkipIssuerTlsVerify: false

# Governance interceptor — enforces signed sandbox policies.
# A sandbox with a SAW-BOM harnessRef mounts its harness volume through
# caller driver config (`sandbox create --driver-config-json`), which
# OpenShell 0.1.x refuses unless the gateway sets allow_driver_config. The
# gateway keeps resource admission on and bind mounts off, so a caller can
# only attach a podman volume labelled openshell.ai/sandbox-attachable for
# its own workspace (the installer labels each harness volume that way);
# image and host-path mounts stay refused. Default off: turning it on lets
# any signed-in user attach a labelled volume to a sandbox they create, so
# set true only when a selected profile has a sandbox with a harnessRef
# (e.g. saw-bom's harnessEnabled). The installer fails fast with a clear error
# if a harnessRef is applied while this is off.
allowDriverConfig: false

governance:
  enabled: true
  # Shared namespace where the governance-interceptor chart runs. SAWs live in
  # their own namespaces, so the default endpoint points here.
  namespace: "openshell-agents"
  endpoint: ""
  port: 18081
  allowInsecureTransport: true
  failurePolicy: "fail_closed"
  timeout: "500ms"

# Delete the VM and its disks when this release is deleted (a pre-delete
# hook; Argo CD runs it when the Application is deleted, too). The pattern's
# saw-users chart sets this from each user's pruneOnRemove, so removing a
# user from the list keeps their VM unless pruneOnRemove is true.
cleanupOnDelete: true

# The pre-delete cleanup pod (cleanupOnDelete). There is no prepare Job.
job:
  image: "registry.fedoraproject.org/fedora:44"

# Each SAW is installed into its own namespace (the release namespace), e.g.
# saw-<name>. Label that namespace openshell.pattern/saw=true so the shared
# governance interceptor accepts its VM (make openshell-saw-create does this).

# Default-deny egress for every pod in the sandbox namespace, including the
# VM. OpenShell's own allowlist is a separate layer and does not replace this.
# Exact hostnames only: a wildcard needs the DNSNameResolver feature gate.
# The Keycloak route host is added automatically from the OIDC issuer URL.
# Add an enterprise system or a custom inference host under extraAllow
# (pattern: defaults.openshellSaw.egress.extraAllow, or one user's values).
# A host inside the cluster (*.svc) needs no entry.
egress:
  enabled: true
  allow:
    # Registries the VM pulls from. Quay redirects blobs to the cdn hosts.
    - quay.io
    - cdn.quay.io
    - cdn01.quay.io
    - cdn02.quay.io
    - cdn03.quay.io
    - cdn04.quay.io
    - cdn05.quay.io
    - cdn06.quay.io
    - registry.fedoraproject.org
    # Exact hosts from charts/governance-policy/profiles. A test fails if a
    # shipped profile grows a host that is not listed here.
    # *-aiplatform.googleapis.com is not here: a dnsName rule cannot express it.
    - integrate.api.nvidia.com
    - api.search.brave.com
    - api.openai.com
    - api.tavily.com
    - registry.npmjs.org
    - github.com
    - api.github.com
    - api-1.github.com
    - slack.com
    - generativelanguage.googleapis.com
    - cloudcode-pa.googleapis.com
    - accounts.google.com
    - oauth2.googleapis.com
    - www.googleapis.com
    - iamcredentials.googleapis.com
  extraAllow: []
