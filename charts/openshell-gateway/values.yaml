# Required — must be set at install time.
sshPublicKey: ""

vm:
  cores: 4
  memory: 8Gi
  diskSize: 40Gi

openshell:
  version: "0.0.89"
  fedoraRelease: "44"

image:
  containerDisk: ""  # Required. e.g., "image-registry.openshift-image-registry.svc:5000/openshell-agents/openshell-gateway:latest"
  sandbox: "image-registry.openshift-image-registry.svc:5000/openshell-agents/nemoclaw-sandbox:latest"
  nemoclawCli: "image-registry.openshift-image-registry.svc:5000/openshell-agents/nemoclaw-cli:latest"
  supervisor: "ghcr.io/nvidia/openshell/supervisor:latest"

test:
  enabled: true
  image: registry.fedoraproject.org/fedora:44
  vmiTimeout: 600
  gatewayTimeout: 300

oidc:
  enabled: false
  issuerUrl: ""
  clientId: "openshell-cli"
  rolesClaim: "realm_access.roles"
  adminRole: "openshell-admin"
  userRole: "openshell-user"
  jwksTtlSecs: 3600
