{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-interceptor-policy
  labels:
    app.kubernetes.io/name: governance-policy
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  policy.yaml: |
{{ .Files.Get "policy.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-interceptor-profiles
  labels:
    app.kubernetes.io/name: governance-policy
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
{{- range $path, $_ := .Files.Glob "profiles/*.yaml" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- if .Values.customEndpointHost }}
  openai.yaml: |
    display_name: Custom vLLM / OpenAI-compatible Endpoint
    description: Self-hosted vLLM or any OpenAI-compatible inference endpoint
    provider_type: openai
    credentials:
      - name: api_key
        description: Custom endpoint API key
        env_vars: [OPENAI_API_KEY]
        required: true
        auth_style: bearer
        header_name: authorization
    endpoints:
      - host: {{ .Values.customEndpointHost }}
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-write
    binaries:
      - /usr/local/bin/node
      - /usr/bin/curl
    inference_capable: false
{{- end }}
{{- end }}
