id: calendar
display_name: Calendar
description: Read-only Radicale calendar (CalDAV/HTTP) access for governed sandbox agents
# Interceptor category enum only allows: other, inference, agent,
# source_control, messaging, data, knowledge — calendar content maps to knowledge.
category: knowledge
# Radicale runs auth-free in the demo, so no credentials key is declared
# (same precedent as mailpit.yaml).
endpoints:
  - host: radicale.openshell-agents.svc.cluster.local
    port: 5232
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  # OpenClaw's node: /usr/bin/node-<major> in the Hummingbird image
  # (/usr/bin/node links to it; the real path is what is matched),
  # /usr/local/bin/node in the NemoClaw image.
  - /usr/bin/node
  - /usr/bin/node-*
  - /usr/local/bin/node
