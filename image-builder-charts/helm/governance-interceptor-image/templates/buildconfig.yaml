apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .Values.build.name | quote }}
spec:
  source:
    configMaps:
      - configMap: {name: {{ .Values.build.name }}-source}
        destinationDir: saw-extension
    type: Dockerfile
    dockerfile: |
{{ .Files.Get "files/Dockerfile" | indent 6 }}
  strategy:
    type: Docker
    dockerStrategy:
      forcePull: true
      buildArgs:
        - name: BUILDER_IMAGE
          value: {{ .Values.build.builderImage | quote }}
        - name: RUNTIME_IMAGE
          value: {{ .Values.build.runtimeImage | quote }}
        - name: OPENSHELL_URI
          value: {{ .Values.source.git.uri | quote }}
        - name: OPENSHELL_REF
          value: {{ .Values.source.git.ref | quote }}
        - name: CONTEXT_DIR
          value: {{ .Values.build.contextDir | quote }}
  output:
    {{- if .Values.output.imageStreamTag }}
    # Into this cluster's internal registry (no external push access needed).
    to:
      kind: ImageStreamTag
      name: {{ .Values.output.imageStreamTag }}
    {{- else }}
    to:
      kind: DockerImage
      name: {{ .Values.output.externalImage }}
    pushSecret:
      name: {{ .Values.output.pushSecretName }}
    {{- end }}
  resources:
    limits:
      memory: 4Gi
  {{- if .Values.build.configChangeTrigger }}
  triggers:
    - type: ConfigChange
  {{- else }}
  triggers: []
  {{- end }}
