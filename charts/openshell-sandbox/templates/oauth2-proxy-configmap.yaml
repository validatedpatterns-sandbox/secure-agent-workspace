{{- if .Values.accessControl.enabled }}
{{- if not .Values.accessControl.owner }}
{{- fail "accessControl.owner is required when accessControl.enabled is true" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr info;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      resolver local=on;
      lua_shared_dict jwks_cache 1m;

      {{- $oidcIssuer := include "openshell-sandbox.oidcIssuerUrl" . }}
      server {
        listen 4180;

        location /healthz {
          access_log off;
          return 200 "ok";
        }

        # Internal subrequest location for Keycloak userinfo validation.
        # Validates the access token server-side (signature, expiry, issuer)
        # and returns user claims including preferred_username.
        location = /_validate_token {
          internal;
          proxy_method GET;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Authorization $http_authorization;
          set $userinfo_url "{{ printf "%s/protocol/openid-connect/userinfo" $oidcIssuer }}";
          proxy_pass $userinfo_url;
          proxy_ssl_verify off;
        }

        location / {
          access_by_lua_block {
            local allowed_user = {{ .Values.accessControl.owner | quote }}
            local cjson = require("cjson.safe")

            -- Extract Bearer token
            local auth = ngx.var.http_authorization
            if not auth then
              ngx.status = 401
              ngx.header["Content-Type"] = "application/json"
              ngx.say('{"error":"missing Authorization header"}')
              return ngx.exit(401)
            end

            local token = auth:match("^[Bb]earer%s+(.+)$")
            if not token then
              ngx.status = 401
              ngx.header["Content-Type"] = "application/json"
              ngx.say('{"error":"invalid Authorization header"}')
              return ngx.exit(401)
            end

            -- Validate token via Keycloak userinfo endpoint.
            -- Keycloak verifies signature, expiry, issuer, and audience server-side.
            -- Returns user claims if the token is valid; 401 if invalid/expired.
            local res = ngx.location.capture("/_validate_token")

            if not res or res.status ~= 200 then
              ngx.status = 401
              ngx.header["Content-Type"] = "application/json"
              ngx.say('{"error":"token is invalid or expired"}')
              return ngx.exit(401)
            end

            local userinfo = cjson.decode(res.body)
            if not userinfo then
              ngx.status = 401
              ngx.header["Content-Type"] = "application/json"
              ngx.say('{"error":"invalid userinfo response"}')
              return ngx.exit(401)
            end

            -- Token is valid — now check ownership
            local username = userinfo["preferred_username"] or ""
            if username ~= allowed_user then
              ngx.log(ngx.WARN, "access denied: user=", username, " allowed=", allowed_user)
              ngx.status = 403
              ngx.header["Content-Type"] = "application/json"
              ngx.say('{"error":"forbidden","user":"' .. username .. '"}')
              return ngx.exit(403)
            end
          }

          proxy_pass https://{{ include "openshell-sandbox.fullname" . }}-gateway:18789;
          proxy_ssl_verify off;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Authorization $http_authorization;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
{{- end }}
