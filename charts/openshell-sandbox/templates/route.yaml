{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-gateway
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    {{- if .Values.accessControl.enabled }}
    name: {{ include "openshell-sandbox.fullname" . }}-auth-proxy
    {{- else }}
    name: {{ include "openshell-sandbox.fullname" . }}-gateway
    {{- end }}
    weight: 100
  port:
    {{- if .Values.accessControl.enabled }}
    targetPort: proxy
    {{- else }}
    targetPort: gateway
    {{- end }}
  tls:
    {{- if .Values.accessControl.enabled }}
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
    {{- else }}
    termination: passthrough
    {{- end }}
{{- end }}
