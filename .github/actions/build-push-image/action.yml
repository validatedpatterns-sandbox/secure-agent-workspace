name: Build and push image
description: >-
  Shared tail for the container image builds: buildx setup, ghcr.io login, and a
  gated build/push (publish only on main) with GitHub Actions layer cache.
  Callers do their own checkout / values.yaml read / upstream clone as normal
  steps before calling this.

inputs:
  image_name:
    description: Image name published under ghcr.io/<owner>/
    required: true
  context:
    description: Build context path
    required: true
  dockerfile:
    description: Dockerfile path. Empty -> <context>/Dockerfile.
    required: false
    default: ""
  build_args:
    description: Newline-separated docker build args
    required: false
    default: ""
  cache_scope:
    description: GitHub Actions cache scope for this image
    required: true
  registry_token:
    description: Token for ghcr.io login (pass secrets.GITHUB_TOKEN)
    required: true
  extra_tag:
    description: Optional extra tag pushed with :latest and :sha-<commit> (e.g. the upstream version)
    required: false
    default: ""
  platform:
    description: >-
      One platform to build (e.g. linux/arm64) on a runner of that architecture.
      The image is pushed by digest only, and the digest uploaded as an artifact
      for the merge-image action to join into one multi-arch tag. Empty -> build
      for the runner's platform and push the tags directly.
    required: false
    default: ""

outputs:
  digest:
    description: Digest of the pushed single-platform image (platform builds only)
    value: ${{ steps.digest-build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Lowercase image owner, tag list
      id: meta
      shell: bash
      run: |
        owner=${OWNER,,}
        echo "owner=$owner" >> "$GITHUB_OUTPUT"
        {
          echo "tags<<EOF"
          echo "ghcr.io/$owner/$IMAGE:latest"
          echo "ghcr.io/$owner/$IMAGE:sha-$SHA"
          if [ -n "$EXTRA_TAG" ]; then echo "ghcr.io/$owner/$IMAGE:$EXTRA_TAG"; fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
      env:
        OWNER: ${{ github.repository_owner }}
        IMAGE: ${{ inputs.image_name }}
        SHA: ${{ github.sha }}
        EXTRA_TAG: ${{ inputs.extra_tag }}

    - uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}

    - name: Build and push ${{ inputs.image_name }}
      id: build
      if: inputs.platform == ''
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build_args }}
        push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }},ignore-error=true
        provenance: false

    - uses: ./.github/actions/verify-public-image
      if: ${{ inputs.platform == '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      with:
        image: ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image_name }}:sha-${{ github.sha }}

    - name: Platform suffix
      if: inputs.platform != ''
      id: plat
      shell: bash
      run: echo "suffix=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"
      env:
        PLATFORM: ${{ inputs.platform }}

    - name: Build and push ${{ inputs.image_name }} (${{ inputs.platform }}) by digest
      if: inputs.platform != ''
      id: digest-build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build_args }}
        platforms: ${{ inputs.platform }}
        tags: ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image_name }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}-${{ steps.plat.outputs.suffix }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-${{ steps.plat.outputs.suffix }},ignore-error=true
        provenance: false

    - name: Record digest
      if: inputs.platform != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      env:
        DIGEST: ${{ steps.digest-build.outputs.digest }}

    - uses: actions/upload-artifact@v4
      if: inputs.platform != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      with:
        name: digests-${{ inputs.image_name }}-${{ steps.plat.outputs.suffix }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
