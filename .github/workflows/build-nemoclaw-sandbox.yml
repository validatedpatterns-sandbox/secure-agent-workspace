name: Build and push nemoclaw-sandbox image

on:
  push:
    branches: [main]
    paths:
      - .github/actions/build-push-image/**
      - .github/actions/verify-public-image/**
      - .github/workflows/build-nemoclaw-sandbox.yml
      - image-builder-charts/helm/nemoclaw-imagestream/**
  pull_request:
    paths:
      - .github/actions/build-push-image/**
      - .github/actions/verify-public-image/**
      - .github/workflows/build-nemoclaw-sandbox.yml
      - image-builder-charts/helm/nemoclaw-imagestream/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-nemoclaw-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native build per architecture (no QEMU), each pushed by digest; the
  # merge job joins them into one multi-arch :latest / :sha-<commit> tag.
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Read build parameters from values.yaml
        id: params
        run: |
          VALUES="image-builder-charts/helm/nemoclaw-imagestream/values.yaml"
          echo "git_ref=$(yq '.source.git.ref' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "git_uri=$(yq '.source.git.uri' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "target_arch=$(yq '.build.targetArch' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "discovery_node_version=$(yq '.build.discoveryNodeVersion' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "base_image=$(yq '.build.baseImage' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "model=$(yq '.build.model' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "inference_base_url=$(yq '.build.inferenceBaseUrl' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "inference_api=$(yq '.build.inferenceApi' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "context_window=$(yq '.build.contextWindow' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "max_tokens=$(yq '.build.maxTokens' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "reasoning=$(yq '.build.reasoning' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "tool_disclosure=$(yq '.build.toolDisclosure' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "agent_timeout=$(yq '.build.agentTimeout' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          echo "web_search_enabled=$(yq '.build.webSearchEnabled' "$VALUES")" \
            >> "$GITHUB_OUTPUT"
          # otelEnabled is optional — default to empty when not configured
          echo "otel_enabled=$(yq '.build.otelEnabled // ""' "$VALUES")" \
            >> "$GITHUB_OUTPUT"

      # git_uri/git_ref come from values.yaml, which a PR can modify — pass them
      # through env and quote them so a crafted ref/uri can't inject commands.
      - name: Clone NemoClaw at pinned ref
        env:
          GIT_URI: ${{ steps.params.outputs.git_uri }}
          GIT_REF: ${{ steps.params.outputs.git_ref }}
        run: |
          UPSTREAM_DIR="${RUNNER_TEMP}/nemoclaw-src"
          mkdir -p "${UPSTREAM_DIR}"
          cd "${UPSTREAM_DIR}"
          git init -q
          git remote add origin "${GIT_URI}"
          git fetch --depth 1 origin "${GIT_REF}"
          git checkout -q FETCH_HEAD
          echo "UPSTREAM_DIR=${UPSTREAM_DIR}" >> "${GITHUB_ENV}"

      - name: Inject reviewed runtimes into build context
        run: |
          mkdir -p "${UPSTREAM_DIR}/tools/mcp-tool-discovery-runtime/reviewed-runtime-bundle/mcp-tool-discovery"
          cp image-builder-charts/helm/nemoclaw-imagestream/files/install-reviewed-runtime.sh \
            "${UPSTREAM_DIR}/tools/mcp-tool-discovery-runtime/"
          cp image-builder-charts/helm/nemoclaw-imagestream/files/discovery-runtime/package*.json \
            "${UPSTREAM_DIR}/tools/mcp-tool-discovery-runtime/"
          cp image-builder-charts/helm/nemoclaw-imagestream/files/discovery-runtime/tsconfig.json \
            "${UPSTREAM_DIR}/tools/mcp-tool-discovery-runtime/"
          mkdir -p "${UPSTREAM_DIR}/agents/openclaw/mcporter-runtime"
          cp image-builder-charts/helm/nemoclaw-imagestream/files/mcporter-runtime/package*.json \
            "${UPSTREAM_DIR}/agents/openclaw/mcporter-runtime/"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.params.outputs.discovery_node_version }}

      - name: Build and audit the shared discovery runtime
        run: |
          cd "${UPSTREAM_DIR}/tools/mcp-tool-discovery-runtime"
          export NEMOCLAW_MCP_REVIEWED_ARTIFACT=1
          export NEMOCLAW_MCP_BUNDLE_FILENAME=mcp-tool-discovery.bundle
          export NEMOCLAW_MCP_BUNDLE_OUTPUT_DIR=reviewed-runtime-bundle/mcp-tool-discovery
          sh install-reviewed-runtime.sh

      # dockerfile omitted -> use the upstream checkout's own Dockerfile.
      - uses: ./.github/actions/build-push-image
        with:
          image_name: nemoclaw-sandbox
          context: ${{ env.UPSTREAM_DIR }}
          cache_scope: nemoclaw-sandbox
          build_args: |
            BASE_IMAGE=${{ steps.params.outputs.base_image }}
            NEMOCLAW_MODEL=${{ steps.params.outputs.model }}
            NEMOCLAW_INFERENCE_BASE_URL=${{ steps.params.outputs.inference_base_url }}
            NEMOCLAW_INFERENCE_API=${{ steps.params.outputs.inference_api }}
            NEMOCLAW_CONTEXT_WINDOW=${{ steps.params.outputs.context_window }}
            NEMOCLAW_MAX_TOKENS=${{ steps.params.outputs.max_tokens }}
            NEMOCLAW_REASONING=${{ steps.params.outputs.reasoning }}
            NEMOCLAW_TOOL_DISCLOSURE=${{ steps.params.outputs.tool_disclosure }}
            NEMOCLAW_AGENT_TIMEOUT=${{ steps.params.outputs.agent_timeout }}
            NEMOCLAW_WEB_SEARCH_ENABLED=${{ steps.params.outputs.web_search_enabled }}
            NEMOCLAW_OPENCLAW_OTEL=${{ steps.params.outputs.otel_enabled }}
          platform: ${{ matrix.platform }}
          registry_token: ${{ secrets.GITHUB_TOKEN }}

  merge:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/merge-image
        with:
          image_name: nemoclaw-sandbox
          registry_token: ${{ secrets.GITHUB_TOKEN }}
