version: 1

filesystem_policy:
  include_workdir: true
  # /opt/openclaw: where the AIPCC OpenClaw image installs OpenClaw. Only that
  # directory, not all of /opt.
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /opt/openclaw]
  # --gpu controls CDI device attachment. best_effort skips GPU paths that
  # are absent in CPU-only sandboxes; this does not attach devices itself.
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /dev/nvidiactl
    - /dev/nvidia-uvm
    - /dev/nvidia-uvm-tools
    - /dev/nvidia0
    - /dev/nvidia-caps

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox
