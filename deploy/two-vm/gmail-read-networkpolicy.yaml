apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: saw-integrations-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: saw-integrations
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: saw-agent
      ports:
        - port: 18080
          protocol: TCP
    - ports:
        - port: 22
          protocol: TCP
