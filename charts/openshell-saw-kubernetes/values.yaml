deployment:
  mode: container

# Explicit opt-in: chart readiness is gateway readiness, not SAW feature parity.
kubernetes:
  experimental: false
  # Kata VMs can need more time than the stock OpenShell startup windows.
  # The chart applies these values only when deployment.mode is kata.
  startupTimeouts:
    provisioningRepairWindowSeconds: 900
    runtimeBootstrapGraceSeconds: 900
    sandboxAttachRequestTimeoutSeconds: 900
  gateway:
    version: 0.1.10-rhaiv.0
    image: quay.io/opendatahub/odh-openshell-gateway@sha256:e4b89770ef55238cc45d9880614eda64b8ab9a76be5e6c81c63a350889eb0717
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
  supervisor:
    image: quay.io/opendatahub/odh-openshell-supervisor@sha256:c2c8e9d3d19a1612074df0f637078064cff45b92d35c74b116a72fb503b3c1bc
  workload:
    # Application image; set to an approved immutable sandbox image.
    image: ""
    # TEMPORARY carry (openshell-sandbox-carry/): the official
    # odh-openshell-sandbox v0.1.10-rhaiv.0 panics on every connect on RHEL 9.
    # Keep equal to saw-portal-container driverDefaults.runtimeImage.
    runtimeImage: ghcr.io/sauagarwa/saw-openshell-sandbox@sha256:402b9727a690e8c8a10fb10c0cee21e96ea034b652d6c7d5b3f06eba916c9881
    runtimeClassName: ""
  identity:
    # Existing, retained identity; generated once outside Helm by its owner.
    # server TLS: tls.crt,tls.key,ca.crt; client CA: ca.crt only mounted.
    serverTlsSecret: ""
    clientCaSecret: ""
    # signing.pem, public.pem, kid
    jwtSecret: ""
    # key: key-encryption-key (stock gateway format)
    credentialKeySecret: ""
  storage:
    # Empty uses the cluster's default StorageClass, as upstream OpenShell
    # does for the gateway and workspace volumes. Use a block-backed class.
    className: ""
    gatewaySize: 5Gi
    workspaceSize: 20Gi
    # Prefer an independently owned retained claim for existing state.
    existingGatewayClaim: ""
  imagePullSecrets: []
  # Only CA certificates are published into the runtime namespace.
  proxy:
    url: ""
    caConfigMap: ""
  # Reviewed stock governance endpoint, reached through declared egress.
  governance:
    endpoint: ""
  network:
    # All gateway egress is explicit: DNS, governance, proxy, and the OIDC
    # issuer (HTTPS to any address is allowed for it). The Kubernetes API is
    # opened separately, by an AdminNetworkPolicy to the control-plane nodes
    # for pods labeled saw.redhat.com/kubernetes-api=allow.
    gatewayEgress: []
    # Trusted API reconciler Pods are selected by exact namespace AND label.
    reconcilerNamespace: ""
    reconcilerLabels: {}

oidc:
  issuerUrl: ""
  clientId: openshell-cli
  rolesClaim: realm_access.roles
  adminRole: openshell-admin
  userRole: openshell-user
  caConfigMap: ""
route:
  enabled: true
  host: ""

telemetry:
  # OTLP/gRPC collector for OCSF events from the gateway and its supervisors,
  # e.g. http://saw-ocsf-collector.openshell-agents.svc:4317. Empty: no export.
  ocsfEndpoint: ""
  # Relay the agent's own OpenTelemetry traces through each supervisor to the
  # same collector (OpenShell agent trace relay). Needs ocsfEndpoint.
  agentTraces: false
