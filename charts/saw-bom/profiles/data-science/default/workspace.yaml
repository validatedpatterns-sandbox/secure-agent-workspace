apiVersion: saw.redhat.com/v1alpha1
kind: Workspace
metadata:
  # Use "default" for the default workspace (always exists on the gateway).
  # Set a custom name to create an additional workspace.
  name: default
  description: "Data science workspace with Gemini inference and web search"
spec:
  members:
    - subjectRef: instanceOwner
      role: admin
  inference:
    provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
